以夘時發得藥漸安至午痛復發又進再煎而安近晚再發又進三劑而安睡則不復痛矣如是者月餘存之疑之更他醫藥則痛愈甚藥入痛不止矣以是服仲淳方不疑一年後漸愈服藥六百劑全愈人參三錢白芍藥三錢炙甘草一錢橘紅一錢五分後加木𤓰一錢麥門冬三錢當歸身二錢又重定方人參四錢白芍藥三錢麥門冬三錢甘草一錢五分當歸三錢枸杞子三錢山茱萸肉二錢木𤓰二錢黄檗一錢五分鱉甲二錢又以鹿角膠間服又以飲食少時惡心去當歸黄檗加牛膝三錢秦芁一錢五分石斛二錢酸棗仁三錢延胡索一錢丸方鱉甲北五味白芍藥各四兩當歸身五錢麥門冬牛膝黄檗蜜炙枸杞各四兩炙甘草二兩川續㫁酒洗三兩杜仲酥炙三兩懐熟地五兩山茱萸肉四兩白茯苓三兩車前子二兩五錢懐山藥炒三兩人參人乳浸四兩天門冬酒洗去心鹿角膠各四兩煉蜜丸每服四錢髙存之長郎兩年腹痛愈後又患臂痛每發一處輒於手臂指屈伸之間腫痛不可忍三四日方愈痛時在手即不能動仲淳曰此即前病之餘虛火移走為害也立丸方凡四五更定服至此方全愈治臂痛方懐生地黄一觔牡丹皮濶而厚者良酒蒸六兩山茱萸肉八兩白茯苓為末水澄去筋膜蒸晒再磨以人乳拌晒數次六兩山藥八兩切片炒澤瀉米泔浸切片炒六兩天門冬去心酒蒸烘燥六兩麥門冬去心烘燥八兩五味子如法烘乾八兩牛膝酒蒸八兩黄檗切片蜜拌炒褐色八兩枸杞子去枯者及蒂八兩砂仁二兩炒甘菊花八兩何首烏一觔虎前脛骨二對酒蒸三日酥炙透白蒺藜炒去刺十兩兎絲子三兩為細末煉蜜丸如梧子大每服五錢空心白湯下髙存之壻浦生氣上逆每飯下一二口輒噯氣數十口再飯再噯食頃三四作仲淳曰此氣不歸元中焦不運也每劑須人參二錢不信服他醫快氣藥愈甚逾二三月仲淳云今須參四錢矣不信又逾二三月仲淳云今須參六錢矣不信又逾月飲食不下每嘔冷氣如團而出上下氣不屬分必死存之坐其家迫令服仲淳藥服首劑不動服再煎不動然亦不如他湯藥輒嘔也服三煎忽心口下如爆一聲上則噯氣下則小遺無筭上下洞然即索粥頓食三四盌不上逆也服五六劑減參二錢噯逆復作復用六錢而安一月後方減參二錢服半年全愈人參六錢麥門冬三錢五味子二錢橘紅一錢砂仁一錢白芍藥二錢角沉香五分益智仁一錢五分山茱萸肉三錢真蘇子二錢枇杷葉三大片水煎臨服加沉香汁十五匙逆水蘆根汁一大盞又十倍為末山藥糊丸空心白湯吞陸祚先乃正咳𠻳飽脹痰喘水火不通眠食俱廢人參君白芍藥君蘇子炒研極細佐枇杷葉三大片白茯苓佐二服得眠大小便通啖粥顧仲恭心腎不交先因失意久欝及平日勞心致心血耗散去嵗十月晨起尚未離牀忽左足五指麻冷倐已至膝便不省人事良久而甦乍醒乍迷一日夜十餘次醫者咸云痰厥仲淳云純是虛火服丸藥一劑今春覺體稍健至四月後丸藥不繼而房事稍過至六月初十偶出門前症復發扶歸良久方醒是日止發一次過六日天雨稍感寒氣前症又發二次見今兩足無力畏寒之甚自腹以上不畏寒仲淳云人之五臟各有致病之由謹而察之自不爽也夫志意不遂則心病房勞不節則腎病心腎交病則隂陽將離離則大病必作以二臟不交故也法當清熱補心降氣豁痰以治其上益精强腎滋隂増志以治其下則病本必拔以心藏神腎藏精與志故也平居應獨處曠野與道流韻士討論離慾之道根極性命之源使心境清寧蹔離愛染則情念不起真精自固隂陽互攝而形神調適矣暫服湯液方貝母三錢白茯苓三錢逺志肉一錢五分酸棗仁五錢蘇子二錢石斛三錢麥門冬五錢甘草炙五分木𤓰三錢牛膝八錢石菖蒲一錢人乳和童便浸忌鐵水二鍾煎八分調入牛黄末一分天竺黄末二分竹瀝一大杯臨卧飢時各一服三劑後加人參五錢枇杷葉三片調入牛黄一分天竺黄三分霞天膏五錢丸方逺志肉天門冬麥門冬白茯神白茯苓人乳拌晒各六兩棗仁八兩杜仲四兩懐生地八兩白芍藥六兩甘草蜜炙三兩五錢川黄檗六兩牛膝十兩五味子六兩蜜丸如梧子大每空心服五錢臨卧六錢石斛湯加竹瀝送下忌猪牛羊肉羊血麵蒜胡椒鯉魚牛乳白萊菔一人年三十三嵗因努力即發心腹飽滿疼痛直至臍下皆板兩脇空鬆不可言腹寒即欲就火火至稍睡痛止大便不通小便短縮似宿茶日夜不卧至五週時飲食漸加時常舉發大約性嗜酒善怒勞碌所致仲淳為之疏方用當歸身五錢牛膝四錢麥門冬五錢白芍藥五錢酒炒炙甘草七分五味子一錢廣橘紅二錢茅根打碎一錢五分懐生地三錢宜多食韮菜童便胡桃肉婁東王官夀患遺精聞婦人聲即泄瘠甚欲死醫告術窮仲淳之門人以逺志為君蓮鬚石蓮子為臣龍齒茯神沙苑蒺藜牡蠣為佐使丸服稍止然終不㫁仲淳於前方加鰾膠一味不終劑即愈治腰痛錢晉吾文學腰痛甚診之氣欝兼有傷瘀血停滯仲淳投以牛膝五錢當歸身二錢五分炙甘草一錢紫蘇梗一錢五加皮三錢廣橘紅二錢香附二錢童便炒研細末川續㫁二錢水二鍾煎八分飢時加童便一大杯服二劑愈又方先外祖李思塘公少年患腰痛至不能坐立諸醫以補腎藥療之不効朱逺齋者湖明醫也用潤字號丸藥下之去黒糞數升盖濕痰乗虛流入腎中作苦痰去方以補藥滋腎不逾月起惜其方傳者不真治盜汗予婦幼患此仲淳以二劑療之今二十餘年不發黄耆蜜炙三錢北五味二錢酸棗仁炒研五錢炙甘草一錢麥門冬去心三錢人參三錢白芍藥酒炒三錢香附童便浸炒二錢龍眼肉十枚治噎蘇子研細二錢廣橘紅二錢五分麥門冬去心五錢白芍藥酒炒四錢枇杷葉去毛刷浄蜜炙三大片山查肉三錢白豆蔲仁四分先嚼下人參三錢逆水蘆根汁一大盞河水一鍾半同蘆根汁煎至八分加薑汁三匙竹瀝一杯飢時服治溺有餘瀝精不固兎絲子半觔浄牛膝與何首烏同蒸半觔浄栢子仁去油者酒蒸另研如泥十二兩杜仲四兩浄麥門冬去心六兩枸杞六兩北五味六兩血鹿角一觔鹿茸去毛酥炙六兩車前子米泔浸四兩白茯苓多用人乳拌晒四兩大何首烏赤白各半蒸如法一觔没石子三兩細末煉蜜丸如梧子每服五錢空腹白湯吞治鼻衂腸風腹脹便燥麥門冬去心十兩懐生地十兩天門冬去心六兩五味子去枯者四兩鱉虱胡麻酒拌九蒸九晒去殻另研如泥十二兩山茱萸肉六兩白芍藥八兩當歸身五兩砂仁炒二兩紫蘇子六兩另研後入煉蜜丸如梧子大每五錢空心白湯吞治腿酸足脛痛牛膝去蘆酒蒸八兩杜仲六兩懐生地蒸熟八兩甘枸杞八兩山茱萸肉六兩五味子黄檗各六兩白茯苓三兩砂仁三兩細末煉蜜丸如梧子大每五錢空心白湯吞皆仲淳定補腎固精方北五味如法為細末每服以好酒下方寸匕久之兼可御女治弱症吐血夜熱不眠腰痛陳齋傳紫河車十具男而首胎佳自採側栢葉東南枝去粗梗隂乾四觔將河車入石臼内木杵輕輕搗漸下栢葉以極爛為度起置磁盆内砂鍋上蒸熟烈日曝乾如無日色或夏天將栢葉攤成薄餅於磁盆上火烘乾研細末蜜丸如梧子大空心淡鹽湯下五錢家叔久患腸風百藥不効服此頓釋久𠻳噙化丸仲淳定真龍腦薄荷葉三兩五錢百部酒浸去心三兩五錢麥門冬去心二兩天門冬去心二兩桑白皮蜜炙三兩枇杷葉蜜炙三兩貝母去心二兩桔梗米泔浸蒸去蘆一兩甘草蜜炙七錢天花粉二兩𤣥參一兩北五味蜜炙一兩欵冬花蕋二兩紫苑八錢真柿霜二兩橘紅一兩極細末煉蜜丸如彈子大不時噙化臨卧更佳于中父患目珠痛如欲墮胸脇及背如槌碎狀晝夜咳𠻳眠食俱廢自分不起促仲淳訣别仲淳曰何至是耶令日進童便三大碗七日下黒血無數痛除咳熱如故再投以二冬貝母蘇子橘紅白芍藥鱉甲青蒿子桑根白皮五味子百部枇杷葉竹瀝童便久之未痊太夫人及胞弟潤父疑其虛促用參耆仲淳不可潤父陰以黄耆二錢入前藥嘗之竟夕悶熱目不交睫始信仲淳不謬固守前方兼服噙化丸勿輟逾月平盖中父病起于乃翁之變哀傷過甚更觸惱怒所致非虛也肺熱而實肝火上冲故不宜參耆爾里中一童子年十五患寒熱咳𠻳面赤鼻塞夜劇家人以為傷風仲淳視之曰隂虛也盖傷風之證面色宜黯今反赤而明傷風發熱必晝夜無間今夜劇鼻塞者因虛則火上升壅肺故鼻塞以是知其隂虛也投以麥門冬五味桑皮貝母百部鱉甲生地黄沙參不四劑瘳臧儀部静涵患氣喘自汗晝夜不眠食諸醫以外感治之病甚仲淳診之曰此腎虛氣不歸元故火上浮喘汗交作脾虚故不思食亟以麥門冬五味子枸杞子滋隂斂肺以蘇子橘紅降氣消痰以芍藥酸棗仁茯苓補脾斂汗不數劑瘳趙景之太史未第時因肄業勞心太過患夢遺證已三四年矣不數日一發發過則虛火上炎頭面烘熱手足逆冷終夜不寐補心腎及濇精藥無不用過壬申春偶因感冒來邀診視談及前證之苦予為之疏一丸方以黄檗為君佐以地黄枸杞蓮鬚膘膠山茱五味車前天麥門冬之類不終劑而瘳初時景之意恐黄檗太寒不欲用予謂尊恙之所以久而不愈者政未用此藥耳五臟苦欲補瀉云腎欲堅急食苦以堅之黄檗是矣腎得堅則心經雖有火而精自固何夢遺之有哉向徒用補益收濇而未及此故難取效湖廣張仲虎客邸耽于青樓且多拂意之事至冬底發太寒熱咳𠻳吳中醫者皆以外感治之發表和解無不遍試適毛子晉拉予視之見其神色消耗脈氣虚數中時復一結咳𠻳有血卧不貼席予謂子晉曰此隂虛内傷證也隂精虧竭故脈見虛數内有瘀血故結脈時見肺肝葉損所以卧不能下此不治之證况誤認外感多服發散復蹈虛虛之故耶不數日而殁太學許韜美形體卑弱神氣短少且素耽酒色時嘗齒衂辛未春偶患右乳傍及肩背作痛異常手不可近捫之如火日夜不眠醫以内傷治之服桃仁紅花乳没延胡靈脂等藥廿餘劑不効邀予診視六脈虛數肝腎為甚予㫁為隂虛火旺之證當滋養隂血扶持脾胃俾隂血漸生虛火降下則痛不求其止而止矣如必以和傷治痛為急則徒敗胃氣尅削真元非所宜也疏一方付之用生地牡丹皮芍藥牛膝枸杞續㫁石斛甘草桑枝麥冬蘇子囑其服十劑方有効以隂無驟補之法耳服至八劑後復邀過看診其脈氣漸和精神漸旺向未出房室至此則能步至中堂但痛處未盡除然而生機則躍躍矣惜其欲速太過惑于羣小棄置予方復以前藥雜進一月後胃氣果敗作嘔逆隂血愈耗發潮熱脾氣傷盡作腹脹再半月而死矣已上三條附吐血三要法宜行血不宜止血血不行經絡者氣逆上壅也行血則血循經絡不止自止止之則血凝血凝則發熱惡食病日痼矣宜補肝不宜伐肝經曰五臟者藏精氣而不瀉者也肝為將軍之官主藏血吐血者肝失其職也養肝則肝氣平而血有所歸伐之則肝虛不能藏血血愈不止矣宜降氣不宜降火氣有餘即是火氣降則火降火降則氣不上升血隨氣行無溢出上竅之患矣降火必用寒涼之劑反傷胃氣胃氣傷則脾不能統血血愈不能歸經矣今之療吐血者大患有二一則専用寒涼之味如芩連山梔四物湯黄檗知母之類往往傷脾作泄以致不救一則専用人參肺熱還傷肺咳𠻳愈甚亦有用參而愈者此是氣虛喘𠻳氣屬陽不由陰虛火熾所致然亦百不一二也仲淳立論専以白芍藥炙甘草制肝枇杷葉麥門冬薄荷葉橘紅貝母清肺薏苡仁懐山藥養脾韭菜畨降香真蘇子下氣青蒿鱉甲銀柴胡牡丹皮地骨皮補隂清熱酸棗仁炒研白茯神養心山茱萸肉枸杞子補腎予累試之輒驗然隂無驟補之法非多服藥不效病家欲速其功醫者張皇無主百藥雜試以致殞身覆轍相尋不悟悲夫欝金治吐血聖藥患無真者爾顧季昭患隂虛内熱仲淳云法當用甘寒不當用苦寒然非百餘劑不可慎勿更吾方欲加減使吾徒畧加増損可也果百劑而安天門冬麥門冬桑白皮貝母枇杷葉各二錢地骨皮三錢五味子一錢白芍藥二錢鱉甲三錢蘇子研細二錢車前子二錢王司丞遜之患吐血仲淳診之云多服童便自愈别去貽書門人張選卿曰遜之旋已勿藥矣但相公年尊右手脈弱甚此非細故可致意遜之預為計時文肅公尚無恙不兩月而遜之疾瘳文肅一病不起加味六味地黄丸治吐血趙冠山子服之立起地黄半觔天門冬麥門冬牛膝鱉甲黄檗青蒿五味子橘紅枇杷葉懐山藥山茱萸肉各四兩澤瀉牡丹皮白茯苓煎方蘇子炒研二錢枇杷葉三大片生地黄三錢廣陳皮二錢白芍藥三錢茅根一兩麥門冬五錢桑白皮二錢畨降香一錢二分血止去之貝母二錢牛膝四錢鱉甲四錢甘草一錢天門冬二錢治隂虚喉痛喉間血腥氣聲啞到此便難措手麥門冬三錢天門冬三錢薄荷八分貝母三錢蘇子研一錢橘紅二錢炙甘草一錢百部去心三錢欵冬花蕋二錢鱉甲如法四錢桑白皮如法三錢懐生地三錢河水二鐘煎八分加童便一杯飢時服丸方六味地黄丸中加鱉甲天門冬麥門冬百部五味子真阿膠各如山藥之數煉蜜丸每六錢空心淡鹽湯吞飢時白滚湯吞已上皆仲淳法消渴證湖州庠友張君時泰辛酉正月驟發齒痛十餘日而愈四月間焦勞過多齒痛大發醫用石膏知母等藥投之不効用刀去齒間紫血滿口痛不可忍齒俱搖動矣至六七月間飲食益多小便如注狀如膏肌肉盡削至十一月身不能起冬末用黄耆地黄等藥稍能起立然善食易飢如故小便如膏亦如故今年二三月愈甚亦不服藥齒痛如故當門二齒脫落復加口渴晝夜不止此中下二消證也予為立後方服未數劑而瘳麥門冬五兩五味子三錢黄連三錢蘆根五兩黄耆五錢懐生地黄六錢天門冬一兩用繰絲湯十碗煎二碗不拘時服丸方於前藥中加黄檗三兩牛膝五兩沙參六兩枸杞子四兩五味子六兩蜜丸常服遂不復發婦人治婦人血熱經行先期枇杷葉一觔蜜炙白芍藥半觔酒浸切片半生半炒懐生地黄六兩酒洗懐熟地黄四兩青蒿子五兩童便浸五味子四兩蜜蒸生甘草去皮一兩山茱萸肉四兩黄檗四兩去皮切片蜜拌炒川續斷酒洗炒四兩阿膠五兩蛤粉炒無真者鹿角膠代之重湯酒化杜仲去皮三兩酥炙細末懐山藥粉四兩打糊同煉蜜和丸如梧子大每五錢空心淡醋湯吞飢時更進一服忌白蘿蔔加減正元丹治婦人經不調無子香附一觔同艾二兩醋浸二宿分作四分一分用鹽水炒一分酥炙一分童便浸炒一分和乳瓦上炒當歸身酒洗五兩川芎二兩白芍藥八兩酒浸切片半生半炒生地六兩酒洗阿膠四兩蛤粉炒成珠無則鹿角膠代之枳殻三兩江西者良半生半炒艾二兩用浸香附醋打糊餅晒乾為末米醋煮山藥粉糊丸如梧子大每四錢空腹淡醋湯吞忌白菜菔右八味乃正元丹後加減法也加青蒿子三兩山茱萸肉三兩銀柴胡一兩五味子三兩鱉甲醋炙如法四兩如經調後覺經不行恐有妊娠即勿服如後期去青蒿子銀柴胡鱉甲治血熱經行先期腰腹痛發熱血熱忌用芎歸當用第一方正元丹中去香附換入枇杷葉十兩蜜炙杜仲去皮酥炙三兩鹿角膠蛤粉炒四兩麥門冬去心四兩青蒿子山茱萸肉北五味子各三兩銀柴胡一兩治血虚經行後期白芍藥六兩半生半熟香附四兩童便浸炒蘄艾葉一兩五錢如法懐生地六兩麥門冬六兩杜仲三兩酥炙橘紅二兩枇杷葉六兩甘草一兩五錢半生半炒白膠四兩蛤粉炒成珠研川芎二兩青蒿子四兩童便浸風乾當歸六兩用醋煮懐山藥糊丸梧子大每服五錢白湯送下治血虚經行後期太甚半邊頭疼當歸身白芍藥各二錢五分川芎一錢甘菊花三錢藁本一錢懐生地二錢荆芥穗八分天門冬二錢麥門冬三錢炙甘草一錢五分河水煎臨服加童便一小杯又治經行後期太甚香附一觔四製懐生地五兩白芍藥八兩枳殻二兩砂仁二兩阿膠四兩蘄艾二兩如法為末醋煮懐山藥糊丸梧子大每服四錢空心淡醋湯下一方加懐熟地三兩川芎二兩去砂仁一味俱神效治腎泄兼脾泄肉荳蔲粉裹煨四兩北五味子四兩補骨脂如法製二兩半白芍藥二兩半砂仁一兩半甘草八錢人參三兩吳茱萸湯泡去梗三兩為末山藥粉糊丸如梧子大空心白湯下三錢至五錢治婦人腎泄無子肉荳蔲粉裹煨四兩吳茱萸湯泡二兩五錢補骨脂三兩五味子三兩人參一兩木香不見火六錢砂仁八錢細末山藥粉糊丸如梧子大每服三四錢空腹白湯下李博士本石内人患痰嗽三年骨立矣經不行諸醫或以為積血或以為血枯經閉仲淳云孕也若行血則禍不旋踵但分娩後恐不能全吉爾已而果然安胎將墮欲死方懐生地二兩酒炒砂仁末一兩水酒各二碗煎一碗分作二次服立愈此方出本草予偶閱之傳一門人試之如神保胎資生丸姙娠三月陽明脈養胎陽明脈衰胎無所養故胎墮也服資生丸人參人乳浸飯上蒸烘乾三兩白术三兩白茯苓細末水澄蒸晒乾入人乳再蒸晒乾一兩半廣陳皮去白畧蒸二兩山查肉蒸二兩甘草去皮蜜炙五錢懐山藥切片炒一兩五錢川黄連如法炒七次三錢薏苡仁炒三次又方一兩半白稨豆炒一兩半白荳蔲仁不可見火三錢五分藿香葉不見火五錢蓮肉去心炒一兩五錢澤瀉切片炒三錢半桔梗米泔浸去蘆蒸五錢芡實粉炒黄一兩五錢麥芽炒研磨取净麪一兩右藥共十七味如法修事細末煉蜜丸如彈子大每丸重二錢用白湯或清米湯橘皮湯炒砂仁湯嚼化下忌桃李雀蛤生冷治惡阻即胎前嘔吐