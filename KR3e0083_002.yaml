皆苦燥之劑不能益隂用石斛木瓜牛膝白芍藥酸棗仁為主生地黃甘枸杞白茯苓黃檗為臣甘草車前為使投之一劑輒效四劑而起昔人治病必求其本非虛語也施靈修乃正産後發寒熱咳嗽不止因本元虛弱誤用薑桂勢甚劇數劑輒定鱉甲四錢山查肉五錢橘紅二錢當歸二錢青蒿子二錢五分白芍藥四錢牛膝四錢杜仲二錢五分棗仁八錢逺志肉一錢麥門冬五錢五味子一錢生地黃四錢茯神三錢益母草五錢竹葉三十片偶傷風加荆芥一錢防風五分咳嗽甚加桑白皮三錢有痰加蘇子貝母各二錢腰痛加枸杞子五錢閼血未盡加黑豆炒一大把脾胃不佳去牛膝生地益母草丸方鱉甲六兩牛膝酒蒸六兩青蒿子四兩懷生地白芍藥棗仁各六兩當歸身真阿膠重蕩酒頓化入藥各四兩白茯苓六兩逺志肉杜仲各三兩麥門冬六兩五味子四兩枸祀子六兩懷山藥切片炒黃四兩牡丹皮酒蒸二兩五錢山茱萸肉四兩砂仁炒二兩牡蠣粉火煅通紅淬入醋中如此七次研如飛麵三兩細末煉蜜丸如梧子大每五錢空心白湯吞飢時更進一服黃桂峯乃正産後頭疼大便祕用生料五積散一劑不效仲淳加歸身一兩一服大便通頭疼立止張璇浦乃正産六朝發狂持刀殺人隂血暴崩肝虛火炎故也仲淳令先飲童便一甌少止再服龍齒澤蘭生地當歸牛膝茯神逺志酸棗仁大劑仍加童便頓服而止王六息乃正産後驚悸聞聲輒死非用力抱持則虛煩欲死如是纍月仲淳曰此心脾肝三經俱虛也用人參酸棗仁茯神逺志芍藥石斛甘草麥門冬五味丹砂為丸以龍眼湯吞彌月而愈賀函伯乃正小産後隂血暴崩作暈惡心牙齦浮腫喉嚨作痛日夜呌號不絶仲淳曰此證因失血過多隂氣暴虧陽無所附火空則發故炎上胸中覺煩熱所謂上盛下虛之候也法當降氣氣降則火自降矣火降則氣歸元而上焦不煩熱齒齦腫消喉嚨痛止陽交於隂而諸病自已爾蘇子研細二錢五分麥門冬去心四錢白芍藥酒炒四錢青蒿子二錢五分牛膝四錢五味子打碎五分鱉甲生地黃甘枸杞各四錢枇杷葉三大片川續斷二錢酸棗仁炒爆研五錢橘紅二錢河水二鍾半煎一碗加童便一大杯鬱金汁十二匙空心服時進童便一杯莊斂之次女産後惡露未淨至夜發熱脾胃却弱腰腹大痛時師謂産後氣血俱虛投以人參當歸諸補劑轉劇斂之深以為憂恐其成蓐勞也余診視之謂不數帖即痊矣安用過慮為為疏一方白芍藥二錢紅麯二錢山茱萸肉四錢橘紅一錢五分麥門冬四錢蘇子二錢車前子二錢炙甘草八分乾葛一錢半白稨豆三錢杜仲三錢牛膝五錢黑豆八錢澤蘭一錢青蒿子四錢十劑而惡露淨發熱已腹痛亦止但腰痛尚未盡除而脾胃尚未健更為改定一方白芍藥一錢山查肉三錢橘紅三錢砂仁二錢麥芽三錢石斛三錢蓮肉四十粒白稨豆三錢杜仲二錢五味子一錢山茱萸肉二錢炙甘草五分沙參三錢牛膝五錢十餘劑脾胃亦佳其疾遂瘳調理丸方懷生地熟地各五兩麥門冬去心甘枸祀去枯者及蒂各六兩杜仲如法川續斷去蘆各五兩五味子三兩柏子仁如法六兩酸棗仁炒爆研六兩茯苓三兩青蒿子四兩山藥五兩炒山茱萸肉五兩牡丹皮濶而厚者三兩半鹿角膠酒化入藥六兩橘紅三兩砂仁炒二兩細末煉蜜和丸如梧子大每服五錢空心淡鹽湯吞忌食鯽魚子白萊蔔治女人血崩人參黃茋麥門冬各三錢五味子七分杜仲熟地山茱萸各二錢枸杞子三錢續斷一錢荆芥穗八分炒阿膠二錢河水煎日進三服又丸方黃耆二兩蜜炙人參一兩熟地二兩白芍藥一兩五錢酒浸切片半生半炒五味子懷山藥續斷酒洗杜仲酥炙柏子仁酒浸二宿蒸搗如泥青蒿子童便浸隂乾麥門冬酸棗仁各一兩五錢炒鹿角膠三兩酒頓化共末將酒化鹿角膠柏子仁泥同煉蜜丸如梧子大每服五錢空心白湯下董龍山夫人患血崩由于中年鬱怒諸醫百藥不效用大劑參耆遍覔胎髮百餘丸火煅調入藥服久之漸愈火煅髮用小砂罐鹽泥煉極熟將髮入罐中封固隂乾以炭火圍之俟黑煙將盡即起若青煙出髮枯不可用矣非細心人不可任蓋火候不可過也顧太學叔夏內人舟中為火所驚身熱羸弱幾成瘵羣醫誤投參茋勢危甚仲淳以清肌安神之劑與之戒以勿求速效凡數十劑而安麥門冬二錢鱉甲小便炙三錢青蒿子銀柴胡桑白皮自採忌鐵蜜炙各二錢五味子一錢枇杷葉二錢白芍藥一錢生地黃酒洗一錢薏苡仁三錢包海亭夫人患腹痛連少腹上支心日夜靡間百藥不效仲淳診其脈兩寸關俱伏獨兩尺實大按之愈甚詢知其起自暴怒風木鬱于地中投以芎藭上柴胡中升麻下下咽噯氣數十聲痛立巳巳而作喘仲淳曰是升之太驟也以四磨湯與之遂平甲申夏舊婦因鬱火痰喘身熱手拳目張半月不眠食按其胃口不痛諸醫疑其虛也或云中暑百藥試之痰喘滋急以皂角末喋鼻通竅痰上逆如沸延楊石林疹視請亟吐之先大夫曰病久矣虛甚可奈何石林曰經云上部無脈下部有脈其人當吐不吐則死即以鹽湯吞之去白痰數碗喘定先大夫曰何以藥之石林曰吐即藥也待其熟寢勿服藥以養胃氣夜半啜粥二碗詰且投六君子湯數劑而起石林者里中博雅士不行術而精方脈者也髙存之夫人患心口痛一日忽大發胸中有一物上升沖心三婦人用力捺之不下呌號欲絶存之曽預求仲淳立此方是日急煎服之服一盞沖上者立墮下腹中作痛不升矣再服腹中痛者亦消二日後以病愈起洗沐又忽作嘔頭痛如劈存之曰此即前症煎前藥服之立安白芍藥酒炒三錢炙甘草五分吳茱萸湯泡三次八分白茯苓二錢延胡索醋煮切片一錢蘇子炒研一錢五分橘紅鹽水潤過一錢二分後加半夏一錢薑汁拌炒旋覆花一錢木通七分竹茹一錢豫婦今春忽患心痛連下腹如有物上下撞痛不可忍急以手重按之痛稍定按者稍鬆即呌號仲淳曰此必血虛也脈之果然急投以白芍藥五錢炙甘草七分橘紅三錢砂仁砂三錢炒鹽五分二劑稍定已久以牛黃蘇合丸疏其氣噯氣數次痛徐解豫問故仲淳曰白芍藥甘草治血虛之聖藥也因久鬱氣逆故減甘草之半仲景甲巳化土之論詳矣諸醫不解爾炒鹽者何曰心虛以炒鹽補之即水火既濟之意也豫懼俗師槩以痰火食積療心腹之痛故疏其詳如左昔年豫過曲河適王宇泰夫人病心口痛甚日夜不眠手摸之如火豫問用何藥曰以大劑參歸補之稍定今尚未除也曰得無有火或氣乎宇泰曰下陳皮及涼藥少許即脹悶欲死非主人精醫未有不誤者豫又存此公案以告世之不識虛實而輕執方者梁溪一婦人喉間如一物上下作梗前後板痛服仲淳方二十劑全愈畨降香一錢川通草五分二味服三劑去之蘇子三錢橘紅二錢枇杷葉三片人參一錢炙甘草七分石菖蒲一錢麥門冬三錢甘菊花二錢白芍藥三錢逺志一錢白豆蔲仁四分木瓜二錢石斛酒蒸二錢加蘆根汁一鍾同煎入薑汁二匙梁溪一女子頭痛作嘔米飲不能下仲淳云因於血熱血虛火上炎麥門冬五錢橘紅二錢枇杷葉三大片蘇子一錢五分白芍藥三錢木瓜二錢白茯苓二錢甘菊花一錢五分烏梅肉二枚竹瀝一杯蘆根汁半碗一二劑嘔止頭尚痛加天門冬二錢頭痛少止再加土茯苓二兩小黑豆一撮全愈白帶赤淋婦人多憂思鬱怒損傷心脾肝火時發血走不歸經此所以多患赤白帶也白帶多是脾虛蓋肝氣鬱則脾受傷脾傷則濕土之氣下陷是脾精不守不能輸為榮血而下白滑之物矣皆由風木鬱於地中使然耳法當開提肝氣補助脾元宜以補中益氣湯加酸棗仁茯苓山藥黃檗蒼术麥冬之類濃煎不時飲之再用六味丸中加牡蠣粉海螵蛸杜仲牛膝蜜丸光大如豆空心飢時吞下五六錢隂虛火熾加枸杞子五味子黃檗白帶多屬氣虛補氣健脾治法之要領也帶下如濃泔而臭穢特甚者濕熱甚也且多有濕痰下墜者宜蒼术白术黃檗黃芩茯苓車前子為主佐以升提帶下如雞子清者脾腎虛極也面色必不華足脛必浮腰腿必酸宜五味子八味丸間用開脾養心之劑如歸脾湯之類隂虛有火宜六味丸中加五味子兔絲子車前子黃檗叔和云崩中日久為白帶漏下多時骨肉枯蓋言崩久血氣虛脫而白滑之物下不止耳此症雖有血氣寒熱之分要歸總屬於虛赤淋多因於心火肝火時熾不已久而隂血漸虛中氣漸損遂下赤矣治宜養心為主兼以和肝緩中涼血清氣赤帶久不止則血虛宜膠艾四物湯加便煅牡蠣粉酸棗仁麥門冬標急而元氣不甚憊者先救其標標急而元氣衰劇者則當本而標之也治白帶蛇床子米泔淘取沈水者蒸晒乾去皮炒為細末每一兩加枯白礬末五分山茱萸肉五味子車前子米泔浸蒸香附醋煮各三錢細末山藥糊丸如梧子大每四錢空心淡醋湯吞飢時再進一服後用四物湯加山茱萸五味子炒砂仁白芍藥杜仲黃檗車前子各等分鹿角膠醋化丸如梧子大每日空心白湯吞五錢調理自除治老年白帶黃檗去粗皮切片蜜炒四兩砂仁炒二兩杜仲去皮切片鹽酒炒去絲四兩川續斷酒洗二兩補骨脂酒浸瓦上炒三兩川芎二兩香附八兩醋浸二宿晒乾分作四分一分酥炙一分童便炒一分醋炒一分鹽水炒蘄艾用浸香附醋炒加山藥粉煮作糊拌艾打成餅晒乾一兩五錢山茱萸肉四兩白茯苓如法水澄蒸晒乾二兩白芍藥酒浸六兩半生半炒鹿角膠醋化五兩北五味蜜蒸四兩車前子米泔浸蒸晒乾二兩牡蠣粉火煅醋淬研如飛麵三兩細末和鹿角膠丸如梧子大空心淡薑湯送下五錢庶母因兒痘驚苦積勞虛煩不得卧心膽虛怯觸事驚悸百藥不效家弟長文偶于友人許聞興化陳丹崖療一女人甚奇其症與母類叩其方乃溫膽湯也試之數劑而效半夏七錢竹茹枳實各三錢陳皮四錢半白茯苓炙甘草各二錢二分半分二劑薑棗煎服外加酸棗仁五錢後因虛極加人參二錢質之仲淳曰此必有痰而善飯者也果然先安人因亡女忽患腰痛轉側艱苦至不能張口受食投以鹿角膠不斂以濕痰療之亦不斂遍走使延仲淳曰此非腎虛也如腎虛不能延至今日矣用白芍藥三錢橘紅二錢白芷二錢炙甘草一錢香附童便浸炒三錢肉桂二錢乳香沒藥各七分半燈心同研細臨服下之一劑腰脫然覺遍體疼仲淳曰愈矣再煎滓服立起豫駭問故仲淳曰此在素問木鬱則達之顧諸君不識爾姚公逺內子病延仲淳入診其繼母乘便亦求診仲淳語伯道曰婦病不足慮嫂不救矣聞者駭甚曰吳方新婚亡大恙何至是耶豫私扣之仲淳曰脈弦數真弱症也不半嵗夜熱咳嗽勢漸劇倉皇延仲淳疏方豫之曰此盡吾心爾病不起矣逾年醫家百藥雜試竟夭瞿元立夫人素清癯不耐煩勞一日謂仲淳曰弟婦未生子而弱煩兄為診其故次日仲淳往診得其脈弦細無神趙文肅公問曰兄從元立許來診其嫂得何脈曰今雖無恙必不久矣文肅頓足曰有是哉天胡厄善人甚耶此丙戌事也至秋夫人殁祝氏婦年五十餘患中滿腹脹兼崩漏下虛清上則下虛彌甚實下則上脹彌甚仲淳為立二方以蘇子石斛陳皮貝母𤣥參人參白芍藥治其上以地榆阿膠木瓜牛膝杜仲茜根椿皮治其下各為丸分食前後服之漸愈顧太學叔夏內人患隂虛火證徹夜不眠者兩月飲食俱廢形體日削中外疑其必無救矣豫為之診視決其必無大害第要多需時日耳用大劑人參棗仁茯神逺志生地當歸五味麥冬因虛甚氣怯佐以琥珀辰砂金銀器之類約百餘劑而瘳後友人詢其故豫謂此病雖屬虛幸臟腑無損心經雖有火幸不至爍肺多服補隂收斂之劑則水火自然升降所云壯水制陽光正此謂耳至于久病脈調身不發熱豈有他虞哉太學朱方仲內人稟賦極弱兼之作勞善怒內熱怔忡膽虛氣怯已三四年矣壬申夏忽發厥冒痰氣上升則兩目上竄手足發搐不省人事初時一日一發三四日後則連發不止日夜幾百次牛黃竹瀝遍嘗不效豫計已窮意欲用參附峻補因其時常口渴大便不通不敢輕投適一友至極其讃決謂非附不可强用附子二錢人參六錢作一劑投下午後進藥黃昏發大熱煩躁渴甚不兩日斃矣此固非因附子而然第證候決不宜用僥幸之愈念漫試也上三條附先醒齊廣筆記卷二
