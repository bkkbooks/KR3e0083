body:
  text: 先醒齊廣筆記卷二明繆希雍撰脾胃黃病有積神方一平頭試之神驗蒼术炒厚朴薑汁炒橘紅甘草山查肉白茯苓麥芽各二兩檳榔一兩緑礬火煅研細一兩五錢為末棗肉丸如梧子大每服一錢白湯吞日三服凡服礬者忌食蕎麥河豚犯之即死治老人傷冷食及難化之物生薑或紫蘇煎湯置浴鍋內令病者乘熱浸湯內以熱手揉心胃肚腹氣通食化矣又方蘄艾灸胃脘并肚氣從口鼻出立愈治胃脘痛屬火證者一女婢患此數十年一劑良已橘紅淡豆豉山梔仁炒黑各三錢生薑五片枳殼一錢水一鍾半煎七分服又治胃脘痛仲淳療瑀母方橘紅二錢白豆蔲仁五分香附童便炒忌鐵研細三錢延胡索醋煮切片粒粒金黃色者良二錢五分白芍藥酒炒四錢甘草四分炙白茯苓三錢白木香五分磨汁入煎藥肉紫蘇子研二錢紫蘇梗二錢河水二鍾煎一鍾不拘時服豆蔲仁口嚼之下藥又方口渴肩骨疼酸痛不能飲食者神效真紫蘇子隔紙焙研細橘紅白茯苓各三錢竹茹二錢白芍藥酒炒四錢木瓜忌鐵三錢石斛酒蒸三錢酸棗仁炒爆研四錢麥門冬五錢甘草五分白豆蔲仁四分先嚼下飢時服治胃中有痰欲吐陳潜齊傳廣橘紅瓜蔞仁各四兩薑汁竹瀝和丸梧子大食後服治脾經痰飲五更咳嗽喉中如有物咽之不下服之甚驗仲淳立白茯苓四兩蘇子另研如泥入藥同搗三兩白豆蔲仁七錢貝母去心三兩括婁根三兩薄荷葉一兩五錢連翹三兩硼砂另研如飛麵七錢廣橘紅四兩麥門冬去心三兩猫兒殘葉六兩山查肉三兩麥芽炒取淨麵一兩五錢神麯炒一兩五錢出峽江縣霞天膏麯四兩枇杷葉四兩為極細末懷山藥粉糊和丸如麻子大白湯吞三四錢治痰嗽吐不已胸膈有冷物上塞飲熱湯稍下橘紅白茯苓蘇子研細瓜蔞仁蛤粉拌炒研細各三錢半夏薑汁炙一錢逺志去心甘草汁浸蒸一錢五分白豆蔲仁五分吳茱萸湯泡去梗一錢河水二鍾半煎八分飢時服加薑汁五匙竹瀝一杯化痰生津噙化丸治膠痰不治隂虛痰火五倍子揀粗大者安大鉢頭內用煮糯米粥湯浸蓋好安靜處七日後常看待發芽黃金色又出黑毛然後將箸試之若透內無硬即收入粗瓦鉢中擂如醬連鉢日中晒至上皮乾了又擂勻又晒晒至可丸方丸彈子大晒乾收用其味甘酸能生津化痰治痰用樞木葉搗煎湯不時呷漸漸痰少兼治膈氣嘔吐趙太學文度頑痰積血仲淳以霞天膏加化痰消瘀之劑治之而愈痰厥金壇庠友張逢甫內人方食時觸暴怒忽仆地氣遂絶延一醫視之用皂角灰吹鼻中不喋用湯藥灌之不受延至午夜謂必不治醫告去逢甫急叩莊一生一生過視之六脈尚全而獨氣口沈伏細尋之滑甚曰此肝木之氣逆衝入胃胃中素有痰致痰夾食閉胃口氣不得行而暴絶也但歷時久湯藥不入矣急宜吐之可活所謂木鬱則達之也亟令覆其身垂首向床下以鵝翎蘸桐油啓齒探入喉中展捎引吐出痰與食才一口氣便稍通再探吐至兩三口便覺油臭以手推翎但不能言一生曰無妨矣知其體怯不宜多吐急煎枳橘推蕩之藥灌之盡劑而蘇後以平肝和胃藥調理數劑復故此因暴怒怒則氣上逆痰因氣壅故現斯證耳所謂痰厥也治厥往往有誤豫故表其證以示後來云飲飲與痰不同痰膠黏而飲惟水治法亦異飲雖有五總之或緣飲酒過多酒後發渴多飲茶湯或好飲冷酒或因天暑煩渴多飲凉水及氷因酒而得者則多濕熱因飲冷而得者則多寒濕或因欎而得者則屬木氣侵脾藥亦小有不同要以降氣燥濕散欎健脾行水為宗乃治法之要領也方半夏薑汁明礬浸透四兩廣陳皮去白四兩白茯苓四兩猪苓二兩澤瀉米泔浸炒二兩旋復花蒸三兩厚朴薑汁炒一兩五錢白术土炒二兩枳實二炒兩人參一兩酒濕者加川黃連一兩木香五錢寒濕者加蒼术二兩木香五錢白豆蔲五錢因鬱者加紫蘇四兩去蒼术右為細末稀米糊入薑汁和丸如菉豆大每五錢淡薑湯下連進三服空心飢時皆可服如卒急不及治丸取二十倍中一倍作湯入豆蔲仁末木香汁薑汁和飲亦立效丹陽葛文學宇十內人因作家勞鬱患飲證每發吐嘔不已腸如欲出所吐俱清水動以盆桶計日夜不止不思飲食就醫金壇諸醫以健脾行氣理鬱清痰藥投之愈劇困頓待斃宇十計無復之矣適豫偶從苕上來莊斂之與宇十姻戚也向余語故余即與斂之偕往視脈審證知為飲無疑乃用前方加人參三錢一劑吐止再劑霍然隨啖粥糜脾氣漸復至今每病作檢余方服之即平雲間康孟修患寒熱不食久之勢甚危以治寒熱劑投不應遍檢方書與王宇泰議投五飲丸立瘥蓋飲證原有作寒熱之條故治飲病自去矣治痺方朱比部大復傳真茅山蒼术十斤洗淨先以米泔浸三宿用蜜酒浸一宿去皮用黑豆一層拌蒼术一層蒸二次再用蜜酒蒸一次用河水砂鍋內熬濃汁去渣隔湯煮滴水成珠為度每膏一斤和煉蜜一斤白湯調服一老人専用此方八十餘身輕趫捷甚於少年蘄州何刺史年七十餘守桐川飲啖過少年叩其故曰平生服蒼术丸每日數錢真茅山蒼术四斤如法洗浸去皮切片以桑椹懷生地何首烏各一斤熬濃汁至無味而止去渣濾清下蒼术浸之晒乾復浸汁盡為度細末又以人乳拌勻晒乾數次約重數兩煉蜜為丸白湯或酒吞治蠱脹由于脾虛有濕黃司冦葵峰中年病蠱得異方乃真茅山蒼术末也每清晨米飲調三錢服不數月强健如故終身止服术七十餘終少停疾作矣又方通血香一錢取小葫蘆一個不去子膜入香在內再入煮酒仍以所開之蓋合縫封之以酒入鍋懸葫蘆酒中挨定不可傾側蓋鍋密煮以三炷線香為率煮時其香透達牆屋外煮完取葫蘆內子膜并藥烘乾共為細末每服一錢空心酒送下間五日服一錢服盡葫蘆內藥約有五六錢之數病已釋然矣通血香陜西羊絨客人帶來蘇杭有又方徐文江夫人病蠱脹張漣水治之百藥不效張曰計窮矣記昔年西山有一嫗患此意其必死後過復見之云遇一方上人得生徐如言訪嫗果在也問其方以陳葫蘆一枚去頂入酒以竹筯鬆其子仍用頂封固重湯煮數沸去子飲酒盡一吐幾死吐後腹漸寬調理漸愈蓋元氣有餘而有痰飲者也若腎虛脾弱者宜用金匱腎氣丸十全大補湯去當歸加車前子肉桂沈孝通觀察中年無子患中滿蠱脹勢孔棘靜養郭外小園中翛然獨坐獨宿食淡者五年歸脾湯六味地黃丸朝暮間服不輟連舉二子顧奉常務逺目黃脾氣弱仲淳疏方用山茵陳三錢人參三錢薏苡仁三錢蓮肉焙三錢木通八分黃連酒炒一錢山梔仁炒八分白术土炒一錢石斛酒蒸三錢皆治疸之劑以事冗未服既而身目皆黃小便亦赤乃服仲淳先見飲前藥稍愈一按摩者投以草汁藥酒脾敗遂不起臨沒下瘀血數升亦蓄血證也以其年邁不絶欲故爾前方尚有茯苓二錢施靈修乃兄七年前曽患疸症服草藥愈後復發坐多氣多勞故草藥不效服田螺發脹一日夜大作寒熱因發渴小便如油眼目黃且赤手足黃紫仲淳以閼血發黃服後藥大小便通黃及渴俱減橘紅一錢五分紅麯炒研二錢山查肉五錢鬱金汁十五匙薏苡六錢木瓜忌鐵三錢牛膝去蘆酒蒸五錢五分麥門冬去心五錢車前子二錢五分赤茯苓三錢川通草五分白芍藥酒炒四錢竹茹二錢河水二鍾煎八分飢時服三日後加人參三錢孫俟居比部病腹中若有癥瘕不食不眠煩悶身熱仲淳投以人參芍藥茯苓麥門冬木通棗仁石斛方甫具史鶴亭太史至見方中有大劑人參駭曰向因投參至劇此得無謬乎仲淳曰病勢先後不同當時邪未退滯未消故不宜今病久飽脹煩悶者氣不歸元也不食者脾元虛也不眠而煩者內熱津液少也今宜亟用此藥矣四劑而瘳後復病仲淳診之曰此隂虛也非前證矣更以麥門冬白芍藥甘枸杞五味子生地黃車前子而熱遂退神效沉香丸又名聚寶丹真沉香二錢真麝香八分血竭一錢五分乳香一錢五分縮砂仁二錢木香二錢𤣥胡索一錢沒藥五分細末糯米糊丸如彈子大用辰砂一錢五分為衣治男子翻胃嘔吐飲食不通此是胃腕寒痰結阻諸醫無效屢試神驗燒酒磨服男婦腹痛諸氣作痛産後血氣攻心用陳酒磨服如熱氣痛葱湯嚼下小兒天弔作痛啼呌不已葱湯磨服太學顧仲恭遭乃正之變復患病在牀延一醫者診視驚訝而出語其所親云仲恭病已不起只在旦晚就木可速備後事仲恭聞知憂疑殊甚舉家惶惶計無所出來請豫疹脈按其左手三部平和右手尺寸無恙獨關部杳然不見諦視其形色雖尫羸而神氣安靜豫詢之曽大怒乎病者首肯云生平不善怒獨日來有拂意事惱怒異常豫曰信哉此怒則氣并于肝而脾土受邪之證也經云大怒則形氣俱絶而况一部之脈乎甚不足怪第脾家有積滯目中微帶黃色恐成黃疸兩三日後果遍體發黃服茵陳利水平肝順氣藥數劑而瘳李文孺四年前曽患黃疸嗣後每診其脈甚沈澀肝脾尤甚望其面色如黃土豫嘗私語相知云文孺色脈不佳恐非久于人世者且又好勞損神多怒傷氣後疸果復發不起已上二條附泄瀉天地之間動靜云為者無非氣也人身之內轉運升降者亦氣也天地之氣不和則山川為之崩竭人身之氣不調則腸胃失其轉輸外則風寒暑濕之交侵內則飲食勞倦之不節腸胃因之而變此泄瀉之由也致疾之端匪一治療之法自殊經云春傷於風夏生餐泄春者木令風為木氣其傷人也必土臟受之又風為陽邪其性急速故其泄必完穀不化洞注而有聲風之化也古之所謂洞風是也宜先以風藥發散升舉之次用參茋白术茯苓大棗甘草肉桂等藥以制肝實脾芍藥甘草乃始終必用之劑傷暑作瀉必暴注大孔作痛火性急速失於傳送也口多渴小便多赤或不利身多發熱瀉後則無氣以動熱傷氣也清暑用十味香薷飲清暑益氣湯內虛之人中氣不足用六和湯不止用黃連理中湯或加減桂苓甘露飲腎泄者難經所謂大瘕泄也好色而加之飲食不節者多能致此其泄多於五更或天明上厠溏而弗甚纍年弗瘳服補脾胃藥多不應此其候也夫脾胃受納水穀必藉腎間真陽之氣熏蒸鼓動然後能腐熟而消化之腎臟一虛陽火不應此火乃先天之真氣丹溪所謂人非此火不能有生者也治宜益火之原當以四神丸加人參沈香甚者加熟附茴香川椒又有醉飽行房腎氣虛乏濕熱乘之下流客腎久泄不止治宜升陽除濕次用八味丸加山藥茯苓地黃減半腎司二便久泄不止下多亡隂當求責腎破故紙肉豆蔲茴香五味子之屬不可廢也白术陳皮雖云健胃除濕救標則可多服反能瀉肝以其燥能損津液故耳長夏濕熱令行又嵗濕太過民多病泄當専以風藥如羌活防風升麻柴胡白芷之屬必二三劑緣除風能勝濕故也泄而少食胃弱故也人參為君稨豆橘皮佐之泄而食不消縮砂人參肉豆蔲泄而腹痛白芍藥炙甘草防風木香泄而氣弱乾葛人參白术白茯苓泄而小水不利車前子末木通中焦有濕熱者當用猪苓澤瀉肉積作瀉用肉豆蔲山查蒜麵積作瀉蘿蔔子感寒而瀉理中湯加紫蘇濕痰作瀉半夏白术茯苓為君神麯為佐九製黃連最能止瀉須與人參等分乃可蓋久瀉不止多緣氣虛純用苦寒胃氣愈閉又下多亡隂必用人參亦陽生隂長之意也然此亦指腸胃虛熱者而言如虛寒者不宜概用脾腎雙補丸治腎泄人參去蘆一斤蓮肉去心每粒分作八小塊炒黃一斤兔絲子如法另末一斛半五味子蜜蒸烘乾一斤半山茱萸肉揀鮮紅肉厚者去核烘乾一斤真懷山藥炒黃一斤車前子米泔淘淨炒十二兩肉豆蔲十兩橘紅六兩砂仁六兩炒最後入巴㦸天十二兩甘草汁煮去骨補骨脂圓而黑色者佳鹽水拌炒研末一斤為細末煉蜜和丸如菉豆大每五錢空心飢時各一服如虛而有火者火盛肺熱者去人參肉豆蔲巴㦸天補骨脂忌羊肉羊血梁溪一女人茹素患內熱每食腸鳴清晨大瘕泄脾腎雙補丸內去肉豆蔲以白芍藥代之外加白稨豆十二兩立愈無錫秦公安患中氣虛不能食食亦難化時作泄胸膈不寬一醫誤投枳殼青皮等破氣藥下利完穀不化面色黯白仲淳用人參四錢白术二錢橘紅錢許乾薑泡七分甘草炙一錢大棗肉豆蔲四五劑漸愈後加參至兩許全愈三年後病寒熱不思食他醫以前病因參得愈仍投以參病轉劇仲淳至曰此隂虛也不宜參乃用麥門冬五味子牛膝枸杞芍藥茯苓石斛酸棗仁鱉甲等十餘劑愈從妹患泄後虛弱腹脹不食季父延諸醫療之豫偶問疾見其用二陳湯及枳殼山查等味豫曰請一看病者見其向內卧眠兩手置一處不復動曰元氣虛甚矣法宜用理中湯恐食積未盡進以人參三錢橘紅二錢加薑汁竹瀝數匙夜半思粥神思頓活季父大喜盡謝諸醫再以六君子湯加山查肉砂仁麥門冬調理之數劑立起治腹痛作泄豫患腹痛泄日十餘度仲淳以一劑止之人參一錢五分蒼术米泔浸炒三錢黃連薑汁炒三次一錢北五味蜜蒸一錢橘紅一錢五分肉豆蔲吳茱萸湯泡白茯苓各一錢藿香五分莊斂之平日素壯實善啖丁巳四月忽患泄瀉凡一應藥粥蔬菜入喉覺如針刺下咽即辣因而滿腹絞辣隨覺腹中有氣先從左升次即右升氤氲遍腹即欲如厠彈響大泄糞門恍如火灼一陳甫畢一陳繼之更番轉厠逾時方得離厠諦視所泄俱清水盈器白脂上浮藥粥及蔬菜俱不化而出甚至夢中大遺了不收攝諸醫或云停滯或云受暑或云中寒百藥雜投竟如沃石約月餘大肉盡脫束手待斃斂之有孀母朝夕相視哀號呼天恨不以身代也余於仲夏末偶過金壇診其脈洪大而數知其為火熱所生病為疏一方用川黃連三錢白芍藥五錢橘紅二錢車前子三錢白稨豆三錢白茯苓三錢石斛三錢炙甘草一錢祝其煎成將井水澄冷加童便一杯始服臨别再三叮嚀云此方勿出以示人恐時師見之大笑不已也若為軀命計須堅信服之耳斂之却衆醫下鍵煎服藥方入喉恍如飲薄荷汁𨼆𨼆沁入心脾腹中似别成一清凉世界甫一劑夜卧達旦洞瀉頓止連服三劑大便已實前泄時藥粥等物凡溫者下咽腹中遂覺氣升即欲大解一切俱以冷進方快家人日以為常至是啖之覺惡心畏冷旋易以溫始相安余曰此火退之徵也前方加人參二錢半蓮肉四十粒紅麯一錢五分黃耆三錢升麻五分黃連減半五六劑後余將返長興斂之持方求余加減余曰此已試效方宜固守多服但去升麻可耳越月餘余再過金壇斂之頻顣向余曰自先生去後守方煎服幾三十餘劑矣今瀉久止而脾氣困頓不知飢飽且稍飲茶湯覺腸滿急脹如欲寸裂奈何余曰大瀉之後是下多亡隂也法宜用補倘此時輕聽盲師妄用香燥諸藥取快暫時元氣受傷必致變成蠱脹即不救矣復為疏一丸方人參五兩白芍藥六兩炙甘草一兩五味子六兩綿黃耆五兩山茱萸肉五兩懷山藥五兩熟地黃八兩牛膝六兩紫河車二具蜜丸空心飢時各一服而日令進前湯液方斂之相信甚力堅守二方服幾三年脾胃始知飢而嗜食四體亦漸豐矣斂之恆對余言每遇脾胃不和時或作瀉覺腹中有火則用黃連否則去之一照余方修治煎服泄遂止而脾頓醒迄今以余所疏方儼如重寶什襲珍藏謂余不啻起死而生之也其病初平後余勸其絶欲年餘斂之因出妾得盡發家人私謀乃知向之暴泄由中巴豆毒本草中巴豆毒者用黃連冷水解之余用大劑黃連澄冷方服政為對治向使如俗醫所疑停滯受寒中暑法治之何啻千里即信為是火而時師所投黃連不過七八分至錢許止矣況一月之瀉未有不疑為虛寒者用黃連至四錢此俗醫所必不解也向余祝其勿出以示人為是故耳始知察脈施治貴在合法神而明之存乎其人耳余治斂之瀉止後恐其元氣下陷急宜升舉用升麻以提之初不知其為中毒也乃因用升麻太早致濁氣混于上焦胸中時覺似辣非辣似嘈非嘈迷悶之狀不可名狀有時滴酒入腹或啖一切果物稍辛溫者更寃苦不勝莊一生知其故曰此病在上焦湯液入口即下注恐未易奏功宜以噙化丸治之用貝母五錢苦參一兩真龍腦薄荷葉二錢沉香四錢人參五錢為極細末蜜丸如彈子大午食後臨卧時各噙化一丸甫四丸胸中恍如有物推下三年所苦一朝若失治泄瀉在陽明胃太隂脾經者白茯苓三錢白术炒二錢炙甘草三錢車前子炒三錢陳皮二錢升麻五分乾葛一錢薑三大片砂仁炒一錢川黃連一錢五分薑汁炒如無濕熱者去之河水二鍾加棗肉二枚飢時服治大便不通張選卿屢驗硃砂研如飛麵五錢真蘆薈研細七錢滴好酒少許和丸每服一錢二分好酒吞朝服暮通暮服朝通須天晴時修合為妙唐震山年七十餘闕此血液枯槁之候用大肉蓯蓉三兩白酒浸洗去鱗甲切片白湯三碗煎一碗頓飲飲竟大便通胸中快然偶一醫問疾曰此劫藥也當調補脾胃為主易以白术厚朴茯苓陳皮病如故唐翁曰誤矣仍飲前藥立解髙存之聞而叩其故仲淳曰肉蓯蓉峻補精血驟用之反動大便藥性載甚明也虛弱天王補心丹陳練塘先生得自蠻洞中寧心保神益氣固精壯力强志令人不忘清三焦化痰涎去煩熱除驚悸療咽乾養育心神人參懷山藥堅白者麥門冬去心當歸身酒洗各一兩懷生地天門冬去心各一兩三錢三分丹參去黃皮八錢百部去蘆土白茯神去粗皮堅白者良石菖蒲去毛柏子仁去油者佳另研甘草長流水潤炙北五味去枯者杜仲以上七味各六錢六分逺志三錢三分白茯苓一兩五錢四分淨末煉蜜丸如彈重一錢硃砂一兩研極細為衣食逺臨卧時噙化後