body:
  text: 先醒齊廣筆記醫家類提要臣等謹案先醒齊廣筆記四卷明繆希雍撰希雍字仲醇常熟人明史方技傳附見李時珍傳中天啓中王紹徽作㸃將録以東林諸人分配水滸傳一百八人姓名稱希雍為神醫安道全以精於醫理故也是編初名先醒齊筆記乃長興丁元薦取希雍所用之方裒為一編希雍又增益羣方兼采本草常用之藥增至四百餘品又增入傷寒溫病時疫治法故曰廣筆記希雍與張介賓同時介賓守法度而希雍頗能變化介賔尚溫補而希雍頗用寒凉亦若易水河間各為門徑實各有所得力朱國禎湧幢小品記天啓辛酉國禎患膈病上下如分兩截中痛甚不能支希雍至用蘇子五錢即止是亦足見其技之工矣乾隆四十五年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀先醒齊廣筆記自序豫既不事王侯獨全微尚幽棲自遂遠於塵纍以保天年然無功及物亦豈道人之懷乎於是搜輯醫方精求藥道用存利濟隨所試效病家藏之好事者抄録轉相授受復多獲驗先是長興丁客部長孺手集豫方一册命之曰先醒齊筆記梓行於世板留巖邑未便流通交游中多索此書者卒無以應豫適旅泊金沙文學莊君斂之時時過從請增益羣方兼采本草常用之藥增至四百餘品詳其修事又增入傷寒溫病時疫治法要㫖併屬其季君􅌢之鏤板流行傳之遠邇庶窮鄉僻邑舟次旅邸偶乏明醫俾病者按方施治以瘳疾苦則是書或有補於世也夫斂之曰善時天啓二年嵗次壬戌仲冬既望東吳繆希雍自序
