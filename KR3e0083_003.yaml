body:
  text: 先醒齋廣筆記巻三明繆希雍撰㓜科附痘疹小兒初生即以粉草三錢切片江西淡荳豉三錢入沸湯一碗隔水煮乾至一二小杯以綿為乳蘸藥汁入兒口吮之以盡為度腹内有聲去胎糞數次方飲乳月内永無驚風諸病兒初生不可剪臍𢃄三朝用麫和水成薄餅置兒腹穿臍𢃄於麫上將蘄艾火灸臍𢃄近臍處或三炷或五七炷灸須下帳避風灸畢仍將臍𢃄紥好聽其自脫至七日方脫者元氣足也瑨兒九日方脫其神甚王凡兒生下每日夜時將清湯或苦茶蘸軟絹攪兒口内如齒邊有白㸃即以指爪或細針挑破取桑樹内汁濾清塗之永無驚風撮口之患予家用前三方兒月内並無殤者治撮口其症必先大便熱用生犀角及眞羚羊角磨和蜜汁飲之有効急則用大黄二錢甘草二錢煎服治月内啼闕飛辰砂極細末各五厘塗兒舌上立止治胎驚仲淳定有驗人參白芍藥酒炒各一兩白茯神酸棗仁各一兩五錢炙甘草逺志肉甘草汁浸蒸晒乾各一兩眞天竺黄另研如飛麫硃砂另研如法各五錢臍𢃄新瓦土炙焦存性另研細三條天麻犀角滑石末各一兩如有紫河車加一具火烘乾研細忌鐵右天竺黄硃砂臍𢃄另研外餘篩極細末然後加入另研三味再研和令極勻用鈎藤濃汁四兩和煉蜜半觔搗和前藥毎丸重一錢二分飢時臨卧以燈心薄荷湯調化服日可與二三服或以鈎藤湯煎濃化藥更佳如治急驚本方去臍𢃄河車人參加白殭蠶蜜炙六錢全蝎六錢牛黄一錢二分琥珀一錢膽星八錢麝香三分治胎瘧家弟患此服之神驗人參三錢虚甚瘧久者加至一兩止白芍藥三錢酒炒廣陳皮二錢鼈甲醋炙二錢麥門冬三錢厚朴二錢青皮七分醋炒山查肉三錢水二鍾煎八分溫服脾胃不佳加川黄連一錢五分薑汁炒真藿香五分白荳蔲二分五厘薑皮五分竹葉三十片白茯苓二錢治小兒癎症或驚風不止黄孟芳㓜患此症久服効天竺黄五錢酸棗仁二兩麥門冬去心二兩人參一兩明天麻五錢天門冬去心一兩白茯神一兩五錢橘紅七錢遠志肉甘草汁煮去骨一兩白芍藥酒浸一兩鈎藤五錢細末煉蜜和丸如彈子大水飛極細硃砂為衣每服一丸燈心湯或龍眼湯化下又一方加紫河車一具酒洗淨煮爛或焙乾為末入前藥中疳積散宋二懷傳累試神效治兒乳食不節過飽傷脾面黄腹大小便濁如米泔大便黄泄酸臭皮毛枯索甚而雙目羞明生翳形骸骨立夜熱晝凉等證並用此方主之厚朴去皮切片薑汁炒熟淨末一兩廣陳皮去白淨末八錢粉甘草去皮炙七錢淨真蘆薈明如漆苦如膽淨末七錢蕪荑真孔林大而多白衣者佳去白衣殻淨末五錢靑黛取顔料舖中浮碎花青淘淨研二錢百草霜取山庄人家鍋底煤二錢五分旋覆花淨末一錢五分勻和成劑小兒每一歲用藥一分燈心湯空心調服服後病愈再用肥兒丸調理如脾氣未實用啓脾丸或大健脾丸如疳氣未盡用陳皮一兩白木香三錢白茯苓五錢加平胃散三錢為末陳米湯調下肥兒丸人參三錢蕪荑一兩史君子肉一兩白芍藥一兩橘紅八錢黄連一兩甘草五錢紅麯七錢麥芽七錢砂仁五錢白茯苓一兩山查肉七錢滑石一兩蓮肉二兩稨荳一兩青黛一兩煉蜜丸彈子大每服一丸空心白湯化下治疳瀉痢見紅白積者用前散子加黄連薑汁土炒肉荳蔲二味燈心湯少入熟蜜調服治食積成疳用前散砂仁湯調服四方俱宋二懷傳治小兒疳症唇白或紫腹大面黄髪乾上指施季泉有丸藥如龍眼大納猪肝内白酒煮之止食肝一劑而愈其丸取出尚可捄人方不傳兒輩累試之奇驗價亦廉治疳眼生雞肝一具不拘大小雌雄二三歲者只用半具外去衣内去筋膜研極細如麫入疳積散若干調極勻加熟白酒厚薄相和隔湯頓極熱空心服或用甜酒少加熟白湯調服至眼開翳散乃止又方白芙蓉花陰乾三四錢聽用另以不油不蛀肉荳蔲一枚粉裹煨真胡黄連五分共細末將赤雄雞軟肝去筋膜入前藥末同研極細丸如龍眼核大白酒隔湯煮熟空心與兒吃其藥約分三分如兒小可再分作四分兒大者可一二次頓服立效治小兒走馬牙疳百驗方冰片三分黄連不犯鐵括婁為末紅褐子煆存性研細黄蠶繭殻煆存性研各五錢明礬一錢五分煆過研五榖蟲要有尾者瓦上煆過存性研二錢五分各末和勻再碾連吹數次立効吹藥時先以米泔漱淨吹藥後仍以米泔漱淨又將夜壺底内積垢取出燒灰存性研極細敷牙根腫爛處立愈前方中加入更效又將蝸牛連殻煆灰存性研極細末吹患處立愈右二方俱施季泉傳治小兒心口疼仲淳定非蟲積作痛者不宜用牽牛炒八錢白木香三錢檳榔一兩二錢紅麯炒一兩甘草炙三錢橘紅八錢綠礬火煆紅以米醋淬入另研如麫四錢細末粉糊和丸如梧子大每四錢白湯吞終身不可食蕎麥存之㓜郎病内傷大小便俱血諸醫競用紅花桃仁病愈甚仲淳曰桃仁之類疏其瘀也血且行奈何又重傷之傷則補之而已以生地黄四錢川續斷及杜仲牛膝等飲之稍平而腹痛不已仲淳曰是在内經强者氣盈則愈弱者着而成病加人參二錢一劑而愈月埠張氏兒十歲自㓜心痛得於母氣不時發者發時飲食不進呻吟反覆三四日仲淳疏方藥入口即止檳榔一錢黒丑一錢木香五分史君子二錢橘紅二錢白茯苓三錢白芍藥二錢旋覆花二錢猪苓一錢五分義興楊純父㓜兒病寒熱勢甚棘諸醫以為傷寒也藥之不效仲淳曰此必内傷純父不信徧詢乳媪及左右並不知所以傷故仲淳固問不已偶一負薪者自外至聞而訝曰曩見郎君攀竹梢為戲梢折墜地傷或坐此乎仲淳曰信矣投以活血導滯之劑數服而起仲淳嘗言古人先望聞問而後切良有深意世人以多問嘲醫醫者含糊胗脉以致兩誤悲夫猴疳方此胎毒濕熱從肛門或陰囊邊紅暈爛起漸至皮膚不結靨不治必爛死生薑四兩鰻魚一觔共煮爛取濃汁塗之次用貝母灰存性二錢五分牛黄冰片各一錢共研細末敷之如復發用綿花油一觔大楓子肉蛇床子乳香沒藥共四兩青黛一兩五味研細浸油内青布盖口以青錢壓之數日後以鵞翎蘸油塗之再用鰻骨灰君牛黄冰片各少許共為末敷之愈兒服末藥人中白煆胡黄連青黛各五分辰砂三分甘草二分人參一分共為末蜜調服之乳母服藥當歸黄連金銀花桔梗連翹川芎甘草山梔薄荷各等分水煎服以上三方馬銘鞠傳張守為㓜郎患癆疳嗜食易飢腹如蜘蛛過數日一瀉瀉則無度面目黧黒指節中亦幾無剰肉矣其母亦病診脉𦂳數骨蒸勞熱大渴引飲淋閉闕然馬銘鞠曰兒病實母病也用麥門冬枇杷葉懷生地白芍藥青蒿鼈甲之屬以治母用乾蟾為君加犀角羚羊角白芙蓉花牛黄每用分許日入雞肝内飯上蒸服以治兒再用滑石白稨豆白茯苓車前子山查肉五榖蟲等分為末拌人乳晒乾七次畧入砂仁末陳米湯丸彈子大日進兩丸不二十日子母俱痊二方絶無藥氣故兒喜啖之華叔蟾乃郎慢脾風五六日愈愈甫三四日即過多飲食連浴兩宵復痰壅沉迷面目俱浮胸腹腫滿嘔吐乳食不進角弓反張二便交秘有欲進以牛黄丸者馬銘鞠曰下咽死矣此病後虚症也然參且勿用用麥門冬三錢枇杷葉三片貝母二錢五分桑白皮一錢五分杏仁一錢藿香一錢新鮮大糖球一枚蒼术用人乳汁炒三次八分橘紅一錢二分加燈心煎臨服入薑汁逾時小便随利腹即寛而諸證悉退盡劑竟愈以此知嬰兒病後不可不慎即此兒半年後下午連食冷鴨子二枚午間又縱恣飲食更餘病發上不吐下不瀉胸腹脹滿目閉氣喘身熱按其胸腹則雙手來䕶馬曰食也鴨子黄閉氣得水則化今尚在胃口急索大棗數枚煎湯入砂仁錢許以通其氣兒渴頓飲碗許氣漸通目開手足亦漸流動再煎飲之夜半吐瀉交作次日勿藥而愈萬中丞涵臺患痰症合琥珀丸不用棄去馬銘鞠曰此㓜科絶勝藥也開緘而琥珀清香之氣觸鼻入腦光瑩可愛取之凡遇慢驚所投神驗兼治小兒一切虚證如華虚舟五郎尫甚善哭週歲中每哭即氣絶絶而甦一飯時許矣至三歲外其病日深哭而絶絶而甦甚至經時初或一月一發後則頻發有日再發者投以此藥人參圓眼湯下數丸遂瘥琥珀丸方琥珀三錢天竺黄二錢人參三錢茯神二錢粉甘草三錢硃砂一錢五分山藥一兩膽星二錢蓮肉三錢煉蜜丸硃砂為衣毎服一錢莊斂之艱嗣辛酉幸舉一子未及三月乳婦不善撫養盛暑中擁衾令卧忽患丹毒遍遊四肢漸延腹背斂之倉皇來告予曰兒方數月奈何苦之以藥急以犀角絞鮮棃汁磨服斂之問故予曰犀角能解心熱而棃汁更能豁痰且味甘則兒易服别疏一方用荆芥穗二錢半鼠黏子二錢懷生地四錢牡丹皮一錢五分𤣥參三錢括婁根三錢薄荷葉一錢竹葉百片麥門冬去心四錢生甘草三錢連翹三錢貝母去心三錢生蒲黄二錢令煎與乳婦服之乳汁即湯液矣斂之依法治之一日夜赤者漸淡再越日丹盡退後卒以乳婦不戒患驚風而殤稀痘神方金銀花為末糖調不住服有效顧驤宇傳又方江右米以功傳神方也赤豆小飯赤豆黑豆菉豆粉草各一兩為細末用竹筒削去皮兩頭留節一頭鑿一孔以藥末入筒中用杉木砧塞𦂳黄蠟封固外以小繩繫之投入臘月厠中滿一月即取出洗淨風乾每藥一兩配臘月梅花片三錢和勻若得雪中梅花片落地者不着人手以針刺取者更妙如急用入紙封套内略烘即乾兒大者用一錢小者用五分俱以霜後絲𤓰藤上小藤絲煎湯調空腹服湯宜多服服後忌葷腥十二日解出黑糞為驗一次可稀三次不出每年服一次又方婁江王相公傳甚效菟絲子半觔好酒浸二宿煮乾去皮黑𤣥參四兩為極細末煉蜜丸如彈子大每空心白湯調化一丸日二次又方加生地黄麥門冬各四錢犀角末一兩又方腦不去骨肚不去糞𤨏𤨏葡萄五錢白葡萄五錢共炙蜜丸每一錢白湯下此侯少芝方又方丁見源比部傳用白牛虱數百枚焙燥和糖令兒服之服數次有紅㸃發出此毒解之侯也不效再服先頭面次心坎次腰肚次四肢以漸見㸃痘必稀白牛惟江北多虱藏牛耳中不多得須多服方效痘症有二一曰血熱毒盛一曰氣虚毒盛氣虚者可以徐補血熱毒盛者勢必亟一發熱便口渴面赤氣喘狂噪譫語此其證也一見㸃即宜凉血解毒急磨犀角汁多飲之十可療四五稍遲難捄矣又有血熱兼氣虚者初發先服凉血解毒之劑五六朝後可以併力補氣助漿唯初時不早凉血則毒不解毒不解延至六七朝勢必以參耆助漿漿必不來反滋毒火又有血熱毒盛似氣虚者初熱放㸃神思昏亂足冷痘色白如水窠唯有唇腫口渴辨其火症醫者反以氣虚治之十無一生孫生東療鄭黄門子血熱毒盛初起急以犀角地黄湯療之不效至用白芍藥八錢一泄毒解徐補収功家弟𤣥箸一發熱即譫語唇腫齒黒痘欲出不出醫者以為發斑傷寒也延仲淳施季泉不至予曰事急矣以生地八錢白芍藥五錢黄芩黄連各二錢稍加發藥日三劑勢稍定痘漸次出醫者曰爾時宜發痘奈何以凉劑遏之予曰解毒即所以發也未幾季泉至以予言為然第減地黄芍藥之半復於助漿中兼清凉之劑九十朝漿足卒傷一目仲淳曰使子之言盡行則目亦可不眇矣靨後方大便此真血熱症也松江黄綺雲療徐氏兒痘兒㓜遇冬月痘不起熾炭圍爐抱兒火邊以酒漿挹火火氣薰兒痘立起又有痘而腰痛者一醫以人參蘆三兩煎湯飲之一吐痘起痛尋解叩其故曰毒在下部提之則上升而毒散矣大抵痘家利吐吐中便有散毒之義施季泉曰凡成婚或破陽後出痘而腰痛者可療童子而腰痛是先天之水不足也不治驚痘易治者以毒由心經出故輕非因恐嚇成驚反易治也其言甚有味故存之施君諱一中住良渚去杭州塘棲二十五里顧叔夏次郎八歲出痘而先腰痛予斷以不治果殤附一小兒初痘血熱甚黄綺雲用懷生地三兩濃煎頓飲其痘紫色立轉紅臧玉涵次郎年十六因新婚兼酒食忽感痘諸醫以為不可治施季泉至八日漿清寒戰咬牙譫語神思恍惚諸醫皆欲以保元湯大劑補之季泉以為不然改用犀角地黄湯得脫痂後忽嘔吐大便燥結淹延一年羣醫束手告急仲淳仲淳視其舌多裂文曰必當時未曽解陽明之熱故有是症命以石膏一兩人參一兩麥門冬五錢枇杷葉橘紅竹瀝童便為佐一劑即安再進二劑鬲間如冷物隔定父母俱謂必斃仲淳曰不妨當以參湯投之服兩許即思粥食晚得大便夙疾頓瘳治痘喘取白花地丁以水煎服止喘甚神治火痘毒盛遇火令施季泉傳白花地丁濾汁和淡白酒漿少服之立解治痘泄長兒痘初熱即泄日十數行見痘泄不止時醫以脾胃藥止之愈甚施季泉曰是在不治予强之曰止泄不難發藥中加黄連二錢黄芩一錢一劑泄止予喜甚施君曰非也毒火太熾故泄初泄時即以解利藥乘熱導之或可望生今遲矣過四日即欲解毒無及矣坐視七日死臧玉涵㓜兒甫半週身熱一日即見痘郡有專門知名者延治之云樹小花多頂平脚塌根窠薄百死一生之症也五朝固辭去藥以保元湯為主擬六朝多用人參加附子疑慮間施季泉忽至曰此險症且誡云必發痒異常須看守嚴密藥用凉劑與前治大别七朝大發痒作瀉一日夜二十餘行或藥水或乳或湯飲俱傾注不變色舉家謂必無幸矣季泉怡然自若因强之用參必不許藥内加炒黒黄連瀉止十三朝復發痒口渴唇燥舌生白胎又加炒黄連白胎去到底不用參十九朝季泉别又誡曰慎防痘疔口疳疔之發也必在腦後枕骨間當以収口膏藥貼之禁用摻藥口疳惟君家人中白散為妙不數日發疔口生疳如其言治之輒効季泉口授一家傳秘方治痘後餘毒如神人參白茯苓金銀花犀角各三錢甘草一錢五分羚羊角一錢珍珠八分蜜丸每服一錢日二服一小兒痘泄諸毉以升澁之劑投之不効黄綺雲至以白芍藥約三兩餘酒炒一劑即止此脾虚有熱故也治痘虚寒將行漿時作泄若係火熱泄者不可用蓮肉炒去心一味為末每末一兩加雲南鴉片五分研勻兒大者用末五分兒小者三分白湯調下立止虚癢或虚煩躁不止亦如之于中甫長郎痘患血熱兼氣虚先服解毒藥後毒盡作泄日數次不止痘平陷矣仲淳以眞鴉片五厘加炒蓮肉末五分米飲調飲之泄立止王宇泰繼以人參二兩黄茋三兩鹿茸三錢煎服補其元氣漿頓足蓋以先服解毒藥已多無餘毒矣故可補而無餘證存之孫女痘後泄以鵶片如法飲之不止仲淳更以糯米蓮肉作糜一甌立愈一老醫有孫痘已脫痂少腹脹小水不通衆毉以為痘後餘毒以利水解毒藥投之愈脹老醫忽悟曰痘後無實證土堅則水清脾虚下陷故也用後方一服立效人參一兩大棗五枚水薑五片治痘後脾虚作泄老人脾虚作瀉亦甚效黄耆四兩人參四兩肉豆蔲二兩五味子四兩山茱萸肉四兩蓮肉六兩白稨荳四兩白术三兩為細末棗肉搗膏和丸如彈子大每用一丸薑湯磨化下一小兒痘已脫痂初無他苦一毉視其目精無神𢃄白曰不可為已逾日亡治痘痂艱脫血熱又兼血虛故艱脫也尚宜保養俟脫盡乃可見風人參一錢五分白芍藥酒炒三錢甘草炙一錢麥門冬去心五錢五味子六錢懷生地四錢金銀花四錢水煎飢時服痘毒非元氣壯實者不可外治大忌圍敷藥戒之痘疳神效方雄黄牛糞尖燒灰存性為末每一錢加冰片二分研細吹患處立愈治痘後翻瘢不拘上下部腫爛淋漓者俱效象牙末三錢真珠末三錢白殭蠶二錢炒孩兒茶一錢五分為極細末以濟寜胭脂調敷毒水如注漸漸収口防痘傷目方呉季泉傳自王府雌雄檳榔二枚每枚用清水粗碗上磨一百轉隨將痘兒目閉者以口津潤開用雞毛蘸檳榔水拖眼稍三四次其痘痂即落永不傷目又方用真濟寜油胭脂塗眼腔週遭三四次永不傷目試之累驗治痘後病目兼治血熱病目而脾胃壯實者天門冬四兩麥門冬四兩枸杞子四兩甘草一兩生地黄八兩五味子二兩五錢甘菊花三兩𤣥參三兩地骨皮二兩白蒺藜炒去刺五兩榖精草三兩木賊草三兩蜜蒙花二兩草決明二兩女眞實同黒豆九蒸九晒六兩槐角四兩羚羊角三兩蜜丸梁溪一女子痘後目痛上白靨不見物服二十劑全愈仲淳立榖精草二錢草決明炒研一錢五分川黄連酒炒一錢五分懷生地二錢川芎八分甘草六分白蒺藜炒研一錢柴胡七分甘菊花二錢石菖蒲一錢木賊草一錢五分𤣥參一錢五分連翹一錢麥門冬二錢痧疹論并治法痧疹者手太陰肺足陽明胃二經之火熱發而為病者也小兒居多大人亦時有之殆時氣瘟疫之類歟其證類多咳嗽多啑眼中如淚多泄瀉多痰多熱多渴多煩悶甚則躁亂咽痛唇焦神昏是其候也治法當以清凉發散為主藥用辛寒甘寒苦寒以升發之惟忌酸収最宜辛散誤施溫補禍不旋踵辛散如荆芥穗乾葛西河柳石膏麻黄鼠黏子清凉如𤣥參括樓根薄荷竹葉青黛甘寒如麥門冬生甘草蔗漿苦寒如黄芩黄連黄檗貝母連翹皆應用之藥也量證輕重制劑大小中病則已母太過焉痧疹續論痧疹乃肺胃熱邪所致初發時必咳嗽宜清熱透毒不得止𠻳疹後咳嗽但用貝母括婁根甘草麥門冬苦梗𤣥參薄荷以清餘熱消痰壅則自愈慎勿用五味子等収斂之劑多喘喘者熱邪壅於肺故也慎勿用定喘藥惟應大劑竹葉石膏湯加西河柳兩許𤣥參薄荷各二錢如冬天寒甚痧毒為寒氣鬱於内不得透出者加蜜酒炒麻黄一劑立止凡熱勢甚者即用白虎湯加西河柳切忌過用升麻服之必喘多泄㵼慎勿止㵼惟用黄連升麻乾葛甘草則瀉自止疹家不忌瀉瀉則陽明之邪熱得解是亦表裏分消之義也痧後泄瀉及便膿血皆由熱邪内陷故也大忌止澁惟宜升散仍用升麻乾葛白芍藥甘草白稨豆黄連便膿血則加滑石末必自愈痧後牙疳最危外用雄黄牛糞尖煅存性研極細加真片腦一分研勻吹之内用連翹荆芥穗𤣥參乾葛升麻黄連甘草生地黄水煎加生犀角汁二三十匙調服緩則不可救藥痧後元氣不復脾胃虚弱宜用白芍藥炙甘草為君蓮肉白稨豆山藥青黛麥門冬龍眼肉為臣多服必漸强慎勿輕用參术痧後生瘡不已餘熱未盡故也宜用金銀花連翹荆芥穗𤣥參甘草懷生地鼈虱胡麻黄連木通濃煎飲之良痧疹不宜依證施治惟當治本本者手太陰足陽明二經之邪熱也解其邪熱則諸證自退矣治痧疹發不出喘𠻳煩悶躁亂西河柳葉風乾為細末水調四錢頓服立定此神秘方也砂糖調服兼可治疹後痢去歲銘鞠救呉少海子及其姪湯水不入矣逐口强灌之而生今歲張守為長郎初婚亦危矣治之亦愈皆仲淳法也又方仲淳立蟬蜕一錢鼠黏子炒研一錢五分荆芥穗一錢𤣥參二錢甘草一錢麥門冬去心三錢乾葛一錢五分薄荷葉一錢知母蜜炙一錢西河柳五錢竹葉三十片甚者加石膏五錢冬米一撮又方加三黄賀知忍少子病痧疹家人不知尚以肉飯與之仲淳適至驚曰此痧症之極重者何易視之遂以西河柳兩許雜以𤣥參三錢知母五錢貝母三錢麥門冬兩許石膏兩半竹葉七十片二劑而痧盡現徧體皆赤連進四劑薄暮矣知忍曰兒今無恙乎仲淳曰痧雖出盡煩躁不止尚不可保再以石膏三兩知母一兩麥門冬三兩加黄芩黄連黄栢各五錢西河柳一兩竹葉二百片濃煎飲之煩躁遂定而瘥冬月痧疹因寒不得發透喘渴悶亂煩躁不定用麻黄去節湯泡過以蜜酒拌炒加一錢或七八分于治痧藥中一服立透藥用乾葛麥門冬貝母前胡荆芥𤣥參西河柳甘草知母治痧後下積滯仲淳立川黄連酒炒一兩升麻七分乾葛八錢甘草四錢黄芩八錢白芍藥酒炒八錢滑石如法一兩懷山藥粉和丸白湯吞三五錢治痧後口瘡雄黄牛糞尖一個火煅過研細明礬五分冰片一分五厘皮硝一錢白硼砂三錢銅青三分能作痛可去之研細以鵝翎管吹入患處治痧後瘧仲淳立鼈甲如法二錢山查肉三錢橘紅二錢五分貝母三錢竹葉五十片炙甘草七分麥門冬去心三錢知母一錢二分白茯苓二錢乾葛一錢五分柴胡一錢如不渴去知母渴甚加石膏五錢顧鳴六乃郎禀賦素弱年數歲患脾虚證飲食絶不沾脣父母强之終日不滿稀粥半盂形體倍削鳴六深以為憂予為之疏一九方以人參為君茯苓山藥橘紅白芍藥蓮肉扁豆為佐更定一加味集靈膏相間服之百日後飲食頓加半年肌體豐滿世人徒知香燥溫補為治脾虚之法而不知甘寒滋潤益陰之有益于脾也治病全在活法不宜拘滯附腫毒疔疽一切腫毒神方仲淳立屢試神驗生甘菊連根打碎一兩五錢紫花地丁五錢甘草水炙三錢鼠黏子砂研一錢五分括婁根二錢貝母去心三錢金銀花五錢白芷一錢五分懷生地三錢白芨三錢連翹二錢五分五爪龍五錢即茜草先用夏枯草六兩河水六碗煎三大碗去渣入前藥煎一碗不拘時服潰後加鹽水炒黄茋五錢麥門冬五錢五味子一錢秘傳治癰疽訣凡未發疽大熱作渴及愈後作渴大小便秘神昏作嘔不食不知痛全犯者不治腰痛者不治清便自調神思清爽能食知痛不嘔夜能睡微發熱者易治癰疽發熱作渴不知痛用黄茋君麥門冬上五味中甘草下煎湯服大小便秘用大黄下之毒氣攻心神昏作嘔不食用䕶心托裏散菉豆粉上硃砂中乳香下俱為極細末和勻每服三錢白滚湯下圍陰症瘡瘍外勢平而不起色黒黯其痛沉在肉裏者用此紅藥子四兩白芨一兩五錢白蘞一兩五錢乳香六錢沒藥六錢硃砂三錢雄黄三錢麝香一錢冰片一錢黒狗下頦一個煅存性豌豆粉一兩各另研為極細末和勻以醋蜜調敷四圍以極滚熱醋蘸潤兼可服圍陽症瘡瘍外勢高腫散大色紅甚者𢃄紫但發亮鮮明發熱大小便不利用此大同堿以桑皮綿紙襯滚湯淋下十分加桑灰淋汁三分下硃砂雄黄乳香沒藥冰片白芨白蘞蟾酥俱中麝香牛黄俱下明礬上五倍子大黄上上各藥另碾為細末待汁冷和匀入上好小口磁器礶中口上用鉛套套上外以黄蠟封好令固密聼用灸癰疽藥餅夜明砂五錢月經布灰存性一錢麝香三分冰片三分乳香一錢沒藥一錢明礬研細一錢五分雄黄一錢蕎麥麪拌勻做薄餅放疽頭上加大炷艾火灸之先令病者吃些米飲及托裏等湯藥每灸至百壯痛者灸至不痛不痛者灸至痛但得一爆其瘡立愈元氣弱者停一會再灸鎮日夜灸方好治發背及腫毒圍藥騰黄三錢五分研細五倍子末二兩米醋調敷圍治發背神方一法單用敗龜板一味去肋塗黄蠟炙透内服外敷錫山保安寺僧秘訣也有奇效馬銘鞠傳又方血竭一錢雄黄一錢沒藥五分麝香五厘研細末用綿紙為燃長一尺二寸將藥四五分以真蔴油潤燃着燈頭令病人避風處端坐執燃者離瘡四五分自外而内徐徐照之瘡上微微覺熱即心神快爽不可太過恐傷好肉初用三條每日加一條漸加七條勢消每日減一條直燻至紅腫消盡為度可貼太乙膏加琥珀燻一次隨用敷藥日日如此燻時將猪蹄湯掠去油用新羊毛筆潤湯將敷藥洗淨始燻燻罷用後敷藥車前子連根葉莃薟草金銀花五爪龍俱用鮮者各等分搗爛加多年陳小粉調敷四圍紅腫處中留一孔恐出膿如瘡口大用葱葉滚水泡批開去内涎水拍熟貼之如瘡口久不合恐流膿水再以藥敷之太乙膏方𤣥參白芷生地甘草當歸血餘多大黄多治背毒初起由於鬱者逺志一味可治逺志肉甘草汁煮去骨五錢甘草一錢五分甘菊花葉一兩鮮貝母三錢鮮忍冬藤五錢紫花地丁五錢鮮連翹一錢白芨三錢托裏敗毒散綿黄茋鹽水炒三錢或五錢或八錢或一兩甘草節水炙二錢可加至四五錢赤芍藥二錢金銀花三錢茜草江西出細如燈心者佳三錢何首烏鮮者五錢真白殭蠶炙研六分白芨二錢五分皂角刺一錢貝母去心二錢括婁根三錢穿山甲土炒研一錢鼠黏子炒研一錢蟬蜕去翅爪一錢先用夏枯草五兩河水五大碗煎三碗入前藥同煎至一碗不拘時服陰症去後五味加人參三錢麥門冬五錢潰後服藥人參三錢麥門冬五錢綿黄茋蜜炒五錢或一兩甘草炙二錢五味子蜜蒸一錢白芍藥酒炒三錢金銀花三錢山藥三錢炒水二鍾煎一鍾難得収口加肉桂胃氣弱加生薑三五片大棗三枚癰疽潰瘍忌术腫瘍忌當歸替針散蠒殻一個煅存性為末酒調下不可多服去爛肉方用巴豆炒烟起焦黒為度碾極細末敷上去舊生新長肉方用無人見處自死竹蘸菜油燒滴下油用磁碟盛之搽上即生肉神驗䕶膜礬蠟丸白礬明亮者研二兩黄蠟一兩熔化提起待稍冷入礬末不住手攪勻加蜜五六錢和勻衆手丸如梧子大蠟冷不能丸以滚湯燖之便軟硃砂為衣每二十丸漸加至三四十丸白湯或酒吞此藥䕶膜防毒氣内攻未破即内消已破即便合一日之中服百粒方有功終始服過半觔必萬全病愈後服之尤佳又方白礬生研末四兩眞黄臘二兩半加煉蜜七八錢硃砂研如飛麪水飛如法六錢攪勻急須衆手為丸如梧子大每四錢白酒吞治癰疽對口疔瘡發背一切無名惡腫毒方名無敵大將軍桑柴灰將柴另燒取其炭火置一大缸内待其自化成白灰取一斗綿紙襯入淘籮内清滚水淋下汁磁缸盛貯淋至汁味不苦澁醎則止將汁入磁碗中重湯燖濃如稀糊為度茄桿燒灰淋製如前法用一斗礦灰即石灰須柴燒者佳一斗淋汁如前法三味熬調和勻名三仙膏亦可㸃癰疽之稍輕者再和堿水熬膏一兩加入後開細藥則成全方每三仙膏五兩眞正自収蟾酥三錢五分酒化令勻梅花冰片二錢眞正牛黄一錢珍珠二錢三味俱研如飛麪透明雄黄二錢明礬三錢硃砂一錢五分白硼砂二錢八味另研如飛麪方妙眞麝香須用當門子即麝香最上乗者一錢碾勻銅青一錢五分硇砂二分五厘火硝三錢輕粉二錢乳香二錢打碎人乳浸爛研勻没藥一錢五分製法同前各藥研細末和勻再碾數千下將前膏加入攪得極勻入磁罐内罐須小口者妙以烏金紙塞口封以好黄蠟勿令一毫氣走每遇毒取少許塗其頂乾則以米醋和蜜少許潤之其毒黒血或毒水爆出即時鬆解切忌不可着在好肉上或用蕎麥麪調若係疔瘡加鐵鏽黄一分研如麪和入多塗其正頂信宿其根爛出内服紫金錠一錠須内府者方効若係癰疽等症别服蠟礬丸及托裏解毒之劑此藥有奪命之功難以盡述倘一時無許多好藥即製半料亦救人無算矣治疔丸蟾酥三錢冰片一錢麝香七分眞白僵蠶一錢五分明礬三錢牛黄一錢硃砂一錢五分黄白占溶成油須令軟冷定加前藥末和丸如麻子大每七分葱頭白酒吞下取汗汗後即以半枝蓮為君連翹上赤芍藥甘草白芨白蘞金銀花俱中紫花地丁五錢生甘菊二兩河水二鍾煎一鍾下大黄隨病勢加之一滾即起服後必行然須察病人胃氣壯者可用後方用敗毒托裏之藥調理之可不死矣大抵治疔毒在急急則毒氣未走若走黄多不可治走黄後發狂咬人便能發疔汗下時其穢氣觸人亦能發疔宜謹避之看瘡瘍疔毒須飲酒以麻油塗鼻治疔膏金太初傳神驗以透明松香瀝青各五錢麻子肉二錢如冬季加五分三味大青石上以鐵鎚鎚細鎚至前藥粘在鎚上拈起如清水一般為度又加飛丹一錢再鎚數百下取収小磁杯内如遇初起疔毒以新青布照疔瘡一般大小攤膏藥貼之痛即止少頃毒水漸漸流盡疔根如燈心一條拔出仍用原舊膏貼上至重者再換一膏藥全痊矣攤膏藥小磁盃隔湯燖化竹筯攤膏約一文錢厚疔毒神騐方用陳年露天鐵鏽碾如飛麪將金銀簪脚挑破毒處一孔納鐵鏽末於内仍將皮蓋好少頃黒水流盡中有白絲如細線慢慢抽盡此疔根也盡即立愈又方用甘菊花并根葉搗汁以酒下之立消顧聖符㓜弟患髭疔醫者先用火針圍藥腫脹至目與鼻俱隐入肉牙關𦂳急馬銘鞠用患者耳垢齒垢刮手足指甲屑和勻如豆大放茶匙内燈火上炙少許取作丸令洗淨圍藥將銀簪挑開疔頭抹入外用綿紙一層津濕覆之痛立止半日腫半消目可開次日服仙方活命飲二劑愈此法兼可治紅絲疔長洲華承溪指節間患之得此而痊又云可治面白疔未試也此方傳自道人顧博士伯欽内人左耳患疔時方孕仲淳先以白藥子末雞子清調塗腹上䕶胎次以夏枯草甘菊貝母忍冬地丁之屬大劑飲之一服痛止疔立拔胎亦無恙白藥子療馬病者也治耳邊發腫連太陽腮齒俱痛不可忍大黄一兩青木香三錢姜黄三錢檳榔三錢為末醋蜜調勻貼患處中留一孔出氣治乳鵞芒硝研細一錢五分膽礬八分雄黄八分明礬八分俱研細和匀吹入喉中又方用蛤蚆草即土牛膝葉如荔枝搗汁灌鼻内右鵞灌左鼻内左鵞灌右一吐而愈或急不及藥以針或蘆管刺喉令出黒血復以蚰蜒加烏梅少許搗爛取亂髮裹箸上塗前藥攪患處去其膩痰則愈矣蚰蜒不能卒辦梅雨時取貯磁瓶内封固久而不壞纒喉風方即喉痺仲淳試過有驗明礬三錢巴豆去殻七粒溶礬入巴豆燒至礬枯去巴豆研細吹入喉中流出熱涎立開治喉癬内熱貝母去心三錢鼠黏子酒炒研二錢𤣥參二錢五分射干二錢不辣者是甘草二錢五分括婁根二錢懷生地三錢白僵蠶一錢畧炒研連翹一錢竹葉二十片水二鍾煎八分飢時服倪仲昭患喉癬邑中治喉者遍矣喉漸漸腐去飲食用粉麪之爛者必仰口而咽每咽泣數行下馬銘鞠曰此非風火毒也若少年曾患黴瘡乎曰未也父母曾患黴瘡乎曰然愈三年而得我銘鞠以為此必誤服昇藥之故凡患此瘡者中寒凉輕粉之毒毒發於身昇藥之毒毒發於愈後所生子女毒深者且延及於孫若甥倘不以治結毒之法治之必死以甘桔湯為君少入山豆根草龍膽麝干每劑用土茯苓半觔濃煎送下牛黄二分半月而痊竟不用吹藥既而詢之云父母病時果服丸藥而痊痊後曾口碎非昇藥而何今毉家恬然用之不曉其中毒之深故特明其說喉痺雄黄芒硝各一錢研細以鵞毛管吹少許數吹立散但待其腫甚而吹為妙又方用半枝蓮搗汁吃立散其渣須藏於家中勿令見風吹喉方治雙鵞單鵞神效火硝一錢五分官硼砂五分片腦三厘即冰片雄黄一分不用亦可鵞管蘆管銀管共可盛吹前藥用三匙吹上喉即吐痰涎愈從鼻孔中吹入亦效瘰癧丸方貝母去心二兩天花粉一兩五錢𤣥參一兩五錢甘草一兩五錢斑猫古米炒去頭足聽用肥皂二觔毎一肥皂去核入斑猫四個線縛蒸取出去斑猫并肥皂皮觔淨肉十兩前藥為末共搗如泥丸如梧子大每服一錢白滚湯吞服後腹疼勿慮此藥力追毒之故又方取過冬靑即荔枝草正名天明精五六枝同鯽魚入鍋煮熟去草及魚食汁數次即愈朱文學鏕患癧仲淳為灸肩井肘尖兩穴各數壯而愈治瘰癧囘燕膏仲淳試之有效真芝蔴油二觔胎髮四兩如無以童男髮洗淨代之川山甲五錢白礬飛過一兩黄蠟四兩飛丹二兩松香六兩輕粉五錢研乳香沒藥各五錢另研燕窩泥朝北者二兩微炒五靈脂淘淨五錢麝香另研五錢蜜陀僧五錢將川山甲五靈脂煎數沸下胎髮熬溶濾去渣稱淨熟油二十四兩仍入鍋内下白礬煎二三沸下黄臘黄丹煎一沸下松香官粉六兩再煎一沸下燕土如沉香色滴水成珠住火方下乳香沒藥攪勻少頃下輕粉桃柳枝攪溫可入手然後投麝香攪勻水浸去火毒七日用貼瘰癧未破者軟已潰者乾内服夏枯草湯夏枯草湯金銀花五錢夏枯草二兩柴胡七分貝母二錢土茯苓白色者二兩鼠黏子一錢微炒鼈虱胡麻仁二錢微炒酸棗仁二錢𤓰婁仁二錢畧炒陳皮一錢皂角子一錢白芍藥酒炒一錢當歸身二錢粉甘草一錢荆芥穗一錢連翹一錢五分何首烏五錢漏蘆二錢水煎食後服又方夏枯草蛇苗草紫背天葵紫花地丁金銀花九龍草或汁者汁或末者末俱要以好酒調服又方藻星膏兼治魚口一切等瘡巴荳一兩炒黄色復以紙條㸃火燒之候黒色用海藻二錢炒昆布一錢炒産海中天南星一錢切碎醋浸二日炒升麻五分天花粉五分炒各為極細末以香油和成稀膏用文火熬候燒乾入巴荳下巴荳後畧熬退火冬月加巴荳五錢南星一錢夏月減南星五分加天花粉一錢治熱癤廖憲副夢衡傳黄梅水時取新出蝦蟆黒而細者是置瓶内木蓋口蠟封埋地下久化成清水取出蘸抹之兼可治疔疽治對口癤試之神效鮮茄蒂七個鮮何首烏輕重等分水二鍾煎八分一服出膿再服収口又方金銀花一兩淨木槿樹根皮一兩切片酒水各一碗煎食後服面上疔加白芷一錢蒲公英即直下根和黄蜆打爛罨患處以真麻布包之三日立愈梁谿一女子頦下發一硬塊而不痛有似石癭仲淳疏方服十劑全消貝母去心三錢連翹二錢鼠黏子酒炒研一錢五分括婁根二錢金銀花五錢何首烏去皮竹刀切片三錢白芨二錢蒼耳子研細一錢五分生甘菊五錢青木香一錢五分紫花地丁五錢先用夏枯草五兩河水五碗煎至三碗去渣納煎藥同煎至一碗敷藥方南星三兩海藻昆布檳榔薑黄白蘞猪牙皂角各一兩細末醋調敷梁谿一婦人生癤臂上服此半日立出血膿愈連翹二錢白芷二錢甘菊一兩紫花地丁五錢白芨二錢粉甘草三錢金銀花五錢生地三錢地榆四錢皂角刺一錢括婁根二錢茜草三錢鼠黏子一錢治肺癰馬銘鞠傳其法用百年芥菜鹵久窨地中者數匙立起此鹵嘉興府城中大家多藏之目擊神效又方魚腥草水煑不住口食之治肺癰吐膿血神方也正名蕺草兼治魚口又方金絲荷葉搗汁同生白酒數飲立效乳癖乳痛方神驗用活鯽魚一個山藥一段如魚長同搗汁敷乳上以紙蓋之立愈乳癖方張王屋屠後江孟脩兄驗過白芷一錢雄鼠糞一錢二種晒乾為末用好酒調服必多飲取一醺睡而愈雄鼠糞尖者是又方顧文學又善内人患左乳岩仲淳立一方夏枯草蒲公英為君金銀花漏蘆為臣貝母橘葉甘菊花雄鼠糞連翹白芷紫花地丁山茨菰炙甘草𤓰蔞茜根陳皮乳香沒藥為佐使另用夏枯草煎濃汁丸之服觔許而消三年後右乳復患用舊存餘藥服之亦消後以此方治數人俱效里中婦沈姓者患乳癧潰爛經年不見臟腑者一膜爾馬銘鞠用鼠糞三錢土棟樹子三錢經霜者佳川棟不用露蜂房三錢俱煅存性各取淨末和勻每服三錢酒下間兩日一服痛即止不數日膿盡収斂此方傳自江西販糖客因治祝氏喉證得之圍藥白芨研末一兩水調敷乳癖處候乾再以水潤二三次愈㑹膿散治腹中腫毒川山甲炙白殭蠶炒去絲嘴白芷各五錢大黄二兩乳香沒藥五靈脂各五錢為末每服五錢酒服膿從大便出㓜者用三錢治脇癰杜武服之甚驗金銀花五錢貝母二錢皂角刺一錢五分連翹一錢五分穿山甲三錢赤芍藥三錢白芷一錢五分地榆五錢甘草節一錢當歸二錢夏枯草一兩煎汁和藥復煎鼠黏子一錢五分紫花地丁一兩生甘菊花根二兩搗汁和藥内服一人患腸癰傴僂痛不能伸有道人敎以飲純黄犬血二碗和白酒服其人遂飲至四碗次日下膿血盡而瘳治便毒仲淳親試之甚驗加穿山甲同患處者二片土炒引經更妙棉地榆四兩白酒三碗煎一碗空心服雖有膿者亦愈又方全蝎生礬貫衆等分為末空心調下又方棉地榆四兩粉甘草一兩金銀花一兩白芷三錢皂角刺二錢五分水二鍾煎一鍾空心溫服治下疳仲淳治數友下疳用黄栢官粉膩粉杏仁珠末冰片敷之無不愈者後去膩粉杏仁加黄芩更以小大薊地骨皮湯洗淨敷之效更良又方蟬蜕七分眞白僵蠶紫蘓葉包蜜炙七個杏仁七粒去皮尖芭蕉根五錢搗爛獨核肥皂仁七粒雪裏紅一把打爛土茯苓白色者去皮二兩白蘚皮一錢牛膝二錢黄栢一錢木通七分皂莢核七粒薏苡仁二錢連翹一錢漢防已酒浸六分甘草節一錢石斛三錢柴胡六分萆薢二錢地骨皮二錢水三大碗煎不拘時飢則服日三服氣虚脾弱加蜜炙黄茋三錢血虚加生地三錢又極秘神方治一切極痛下疳仲淳屢用甚效鮮小薊鮮地骨皮各五兩煎濃汁浸之不三四日即愈治蛀疳服藥珍珠生研細牙末牛黄冰片各一錢眞白殭蠶皂角各二錢滴乳石一兩研細如飛麪細末每服九厘土茯苓湯吞下以乾物壓之蛀疳摻方橄欖燒灰研細末摻上治痔瘡出血過多東垣名黒地黄丸臧晉叔試之效生懷慶一觔酒洗淨用水煑連汁磨為末重湯熬成膏聽用茅山蒼术一觔切片用眞麻油浸一日夜去油晒乾為末北五味半觔晒乾為末炒黒乾薑淨末八錢用黒棗肉半觔去皮入前藥搗丸空心白湯每服三錢治痔瘡歸安陳汝良傳用荔枝草即天明精一名地菘煎湯洗仍以草手搓軟塞患處治漏鉛花四兩研如麪黄牛腮邊合扇骨二兩酥炙燥為末雄猪前脚跲二兩酥炙燥為末青黛二兩槐花二兩人中白煅過五錢將藥總置陽城礶内用鐵油盞鹽泥封好置淘濕大米數粒於盞上四面用火煅以米熟為度取出研細煉蜜丸如梧子大每五錢空心下午各進一服淡鹽湯吞水白酒二杯以猪蹄下酒醋紫蘓畧吃些亦可坐板瘡方丁右武親驗有效松香五錢研細雄黄一錢研細如濕癢加蒼术三錢各末和勻以綿紙包裹撚成紙撚二條臘月猪油浸透㸃火燒着取滴下油搽上立效治臀癰一人患臀癰用五爪龍連枝搗汁酒漉服日進四五次膿從大便出未成膿者内消如有頭以渣敷上立散治魚口極效治下部火丹馬銘鞠傳用蠶砂山栀黄連黄芩黄檗大黄寒水石共末水調敷上立效切勿用芭蕉根又方川黄連末蜜和雞子清調敷馬銘鞠云若遇抱頭火丹必砭去惡血方效毎用此法治人其不肯砭者多誤事予家兒輩試之甚驗煎方牛膝三錢木𤓰二錢石斛三錢生地五錢連翹三錢黄檗二錢甘草一錢金銀花五錢地榆三錢茜草三錢赤芍藥二錢水煎服治懸癰一名鸛口疽生在陰囊後榖道前療之不早變為漏則難治矣一僕試之立消大粉甘草一觔每根劈作四片或二片用泉水二碗輪流蘸炙以水盡為度切片河水十碗熬至一碗空腹服盡即愈此孫眞人方談公武患跨馬癰外勢不腫毒内攻膿多瘡口甚小突出如指大一塊觸之痛不可忍多飲寒劑外敷凉藥毒内攻胃氣俱損銘鞠盡去圍藥洗淨瘡口但用一膏藥以䕶其風用大劑黄茋山藥懷生地白芷牛膝米仁金銀花雜以健脾藥十餘劑膿盡再數劑肉長突出者平矣後服六味丸觔許精神始復江都尹奉麓乃尊斃於腿癰其子九嵗亦患之就醫彌月勢漸盛銘鞠按之堅如石幸兒氣厚可内消用牛膝薏苡地榆生地鼠黏子金銀花連翹粉草皆仲淳常用法也初劑加利藥微利之即稍寛過兩劑加汗藥微汗之勢益寛至數劑取穿山甲末五錢半入煎半調藥送下兒善飲令兒一醉自此頓消半月地下行矣初一醫欲開刀遇銘鞠中止凡外科宜以開刀為戒梁谿一男子生癤膝下楚甚仲淳適至即於席間作劑服之飲酒數杯癤立破出鮮血愈連翹二錢白芷二錢粉甘草水炙三錢金銀花五錢牛膝三錢懷生地三錢地榆四錢皂角刺一錢鼠黏子酒炒研一錢陸封公養質患腿癰瘍醫用忍冬花角刺連翹白芷貝母天花粉陳皮乳香沒藥治之不效仲淳即前方加綿地榆炙甘草紫花地丁服三四劑愈治鶴膝風一人患此五年敷藥三日即愈王心涵傳乳香沒藥各一錢五分地骨皮三錢無名異五錢麝香一分各為末用車前草搗汁入老酒少許調敷患處􅂒瘡方章宇泰傳六郎乳母試之神效松香一兩輕粉三錢乳香五錢細茶五錢四味共打成膏先將葱頭花椒煎濃湯燻洗淨用布攤膏厚貼患處以絹縛定黄水流盡爛肉生肌又方曹和尚傳松香四兩好韶粉二兩先將松香投入滾水中一撈即起另研如飛麫後加韶粉研勻入真麻油勿令太薄調如極稠糊用筯挑起以不斷絲為度仍用極𦂳細松江布攤成膏貼於瘡上將寸許濶絹條紥急勿使泄氣一日収𦂳三次三日一換膏藥半月必愈􅂒瘡久不愈方黄占白占輕粉韶粉臘月猪板油麻油各半化勻調和前藥用薄油紙攤貼瘡上血風瘡久不結痂亦妙入芝蔴油乳香更妙足指疔毒生甘菊一兩五錢紫花地丁八錢金銀花藤一兩穿山甲三片土炒研細木𤓰二錢牛膝五錢薏苡一兩生地五錢連翹三錢白芨三錢夏枯草六兩李行甫患黴瘡俗呼廣瘡誤用水銀番磽等藥搓五心三日間舌爛齒脫喉潰穢氣滿室吐出腐肉如猪肝色湯水不入腹脹二便不通醫皆謝去獨用治喉藥吹喉痰壅愈甚痛難忍幾死銘鞠按其腹不痛雖脹滿未堅猶未及心知水銀毒入腹未深法宜以鉛収之急用黒鉛觔餘分作百餘塊加大劑甘桔湯料金銀花粉草各用四五兩水二三十碗鍋内濃煎先取三四碗入湯注中徐灌之任其自流逾時舌漸轉動口亦漱淨即令恣飲數盞另取渣再煎連前濃汁頻濯手足次日二便去黒水無算始安方用吹口藥及敗毒托裏藥數劑而愈後賈僕有顔孝者亦患黴瘡誤用水銀薰條其證一如行甫即以前法治之次日立起治黴瘡猪胰脂二兩金銀花二錢皂角刺一錢芭蕉根一兩雪裏紅五錢五加皮二錢土茯苓白色者二兩皂莢子七粒打碎獨核肥皂仁七粒切片白僵蠶炙七分木𤓰一錢白蘚皮一錢蟬蜕一錢年久力衰者加薏苡仁五錢甘草節二錢綿黄茋三錢懷生地二錢人參二錢久不愈加胡黄連三錢胡麻仁二錢全蝎七枚水三大碗煎一碗不拘時飢則服又方棉花子仁一味研如泥入細槐花末和丸如菉荳大每四錢空心及飢時吞治結毒獨核肥皂仁七粒千年矮即雪裏紅一兩皂莢子七粒甘草節一錢五分木𤓰一錢五分蟬蜕一錢青木香一錢土茯苓白色者二兩綿黄茋鹽水炒三錢白殭蠶蜜炙炒研七分鼈虱胡麻仁炒研三錢白芷一錢何首烏三錢金銀花三錢連翹一錢水三大碗煎一碗不拘時飢則服結毒丸方鍾乳石研如飛麪水飛一兩五錢眞牛黄研如飛麪三錢珍珠研如飛麪四錢猪牙皂角去皮膜為極細末七錢樺皮灰存性研如飛麪四錢百草霜庄家鍋底者佳七錢牛黄丸神效牛黄眞者研細三錢象牙末三錢白殭蠶二錢紅鉛二錢冰片五分明礬二錢極細末煉蜜丸如麻子大每服五分土茯苓白色者木槌打碎三兩砂鍋内煮汁吞丸藥空心上下午飢時日三次洗方五倍子四兩地骨皮四兩皮硝五錢甘草二兩苦參四兩葱頭十個河水煎濃湯一鍋於無風處乘熱蘸日浴三次浴時先吃飽或服煎藥一貼忌食茶醋牛肉麩河魨火酒摻方粉霜一錢五分甘草汁飛過眞冰片三分另研二味和勻洗淨摻上立瘥浸酒方防風當歸羌活白芷白蘚皮五加皮蒼术牛膝各二兩荆芥薏苡蔓荆子木𤓰白蒺藜去刺各一兩生地黄三兩烏稍蛇出呉江尹山方額者佳一尾好酒十觔浸煮三炷香卧時服丸亦可治頭面結毒蘄艾去筋膜一兩川椒去核八錢麻黄去節二錢川芎二錢猪頭天靈葢火煅存性五錢白茯苓二兩極細末蒸餅丸如菉荳大飯後白湯送下每服三錢服後二三日瘡口乾燥不臭是其效也服至瘡口平復方住忌牛羊魚腥房慾患久者宜間服十全大補湯十數劑川椒出桃花洞者佳嚼半粒口辣不能言者眞又治結毒方兼治積年虚勞痰火健脾進食極木一名十大功勞一名猫兒殘俗呼光菰櫪黒子者是紅子者名樞木亦可用取其葉或泡湯或為末不住服譚公亮患結毒醫用五寶丹餌之三年不效仲淳云五寶丹非完方也無紅鉛靈柴不能奏功時無紅鉛姑以松脂鉛粉麻油調敷應手而減公亮先用喬伯珪所贈乳香膏止痛生肌甚㨗及用此二味功效彌良乃知方藥中病不在珍貴之劑也又方銀硃三錢輕粉三錢白占三錢黄占三錢用麻油三兩先將二占化勻調前藥末攤成膏貼之戒房事必效凡父母正患黴瘡時育兒鮮有免者其證渾身破爛自頂至踵兩目外幾無完膚日夜號泣或吐或瀉似瘧似驚變態百出父母不知見有他證别作治療十無一生治法以牛黄為君再加犀角羚羊角硃砂冰麝和入土茯苓粉生蜜調服使兒日日利去惡毒見有他證隨宜治之母亦隨宜用藥加以散毒劑不住口服其外用大粉草金銀花為極細末二三升破爛處洗淨大握敷之半月後方易神效敷藥再敷數日自愈愈後一兩月當復發再後兩三月當再復發發漸輕仍如法治之自愈愈後或口角眉角或肛門存二三餘毒不必治矣其渾身或癬或瘡忽聚忽散敷之便愈大抵年餘始得除根若母不禁口或兒漸大不能禁口有延至二三年者然不斃足矣胎中之毒徹骨入髓焉能旦夕除哉馬銘鞠傳昇藥五靈散馬銘鞠傳膽礬治筋而滋肝其色青應東方木辰砂養血而益心其色赤應南方火雄黄長肉而補脾其色黄應中央土明礬理脂膏而助肺其色白應西方金磁石榮骨液而壯腎其色黒應北方水此方見焦氏筆乘喜其不用水銀製而用之功效遲緩後因加水銀一兩與前五味等分和勻入陽城礶内打火三香取出加敷藥中用之效如神神效敷藥方馬銘鞠傳夜合花白者良陰乾象皮同黄砂炒候軟切片再炒候脆方研栙香炒研乳香沒藥各去汗血竭孩兒茶濕紙包煨花蕋石五倍子色𢃄紅者良半生半煅各一兩白占八錢珍珠五錢冰片一錢各極細末方入白占研勻最後入冰片如欲去腐每兩加五靈散二錢欲生肌每兩加前散三分或五分如治痘後膿水淋漓下疳等瘡只加一二分治湯火傷每兩加絲綿灰二錢剔牙松皮煅存性五六錢韶粉雄黄五六錢或乾摻或香油調一切外症俱效附海上單方里中有周七者少年曾患毒左腋下得一異方用糯米炊飯乗熱入鹽塊夾葱管少許搗極爛如膏貼患處輒消至中年腰間忽生一毒熱如火板硬痛不可忍佝僂跼蹐自分必死屢藥不效急思前方如法貼之未幾大便去糞如宿垢甚多硬者漸軟數日而起雜症腦漏腦者諸陽之㑹而為髓之海其位高其氣清忽下濁者其變也東垣云上焦元氣不足則腦為之不滿經云膽移熱於腦為鼻淵夫髓者至精之物為水之屬腦者至陽之物清氣所居今為濁氣邪熱所干遂下臭濁之汁是火能消物腦有所傷也治法先宜清肅上焦氣道繼以鎮墜心火補養水源此其大畧耳藥多取夫辛凉者辛為金而入肺有清肅之義故每用以引散上焦之邪如薄荷荆芥甘菊連翹升麻鼠黏天麻之屬鎮墜心火補養水源如犀角人參天冬麥冬五味朱砂甘草山藥生地茯苓牡丹皮之屬然須兼理乎肺肝盖鼻乃肺之竅而為腦氣宣通之路又治乎上焦而行清肅之令膽為春升少陽之氣與厥陰為表裏而上屬於腦戴人有云膽與三焦尋火治内經謂膽熱所干義亦明矣理肺用桑皮鼠黏桔梗二冬花粉竹瀝清肝膽以柴胡白芍羚羊竹茹棗仁川芎或者又謂世人多用辛温辛熱之藥取效此義何居盖辛熱甘温多能宣通發散故病之微者亦能奏效耳此從治刼法非不易常經明者察之頭風神方沈觀頤中丞傳自一道人予僕婦患此痛甚欲自縊服二劑數年不發土茯苓忌鐵四兩金銀花三錢蔓荆子一錢𤣥參八分防風一錢明天麻一錢辛夷花五分川芎五分黒豆四十九粒燈心二十根芽茶五錢河水井水各一鍾半煎一鍾服治半邊頭痛屬火證者用之妙大黄末三分黄芩末一錢二味和生白酒一碗頓熱調勻服之即愈又方用芝蔴炒熱舂碎乘熱將好燒酒入磁器中重湯熱入芝蔴扎𦂳只用一葱管孔揷入磁瓶口内引鼻吸其氣左則薫左右亦如之虚寒用燒酒虚熱用好米醋代之内服對病方藥鬱證紀華山先生雅自負數奇更無子時邑邑不快漸至痞脹四年肌肉盡削自分死矣姑蘓張漣水胗而戲之曰公那須藥一第便當霍然以當歸六錢韭菜子一兩香附童便炒八錢下之紀有難色不得已減其半張曰作二劑耶一服夜夢遺舉家慟哭張拍案曰吾正欲其通爾仍以前半劑進胸膈間若勇士猛力一擁觧黒糞數升尋啜粥二碗明日巾櫛起見客矣逾年生一子即表弟汝占也治筋骨疼甚如夾板狀痛不可忍者李景渠中丞傳將騾子脩下蹄爪燒灰存性研末或酒白湯調服立愈癎症方名補心寜志丸天竺黄另研如麫五錢沉香另研如麫三錢天門冬去心酒洗蒸二兩白芍藥酒炒三兩白茯神去心四兩逺志肉甘草汁浸蒸二兩麥門冬去心二兩炙甘草六錢旋覆花一兩五錢眞蘇子研一兩香附醋浸晒乾童便拌瓦上炒三兩半夏薑汁拌以明礬末少許同浸二兩皂角莢不蛀者去黒皮酥炒去子取末二兩為末和勻懷山藥粉糊丸如豌豆大硃砂一兩研如法為衣每服三錢用竹瀝㸃湯下風癲病神方好生犀角四兩剉末每用一兩加清水十碗入砂鍋内熬至一碗濾淨再加水十碗熬至二酒杯加淡竹葉四兩水六碗煎二碗去渣加犀角汁同服盡四劑即愈治火上升有痰留滯喉間如有核上法宜降氣清火眞蘇子研二錢廣橘紅三錢貝母三錢括蔞根三錢白茯苓三錢麥門冬五錢白芍藥三錢酒炒黒連翹一錢五分黄檗蜜炙一錢五分五味子一錢打碎水煎加竹瀝服施靈修有一里人善酒卧床褥者三年靈修憐而索方於仲淳仲淳親胗之知其酒病也夫酒濕熱之物多飲者濕熱之邪貫於陽明濕熱勝則下客於腎而為骨痿昔人治痿病取陽明以五味子為君黄連為臣麥門冬乾葛白稨豆為佐服之立起治血痞沉香丸沉香血竭辰砂各二錢五分木香一錢三分眞麝香一錢三分琥珀五分當歸尾二錢五分牡丹皮二錢五分延胡索一錢五分為細末用磁器煎甘草湯打糯米糊為丸凡氣痛酒磨葱湯亦可產後血塊酒磨服烏鬚神方女貞實一斗如法去皮每斗用馬料黒豆一斗揀淨淘洗晒乾同蒸透九蒸九晒先將女貞實為末加生薑自然汁三兩好川椒去閉口者及蒂為末三兩同黒豆末和勻蜜丸如梧子大先食服四五錢白湯或酒吞又方將鱧腸草採鮮者二三十觔搗汁入九蒸九晒過女貞實末再晒乾如前為丸亦佳但服之腹痛作泄不若薑汁椒末為佳蒸女貞實先將上好老酒浸一宿次日用黒豆蒸如此者九以其性寒故也更服八珍丸以實根本又方舊傳女貞實旱蓮草二方試之甚驗苦于腹痛作泄仲淳再為更定凉血兼理脾何首烏勿去皮烏豆同牛膝蒸製如常法最後用人乳浸晒三四十次赤白各二觔女貞實酒拌九蒸九晒二觔旱蓮草熬膏十二兩烏飯子膏即南竺枝子也十二兩茅山术米泔浸蒸晒三次去皮切片十二兩眞川椒紅十二兩去白膜閉口勿用沒石子十兩為細末以旱蓮草膏烏飯子膏同煉蜜和丸如梧子大毎五錢空心飢時各一服白湯吞碧霞丹治内障外障暴赤眼眵淚昏花翳膜當歸沒藥各二錢血竭白丁香硼砂冰片麝香各一錢馬牙硝乳香各五分俱極細末比飛麪更細三五倍以川黄連去鬚切片三錢熬成膏子和前藥為丸如豆大用銅綠一兩五錢為衣毎用一丸以新汲水半盞浸磁盒内日洗五六次一丸可洗七日重者半月輕者七日迎風冷淚三日見效賀知忍傳洗眼方仲淳立予親試驗皮硝一兩杏仁去皮尖銅綠明礬各三分側栢葉三錢甘菊花三錢桑白皮五錢河水五碗煎至二大碗置銅盆内洗眼及眉稜骨兩太陽涕出即爽然矣日夜不拘次數一服冬可半月夏十日牙痛方鄧定宇先生傳經霜西𤓰皮燒灰敷患處牙縫内立效擦牙散章泰宇傳石膏半觔火煨熟白蒺藜去刺四兩為極細末每日擦牙漱口牙痛時頻頻擦之立愈又方陳筠翁傳自江陰云旱蓮草開紅花者與此地不類旱蓮草以青鹽醃一二宿晒乾為極細末置磁罐内擦牙以沸湯漱口嚥下久久兼能烏鬚種子治胃火牙疼馬蘭頭葉并放水溝内青苔搗爛以絲綿卷之左齒痛塞左耳右亦然治聾王槐亭服之驗白蒺藜炒去刺為末蜜丸空心服沈四明相公專服此方延年益壽治耳中瘇痛或出水出膿金絲荷葉即名虎耳草搗汁滴入耳中如有膿可加枯礬未及乾胭脂末各少許又方用鮮薄荷葉同蝸牛搗汁滴耳中亦妙顧奉常女臂患紫雲風仲淳用稀薟蒼耳雄黄末之醇漆為丸或疑漆有毒競沮之然竟以此藥収功製漆用生蟹黄攪和可化作水入藥稀薟丸治爛風及風疹作癢如神稀薟草取末調吞治癱瘓甚驗初時以人參蘓木等分熬膏和酒吞傷損皆除曾有八十老人試過五七九月採近根處剥開有小蟲一條能治小兒疳症解牛肉毒取蝦蟆一隻置滚酒内數沸去蝦蟆飲酒一吐即愈又方馬銘鞠傳用甘菊花連根葉搗爛和酒服一兩碗立愈治疝氣痛方顧冲吾司馬傳表兄李瀛洲試之神驗六味地黄丸古方加北五味三兩肉桂二兩味甘者真枸杞子去蒂四兩車前子米泔浸蒸三兩將糯米一斗炊飯乗熱下白酒藥并前藥料和勻如常製白酒法三兩日後漿來用上好鏡面燒酒五十觔連酒漿并糟入大甕内泥封固一月開去糟濾清酒味甘香異常空心或飢時隨量飲飲多不渴疝攻上作痛秘方陳敬泉親驗闕子根有葉時用根葉搗爛絞汁和好酒服之覆被出汗永不發木腎方用豆田中菟絲子草一名黄絲草煎濃湯洗之時以手搓之隨消治便紅或因酒毒發者南昌鄧思濟傳先用川黄連去鬚切片酒炒細末一服三錢空心白酒調下忌暈腥一日服連末後必腹痛去血愈多復用白芍藥一兩白术五錢甘草三錢同炒揀開先用白芍藥煎湯服腹痛自止後以白术甘草同煎服遂愈又一法以粳米三分糯米七分煑粥空腹服遂愈此無他補胃氣則陽明調所以便紅自除也腸風黄茋蜜炙三錢白芍藥酒炒三錢炙甘草一錢麥門冬去心五錢生地酒洗四錢當歸酒洗二錢荆芥一錢炒白芷一錢柴胡五分地榆酒洗三錢人參一錢五味子八分去枯者打碎蜜蒸河水二鍾煎八分空腹飢時服治腸風因飲酒過多得之者效甚專服北五味打碎蜜蒸為細末蜜丸每清晨服三錢服至半年因味酸甚服後喉中覺吞酸加熟地黄等分為丸服久腸風頓止治猘犬傷野葡萄根搗汁酒服治蜈蚣傷用舊竹筯火中將頭上燒黑取下少許研細敷患處立愈又方馬銘鞠傳一法取蜒蝣塗上其痛立止屢試神驗治蛇傷雄黄雌黄等分極細末先以白芷磨菜油調塗患處以温火薫之滴盡黄水為度水出腫漸消又方明礬麝香二味為末摻上以艾炙之隨炙隨消又方慎火草即牆頭草色綠極脆搗汁同酒飲一面搗敷咬傷處立愈一婦人於壁上取雞翎卷耳適蜈蚣生子在翎上𢃄入耳中生小蜈蚣穿腦内且痛且癢百藥莫效夢神人傳一方令炒雞肉熱置一器内留一小孔蓋上令病者以耳受之雞氣薰入蜈蚣悉攢雞肉上其病立愈跌打秘方用露天糞窖中磚瓦塊多年者或碗架濁水長流處磚瓦塊火煅紅研極細跌打傷者酒調服五分立愈未打服之可不痛不宜多服令人骨軟金瘡并跌打破損出血方煉過雲母粉菜油調敷立止痛更不作膿金瘡止血方眞番降香紫糖色者眞切如豆大炒畧焦研再炒五味子一兩二味共研敷上又方舊毡帽簷燒灰敷上舊網巾灰亦好金石湯火跌損方用花蕋石舊家有用為几上小屏風者取三錢為極細末真麻油調敷患處當日者立愈隔日敷之痛輕易收口亦治産後瘀血攻心血暈神丹桃花散治跌損刀傷狗咬爛脚用陳年風化石灰一官升錦紋大黄一兩焙燥研末并石灰炒桃花色存性真麻油調敷患處當日敷之更妙火傷兼治湯泡方大松樹皮川大黄二味等分為細末生桐油調敷立愈又方用大黄一味為細末砂糖調敷立愈火燒爛神方將好煮酒一二甕入浴缸内令患者浸酒中極重不死又方用鼠初生者以真麻油浸之入磁瓶内封固患者將油搽上痛處即愈湯火神驗方猪毛煆存性研細末加輕粉白硼砂少許麻油調和敷之立效無癍痕治水渰出說海凡遇溺水者視其心坎尚溫以圓器覆地下置門一扇於上令溺者仰臥以鴨血灌之口中或大小便出水即甦臨杖預服藥湖州司獄司内杖單神效胎元一個煅存性黒犬對前脚上邊頂骨一副酥炙存性川麻皮煅存性麝香五分乳香沒藥各五錢煉蜜丸如梧子大毎服三錢酒吞杖後煎劑紅花紅麯各一錢延胡索牛膝各三錢牡丹皮五靈脂赤芍藥番降香各二錢炙甘草七分桃仁七分肉桂五分水酒煎若傷重出虚汗加參耆杖丹風化石灰君眞畨降香末上半夏末上黄芩黄連黄檗大黄俱中為細末麻油調敷患處杖丹散血龍鬚草二兩大黄三兩二味為末用麻油一觔蒸大黄焦色濾淨去渣加後藥樟腦一兩五錢麝香四錢冰片四錢降香末一兩乳香沒藥各五錢自然銅燒紅醋淬九次研細如烟六錢共熬成膏藥先劃碎杖處用軟帛攤成膏紥於杖處蒸熟熱韭菜熨之黒血出盡愈杖丹長肉臘月猪油一觔白占黄占各二兩黄連四兩以猪油熬黄連轉焦色去渣下占熬敷上帛紥𦂳自愈湯洗用葱頭煑爛揩洗杖瘡傷治杖夾神方狗胎封固煆五分逺年糞缸内瓦片醋淬七次二錢雄黄一分硃砂一分木香五分麝香三厘細末和勻用芊芊活最能活血搗爛絞汁和丸金箔為衣酒磨下杖傷丸方乳香沒藥血竭孩兒茶自然銅煆川木鼈人中白孩兒骨如無以狗胎代之倍加地龍土木鼈無名異為細末煉蜜丸如梧子大杖過酒服百丸杖癬方水銀五分輕粉乳香象牙末各一錢細茶二錢木香五分麝少許為細末雞子黄蠟羊油調搽杖丹如遇打出即將松香四兩溶化又將葱一握搗入松香内攪勻攤一膏藥貼患處外以綿帛掩上紥定五六日愈又方朱南溪傳杖傷及跌磕者用落得打草似孩兒菊對節生枝不拘多少搗爛酒服如伏天杖傷出蛆真麻油澆之立盡附海上單方顛犬咬方先用蓑衣草紥住患處兩頭以衆人熱小便捻洗去血水次用胡桃殻半箇以本人熱糞裝滿蓋患處艾火灸七壯如本人不欲大便傍人者亦可急取斑猫七箇去頭足并翅酒洗和濕糯米銅杓内炒米熟為度隨將二物研成細末加六一散三兩分作七服每清晨一服白滾湯調下本人頭頂心必有紅髮一根要不時尋覓拔去劉襟湖驗過顛犬咬方防風五錢黒牽牛三錢雄黄三錢斑蝥一錢占米炒眞麝香三分錦紋大黄三錢右為末溫滾水調下空心每日服二錢先將斑猫去頭翅足一兩和白粘米半升共炒去斑猫食米二撮許後服前藥其斑猫即合入前藥内服一料後斑猫不可用外加雄黄一錢或蜜或米粉丸藥再服即間二三日服亦可每服三分茄子茄地切不可踐食即茄漿水亦須忌之二三年後不必忌也此劉友自患顛犬咬三日内即服此方小便下血塊有形得以全愈有一人患犬吠六日服此方小便下血塊竟似犬狀亦終不救矣然劉友所傷不曾破皮或毒輕而得愈總不如前方歴試歴驗且犬咬之毒入心經則以益元散為引經之藥甚為有理山鄉一時無處買藥多蓄斑貓預製益元散以救人大是恩徳治酒疸用苜蓿煎湯漸飲之愈治刀瘡化屍塲取燒過人骨不化者更佳研細末敷刀瘡患處立愈治小兒疳症方用天南竺煎湯飲神效以上二方俱馮權奇傳治蛔結丸方胡黄連八錢白芍藥一兩五錢檳榔八錢粉草五錢廣陳皮二兩肉豆蔲不油不蛀者五錢史君子肉五錢為細末白糖調服先醒齋廣筆記卷三
