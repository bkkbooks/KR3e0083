body:
  text: 先醒齊廣筆記卷四明繆希雍撰炮炙大法按雷公炮製法有十七曰炮曰爁曰煿曰炙曰煨曰炒曰煅曰煉曰製曰度曰飛曰伏曰鎊曰摋曰㬠曰曝曰露是也用者宜如法各盡其宜水部雨水立春節雨水梅梅雨水芒種後逢壬為入梅小暑後逢壬為出液雨水立冬後十日為入液至小雪為出液得雨謂之液雨冬霜凡收霜以雞羽掃之瓶中密封隂處久亦不壞臘雪用淨瓶收淨雪築實密封瓶口置於隂室中不見日色春雪有蟲水亦便敗所以不收神水五月五日午時有雨急伐竹竿中必有神水􅅹取為藥半天河此竹籬頭水及空樹穴中水也流水千里水東流水二水皆堪蕩滌邪穢煎煮湯液勞水即揚泛水張仲景謂之甘爛水用流水二斗置大盆中以杓高揚之千萬遍有沸珠相逐乃取煎藥蓋水性本鹽而體重勞之則甘而輕取其不助腎氣而益脾胃也虞摶醫學正傳云甘爛水甘溫而性柔故烹傷寒隂證等藥用之順流水性順而下流故治下焦腰膝之證及通利大小便之藥用之急流水湍上峻急之水其性急速而下達故通二便風痺之藥用之逆流水洄瀾之水其性逆而倒上故發吐痰飲之藥用之也井泉水反酌而傾曰倒流出􅀢未放曰無根無時初出曰新汲將旦首汲曰井華地漿此掘黃土地作坎深三尺以新汲水沃入攪濁少頃取清用之熱湯須百沸者佳若半沸者飲之反傷元氣作脹生熟湯以新汲水百沸湯合一盞和勻故曰生熟今人謂之隂陽水菊潭水山澗兩岸有天生甘菊花其下流泉是也漿水漿酢也炊粟米熱投冷水中浸五六日味酢生白花色類漿故名若浸至敗者害人米泔水即淘米汁也繅絲湯以磁瓶收密封埋淨土地中任經數年久而愈妙火部桑柴火凡一切補藥諸膏宜此火煎之炭火櫟炭火宜煆煉一切金石藥烰炭火宜烹煎焙炙百藥丸散蘆火竹火宜煎一切滋補藥者凡服湯藥雖品物専精修治如法而煎藥鹵莾造次水火不良火候失度則藥亦無功觀夫茶味之美惡飯味之甘餲皆係於水火烹飪之得失即可推矣是以煎藥須用小心老成人以深罐密封新水活火先武後文如法服之未有不效者火用陳蘆枯竹取其不强不損藥力也土部黃土三尺以上曰糞三尺以下曰土凡用當去上惡物勿令入客水東壁土此屋之東壁上土爾當取東壁之東邊謂常先見目光刮取用之伏龍肝凡使勿誤用竈下土其伏龍肝是十年以來竈稜額內火氣積久自結如赤色石中黃其形貌八取得後細研以滑石水飛過兩遍令乾用熟絹裹却取子時安於舊額內一伏時重研了用自然銅生出銅處方圓不定色青黃如銅凡使用甘草湯煮一伏時至明漉出攤令乾入臼中搗了重篩過以醋浸一宿至明用六一混泥瓷盒子盛二升文武火養三日夜才乾用蓋蓋了火墨陳久而料精者入藥新而粗者不堪百草霜此乃竈額及烟爐中墨烟也其質輕細故謂之霜山莊人家者良梁上塵須去烟火逺高堂殿上者拂下篩用之一云凡用倒掛塵燒令烟盡篩取末入藥雷氏所說似是梁上灰塵今人不見用金部金銀銅鐵凡使只可渾安在藥中借氣生藥力而已勿入藥服能消人脂赤銅屑即打銅落下屑也或以紅銅火煅水淬亦自落下以水淘淨用好酒入砂鍋內炒見火星取研末用煅兩伏時去上研如粉用凡修事五兩以醋兩鎰為度今人只以火煅醋淬七次研細水飛過用一云製後半年方可入藥否則殺人銅青生熟銅皆有青則銅之精華大者即空緑以次空青也銅青則是銅器上緑色者淘洗用之近時人以醋制銅生緑取收晒乾貨之鉛凡用以鐵銚鎔化㵼瓦上濾去渣腳如此數次收用其黑錫灰則以鉛沙取黑灰白錫灰不入藥鉛霜以鉛打成錢穿成串瓦盆盛生醋以串橫盆中離醋三寸仍以瓦盆覆之置隂處候生霜刷下仍合住鉛丹即黃丹也生鉛一味火煅研成細末水飛過用今貨者多以鹽消砂石雜之凡用以水漂去消鹽飛去砂石澄乾微火炒紫色地上去火毒入藥密陀僧凡使搗細安甕堝中重紙袋盛柳蛀末焙之次下東流水浸滿火煮一伏時去柳末紙袋取用近人以煎銀罏底代之誤矣罏底能消煉一切衣帛焉可服耶如無真者勿用制狼毒古文錢周秦漢五代者方可用以火煅微紅淬醋中六七次用入目者磨用入散者用胡桃研成粉鐵鏽此鐵上赤衣也刮下用石部丹砂即朱砂也有數種硫砂如拳許大或重一鎰有十四靣靣如鏡若遇隂沉天雨即鏡靣上有紅漿汁出有梅柏砂如梅子許大夜有光生照見一室有白庭砂如帝珠子許大靣上有小星現冇神座砂又有金座砂玉座砂不經丹竈用之而自延夀命次有神錦砂芙蓉砂箭鏃砂已上九種皆可入藥用丹砂入藥秪宜生用慎勿升煉一經火煉餌之殺人研須萬遍要若輕塵以磁石吸去鐵氣惡磁石榆畏鹽水車前石韋皂莢决明瞿麥南星烏頭地桑椹紫河車地丁馬鞭草地骨皮隂地厥白附子忌諸血雲母凡使色黃黑者厚而頑赤色者經婦人手把者並不中用須要光瑩如氷色者為上几修事一斤先用小地膽草紫背天葵生目草地黃汁各一鎰乾者細銼濕者收汁了於瓷堝中安雲母於諸藥了下天池水三鎰著火煮煮一日夜水火勿令失度其雲母自然成碧玉漿在鍋底却以天池水猛投其中將物攪之浮如堝涎者即去如此三度淘淨了取沉香一兩搗作末以天池水煎沉香湯三升已來分為三度再淘雲母漿了日中晒任用之東澤㵼為之使惡徐長卿羊血畏鮀甲礬石流水百草上露茅屋漏水制汞伏丹砂石鐘乳凡使勿用頭粗厚并尾大者為孔公石不用色黑及經大火驚過并久在地上收者曽經藥物制者並不得用須要鮮明薄而有光潤者似鵝翎筒子為上有長五六寸者凡修事法以五香水煮過一伏時然後漉出又别用甘草紫背天葵汁漬再煮一伏時凡八兩鐘乳用沉香零陵藿香甘松白茅等各一兩以水先煮過一度了第二度方用甘草等二味各二兩再煮了漉出拭乾緩火烘之然後入臼杵如粉篩過却入鉢中令有力少壯者三兩人不住研三日夜勿歇然後用水飛澄了以瓷盒子收貯用之令乾又入鉢中研二萬遍後𤣥以瓷盒子收貯用之蛇牀為之使惡壯丹石牡蒙人參二术胡忌羊血冬畏紫石英蓑草韭實獨蒜胡葱荽麥門猫兒眼草礬石生用解毒煆用生肌黃甘草為之使惡牡蠣畏麻紅心灰藋芒硝水飛過用五重紙滴過去腳於鐺中乾之方入乳鉢研如粉任用芒硝是朴硝中煉出形似麥芒者號曰芒硝畏火為之使竹惡苦參苦菜女菀杏仁葉滑石以刀刮去浮靣黃者研如粉以牡丹皮同煮一伏時出去牡丹皮取滑石却用東流水淘飛去下腳七次於日中晒乾方用惡白如凝脂軟滑者良石韋為之使曽青制雄黃赤石脂研如粉新汲水飛過三度晒乾用亦有火煅水飛者惡大黃松脂畏芫花豉汁畏黃芩大黃官桂白石英可煮汁用張仲景只令吺咀不為細末惡馬目毒公紫石英煮汁用或火燒醋淬為末傳毒氣長石為之使得茯苓人參芍藥主心中結得天雄菖蒲主霍亂扁惡鮀甲黃連麥旬薑畏青附子及酒爐甘石以炭火煅紅童便淬七次水洗淨研粉水飛過晒用緑礬火煅通紅淬入米醋中烘乾研如飛粉畏醋雄黃取透明色鮮紅質嫩者研如飛塵水飛數次參畏南星地黃萵苣地榆黃芩白芷當歸地錦苦五加皮紫河車五葉藤鵝腸草雞腸草鵝不食草圓桑葉蝟脂石硫黃研如飛塵用以殺蟲行血錫曽青石亭脂為之使畏細辛朴硝鐵醋黑猪肉鴨汁餘甘子桑灰益母天鹽車前黃蘖石韋蕎麥獨帚地骨皮地榆蛇牀萆麻兔絲蠶沙紫河波稜桑白皮馬鞭草食鹽凡鹽多以礬消石灰之類雜之入藥須用水化澄去腳滓煎鍊白色乃良漏蘆為之使水銀凡使草中取者并舊朱漆中者經别藥制過者在尸過者半生半死者俱勿用在朱砂中産出者其色微紅收得後用葫蘆收免遺失先以紫背天葵并夜交藤自然汁二味同煮一伏時其毒自退若修十兩用前二味汁各七鎰和合煮足為度松畏磁石砒石黑鉛硫黃大棗蜀椒紫河車松脂葉荷葉榖精草金星草萱草夏枯草莨菪子鴈來紅馬蹄香獨腳蓮水慈姑瓦松忍冬水銀粉凡水銀一斤用明礬熖硝皂礬食鹽冬二兩同一處研以不見汞星為度用烏磁盒二箇以藥鋪盆內上用一盆合定以鹽泥石膏蜜醋調封盆口勿令泄氣下盆底用鐵釘三腳支住四五寸高用炭火先文後武蒸半日次日冷定輕輕取起上盆則輕粉盡騰其上以鵝翎掃下聽用此乃真正輕粉生肌立效市肆多攙寒水石銀母石石膏焉得有用乎黃連土茯苓陳醬黑鉛鐵漿可制其毒戎鹽即青鹽溫水洗去塵土淨晒乾入藥石膏雪白有墻壁者真即市之寒水石也石臼中搗成粉以密絹羅過生甘草水飛過了水澄令乾重研用之作散者煅熟入煎劑半生半熟雞子為之使畏鐵惡莾草巴豆馬目毒公磁石欲驗者一斤磁石四面只吸鐵一斤者此名延年沙四面只吸得鐵八兩者號曰續末石四面只吸得五兩已來者號曰磁石修事一斤用五花皮一鎰地榆一鎰故綿十五兩三件并細銼以槌於石碎作二三十塊子將磁石於瓷瓶中下草藥以東流水煮三日夜然後漉出拭乾以布裹之向大石上再槌令細了却入乳鉢中研細如塵以水沉飛過了又研如粉用之柴胡為之使殺鐵毒消金脂惡牡丹莾草去畏黃石伏丹砂養永銅暈陽起石用火煅透紅研極細如麵蛻桑螵蛸為之使惡澤㵼雷丸菌桂石葵蛇皮畏兔絲子忌羊血瑪瑙犬肉內煮之火煅紅醋淬用試瑪瑙法以砑木不熱者為真石灰凡使用醋浸一宿漉出待乾下火煅令腥之氣出用瓶盛著密蓋放令拭上灰令浮細研用去錫暈砂制三黃硇消石砒霜凡使用小瓷瓶子盛後入紫背天葵石龍芮二味三件便下火煅從已至申便用甘草水浸從申至子出拭乾入瓶盛於火中鍛别研三萬下用之一法每砒霜一兩打碎用明礬一兩為末蓋砒上貯罐中入明火一煅以枯礬為度砒之悍氣隨烟而去駐形於礬中者庶幾無大毒用之不傷也用砒霜即用礬霜是也似簡便益畏菉豆冷水菖青鹽鶴頂草消石蒜水蓼常山母獨帚木律蒲二角酸鵝不食草波稜萵苣皆能伏砒礞石與火硝相半入陽成罐封固煅存性研如飛塵入藥得焰硝良花乳石出陜華諸郡色正黃形之大小方圓無定凡入丸散以罐固濟頂火煅過出火毒研細水飛晒乾用蓬砂即硼砂也白如明礬者良研如飛塵草畏知母蕓薹紫蘇甑帶何首烏鵝不食草部人參色微黃皮薄滋潤明亮濶而獨株味甘回味不苦者良去蘆茯苓馬藺為之使惡鹵鹹溲疏畏五靈脂天門冬劈破去心用柳木甑燒柳木柴蒸一伏時灑酒令逼更添火蒸出曝地黃貝母垣衣為之使忌鯉魚制畏曽青砂浮萍雄黃硇麥門冬産杭州莧橋細白而皺者良水洗去心大抵一斤須减去五六兩凡入湯液或以水潤去心或以瓦焙乘熱去心若入丸散須瓦焙熟即於風中吹冷如此三四次即易燥且不損藥力或以湯浸搗膏和藥亦可滋補藥則以酒浸擂之參地黃車前為之使惡欵冬苦芙苦瓠畏苦青葙木耳鍾伏石乳甘草須去頭尾尖處頭尾土人截作三寸長劈破作六七片以瓷器盛之用浸蒸從巳至午出曝乾或用清水蘸炙或切片用蜜水拌炒如㵼火生用术苦參乾漆為之使惡逺志忌猪肉生地黃大如大指堅實者佳酒洗晒乾以手擘之有聲為度好酒拌勻置瓷甕內包固重湯煮一晝夜勝於蒸者名熟地黃生者酒洗用薑汁縮沙良惡貝母畏蕪荑得酒麥門冬忌葱蒜蘿蔔諸血製地黃勿犯銅鐵器令人腎消并白髮男損榮女損衛也菖蒲勿用泥菖夏菖其二件相似如竹根鞭形黑氣穢味腥不堪用石上生者根條嫩黃堅硬節稠長一寸有九節者是真也用銅刀刮上黃黑硬節皮一重了用嫩桑枝條相拌蒸出曝乾秦皮秦艽為之使飴惡麻黃地膽忌糖羊血鐵器黃連非真川黃連不效折之中有孔色如赤金者良去鬚切片分開粗細各置薑汁拌透用綿紙襯先用山黃土炒乾研細再炒至將紅以連片隔紙放上炒乾再加薑汁切不可用水紙焦易新者如是九次為度赤痢用濕槐花拌炒上法入痢藥中至於治本臟之火則生用之治肝膽之實火則以豬膽汁浸炒治肝膽之虛火則以醋浸炒治上焦之火則以酒炒治中焦之火則以薑汁炒治下焦之火則以鹽水或朴硝炒治氣分濕熱之火則以茱萸湯浸炒治血分塊中伏火則以乾漆水炒諸法不獨為之導引蓋辛熱能制其苦寒鹹寒能制其燥性在用者詳酌之黃芩龍骨理石為之使忌猪肉𤣥畏牛膝欵冬鮮惡冷水菊花參白薑蠶白芫花胡黃連似乾柳枝心黑外黃折之塵出如烟者真忌惡同黃連忌鐵菊花真者味甘色黃單瓣光心去蒂用使术枸杞根桑根白皮青葙葉為之白术米泔浸去油者山黃土裹蒸晒九次洗淨去皮切片晒乾防風地榆為之使忌桃李雀肉菘菜青魚蒼术出茅山細而帶糖香味甘者真米泔浸洗極淨刮去皮拌黑豆蒸又拌蜜酒蒸又拌人乳透蒸凡三次蒸時須烘晒極乾氣方透忌同白术兔絲子米泔淘洗極淨略晒揀去稗草子磨五六次酒浸一宿慢火煮乾木槌去殼一法用酒煮一晝夜搗作餅晒乾然後復研方細一法以白紙條同研方細薯蕷松脂為之使得酒良惡雚菌牛膝酒浸蒸曝乾形長二尺五寸已上者方佳蜀地及懷慶産者良惡螢火龜甲陸英畏白前忌牛肉茺蔚子花紅者良砒忌鐵制三黃石柴胡凡使莖長軟皮赤黃䯸鬚出在平州平縣即今銀州銀縣也西畔生處有白鶴緑鶴於此翔處是柴胡香直上雲間若有過往聞者皆氣爽此種治骨蒸不入發表藥去髭并頭勿令犯火立便無效也皂半夏為之使藜惡莢畏女菀蘆前胡切開白色者良水洗用竹刀刮去蒼黑皮并髭上了細銼以甜竹􅅹浸令潤日中㬠乾用使惡畏同柴胡獨活羌活細銼拌淫羊藿裛二日後曝乾去淫羊藿用免煩人心此服食家治法尋常去皮或焙用爾之蠡實為使升麻緑色者良治滯下用醋拌炒車前子自收𤣥色者良賣家多以葶藶子代充不可不辨使葉勿使蕊莖入補益藥中用米泔淘淨蒸入利水治泄㵼藥炒為末用常山為之使木香形如枯骨油重者良忌見火入煎藥磨汁內熟湯中服若實大腸宜麵煨熟用薯蕷補益藥及脾胃中熟用外科生用遂切用銅刀紫芝為之使惡甘萎㽔凡使勿用黃精并鉤吻二物相似萎㽔上有鬚毛莖班葉尖處有小黃㸃為不同采得以竹刀刮去節皮洗淨以蜜水浸一宿蒸了焙乾用畏鹵鹹薏苡仁顆小色青味草用糯米炒咬著粘人齒凡一兩以糯米一兩同炒令糯米熟去糯米取使或以鹽湯煮過亦得一法瀼湯泡三次去油蒸氣日乾用澤瀉不油不蛀者良細銼酒浸一宿漉出曝乾用一法米泔浸去毛蒸或搗碎焙畏海蛤文蛤忌鐵逺志去心若不去心服之令人悶去心了用熟甘草湯浸一宿漉出曝乾用之得茯苓龍骨冬葵子良廉畏真珠飛藜蘆齊蛤龍膽草甘草湯中浸一宿至明漉出曝乾用勿空腹餌之令人溺不禁貫衆赤小豆為之使惡地黃防葵細辛揀去雙葉服之害人洗淨去泥沙毒曽青草根為之使忌生菜狸肉惡黃茋狼山茱萸畏滑石消石石斛長而中實味不苦者真去頭土了用酒浸一宿漉出於日中曝乾却用酥蒸從巳至酉却徐徐焙乾用石斛鎖陽澀丈夫元氣如斯修事服滿一鎰永不骨痛暫使酒蒸用服餌當如法陸英為之使豆惡凝水石巴畏雷丸巴㦸天去心用枸杞子湯浸一宿待稍軟漉出却用酒浸一伏時又漉出用菊花同熬令焦黃去菊花用布拭令乾用今法惟以酒浸一宿銼焙入藥若急用只以溫水浸軟去心也覆盆子為之使惡雷丸丹參朝生菴䕡子煮汁作飲為末作散俱可荆子薏苡為之使芎藭形塊重實色白者良伏白芷為之使畏黃連雌黃刺蒺藜淨揀擇了蒸從午至酉出日乾於木臼中舂令皮上刺盡用酒拌再蒸從午至酉出日乾用一法炒研去刺為末如入煎藥臨時調服不入湯煎烏頭為之使沙菀蒺藜緑色形如腰子細而香如天池茶者真即同州多僞者或炒或酒漿拌蒸亦不入湯藥黃耆軟如綿直而細中有菊心味甘者良補氣藥中蜜炙用瘡瘍藥中鹽水炒用俱去皮茯苓為之使鮮惡白龜甲肉蓯蓉肥大者良用清酒浸一宿至明以棕刷上去沙土浮甲盡劈破中心去白膜一重如竹絲草樣是此偏隔人心前氣不散令人上氣不出凡使用先須酒浸并刷草了却蒸從午至酉出又用蘇炙得所忌鐵防風實而潤頭節堅者良去蘆并叉頭叉尾者形彎者令人吐勿用畏萆薢惡乾薑藜蘆白蘞芫花蒲黃自採者真勿用松黃并黃􅢠其二件全似只是味粗及吐人凡欲使蒲黃須隔三重紙焙令色黃蒸半日却焙令乾用之妙行血生用止血炒用續斷皺皮黃色折之烟塵起者良用酒浸一伏時捶碎去筋焙乾用地黃為之使惡雷丸漏蘆枯黑如漆味不苦酸者真細銼拌生甘草相對蒸從巳至申去甘草揀淨用連翹為之使天名精一名過冬青即荔枝草吳人又呼為天麻地菘擂汁服垣衣地黃為之使决明子炒研惡蓍實為之使大麻子丹參去蘆賣家多染色須辨之畏鹽水茜根勿用赤柳草根真似茜根只是滋味澀不入藥中用若服令人患內瘴眼速服甘草水解之凡使用銅刀於槐砧上銼日乾勿犯鐵并鉛畏鼠姑制雄黃五味子遼東者佳去枯者銅刀劈作兩片用蜜浸蒸從巳至申或晒或烘炒蓯蓉為之使惡葳㽔烏勝頭忍冬花四月采藤葉不拘時采俱隂乾不見日火蛇床子凡使須用濃鹽汁百部煎濃汁二味同浸三伏時漉出日乾却用生地黃汁相拌蒸從午至亥日乾用母巴豆惡牡丹貝伏硫黃茵陳蒿須用葉有八角者採得隂乾去根細銼用勿令犯火山茵陳俗呼為帝鐘茵蔯即八角也伏硇砂沙參去蘆白實味甘者良惡防已王不留行拌濕蒸之從巳至未以漿水浸一宿焙乾用乾薑馬湖者良微炒若治産後血虛發熱及止血俱炒黑溫中炮用散寒邪理肺氣止嘔生用秦椒為之使殺惡黃芩黃連天鼠糞半夏南星莨菪毒生薑不宜使熟宜搗絞汁待藥煎成傾入方不失生字之義如入藥煎乃熟薑非生薑矣使惡殺同乾薑枲耳實蒸用或炒熟搗去刺用忌猪肉馬肉米泔葛根雪白多粉者良葛花消酒煎飲括樓根雪白多粉者良畏枸杞為之使惡乾薑牛膝乾漆括樓仁搗碎用粗紙壓去油苦參先須用糯米濃泔汁浸一宿上有腥穢氣并在水靣上浮並須重重淘過即蒸從巳至申出曝乾細銼用之不入湯藥貝母漏蘆兔絲子𤣥參為之使硝惡伏汞雌黃熖當歸包白味甘者良去塵并頭尖硬處一分已來洗淨酒浸一宿若要破血即使頭一節硬實處若要止痛止血即用尾若一概用不如不使服食無效單使妙也惡䕡茹濕麵制雄黃畏菖蒲生薑海藻牡蒙麻黃陳久者良去節并沫若不盡服之令人悶用夾刀剪去節并頭槐砧上用銅刀細銼煎三四十沸竹片掠去上沫盡漉出熬乾用之韋厚朴白微為之使惡辛夷石白芍藥以竹刀刮去粗皮并頭土了銼之將蜜水拌蒸從巳至未曝乾用之今人多以酒浸蒸切片或用煩亦良藥為之使須丸烏藥末惡石斛芒硝赤芍藥製度并使惡同白芍藥瞿麥只用蕊殼不用莖葉若一時使即空心令人氣咽小便不禁凡欲用先須以堇竹瀝浸一伏時漉出晒乾用螵牡丹蓑草為之使惡蛸伏丹砂𤣥參墨黑者良用蒲草重重相隔入甑蒸兩伏時後出乾勿令犯銅鐵餌之噎人喉喪人目揀去蒲草盡了用之一法用酒洗去塵土切片晒乾用惡黃茋乾薑大棗山茱萸秦艽凡使秦并艽須於腳文處認取左文列為文即治疾艽即發腳氣凡用秦先以布拭上黃肉毛盡然後用童便浸一宿至明出日乾用菖蒲為之使畏牛乳百合白花者良酒拌蒸知母皮黃肉白者良於槐砧上細銼焙乾木臼杵搗一法去毛蜜炙勿令犯鐵器得黃蘖及酒良伏蓬砂鹽貝母黃白輕鬆者良先於柳木灰中炮令黃劈破去內口鼻上有米許大者心一小顆後拌糯米於銚上同炒待米黃熟然後去米取出其中有獨顆團不作兩片無皺者號曰丹龍精不入藥用若誤服令人筋脉不收用黃精小藍汁合服立愈礜厚朴白薇為之使惡桃花畏秦艽莾草石白芷白色不蛀者良制當歸為之使惡旋覆花雄黃硫黃淫羊藿細銼用羊脂相對拌炒過待羊脂盡為度每修事一斤用羊脂四兩為度也薯蕷紫芝為之使得酒良黃芩大肺經用枯芩去腐酒浸切炒入大腸或安胎等俱用子芩酒浸切炒龍骨山茱萸為之使惡葱實丹畏丹砂牡藜蘆狗脊凡修事火燎去毛細銼了酒拌蒸從巳至申出曝乾用萆薢為之使惡莎草敗醬茅根洗淨搗爛勿用露根紫菀用東流水淘洗令淨用蜜浸一宿火上焙乾用凡修事一兩用蜜二分欵冬為之使惡天雄藁本雷丸逺志瞿麥畏茵蔯紫草真者方佳須用蠟水蒸之待水乾取去頭并兩畔髭細銼用每修事紫草一斤用蠟三兩於鐺中鎔淨便投蠟水作湯用通草即木通也有紫白二色紫者皮厚味辛白者皮薄味淡二者皆能通利藁本去蘆水洗切葙惡䕡茹畏青子石韋背有黃毛須拭極淨羊脂拌炒焦黃色砂滑石杏仁射干為之使得菖蒲良制丹礬石萆薢其根細長淺白者真酒浸一宿焙乾黃忌鐵薏苡為之使畏前胡柴胡牡蠣大葵根土茯苓忌鐵茶白薇用糯米泔汁浸一宿至明取出去髭了於槐砧上細銼蒸從巳至申出用夏月浸二時許惡黃茋乾薑大棗山茱萸大黃大㦸乾漆大青處處有之三四月采莖隂乾艾葉産蘄州者良入藥用新炙火用陳苦酒香附為之使惡實一名鼠粘子一名牛旁子一名大力子用酒拌蒸待上有薄白霜重出却用布拭上然後焙乾搗如粉用水萍紫背浮萍七月采之揀淨以竹篩攤晒下置水一盆映之即易乾也王瓜根能吐下子生用潤心肺治黃病炒用治肺痿吐血腸風㵼血赤白痢反胃吐食取汁制雄汞地榆切之如綿者良酒洗雄得髮良惡麥門冬伏丹砂黃硫黃大小薊根消腫搗汁止血燒灰存性海藻凡使先須用生烏豆并紫背天葵和海藻三件同蒸一伏時候日乾用之近人但洗淨鹹味焙乾用甘反草澤蘭凡使先要别識雄雌其形不同大澤蘭形葉皆圓根青黃能生血調氣與缺合小澤蘭逈别採得後看葉上斑根須尖莖方此藥能破血通久積凡修事大小澤蘭須細銼之用絹袋盛懸於屋南畔角上令乾用使防己為之昆布凡使先用弊甑簟同煮去鹹味焙細銼用每修事一斤用甑簟十個用昆布細銼二味各一處下東流水從巳至亥水旋添勿令少防己凡使勿使木條以其木條已黃腥皮皺上有子足子不堪用凡使防己要心花文黃色者然後細銼車前草根相對同蒸半日後出取去車前草根細銼用之一法用酒洗切殷孽為之使惡細辛畏萆薢女菀鹵鹹殺雄黃硝石毒天麻透明者良天麻十兩用蒺藜子一鎰緩火熬焦熟後便先安置天麻十兩於瓶中上用火熬過蒺藜子蓋內外便用三重紙蓋并繫從巳至未時又出蒺藜子再入熬炒准前安天麻瓶內用炒了蒺藜子於中依前蓋又隔一伏時後出如此七遍瓶盛出後用布拭上氣汗用刀劈焙之細銼單搗一法麵裹煨透切阿魏凡使各有訛僞有三驗第一驗將半銖安於銅器中一宿至明霑阿魏處白如銀汞無赤色第二驗將一銖置於五㪷草自然汁中一夜至明如鮮血色第三驗將一銖安於柚樹上樹立乾便是真色黑者力微黃溏者力上凡使先於淨鉢中研如粉了於熱酒器上裛過任入藥用香薷八九月開花著穗時采之去根留葉隂乾勿令犯火服至十兩一生不得食白山桃也百部根去心皮用酒浸一宿漉出焙乾細銼用欵冬花花未舒者良去梗蒂甘草水浸一時晒乾用石杏仁為之使得紫菀良惡𤣥參皂莢消黃畏貝母麻黃辛夷芩黃茋連翹青葙紅藍花自種者真得酒良牡丹皮凡使採得後日乾用銅刀劈破去骨了細銼如大豆許用清酒拌蒸從巳至未出日乾用濶而厚者良兔忌蒜胡荽大伏砒畏絲子貝母黃三稜去毛米醋浸一日切片炒或煮熟焙乾入藥乃良青黛水飛去腳緣中有石灰入服餌藥中宜飛淨用一法用青布浸汁代之鬱金色赤似薑黃蟬肚者良置生雞血中化成水者真磨汁臨服入藥盧㑹上有青竹文斑并光膩味極苦勿便和衆藥搗此末先搗成粉待衆藥末出然後入藥中延胡索産茅山溪陵澗粒粒金黃色者良醋煮切肉豆䓻不油不蛀不皺皮者佳糯米作粉使熱湯搜裹豆䓻於糖灰中炮待米團子焦黃熟然後出去米粉用勿令犯銅鐵白豆䓻藥煎成方炒研入一二沸即起入丸待諸藥細末後方入勿隔宿砂仁略炒吹去衣研用入湯丸法同白豆蔲脾得白檀香豆䓻為使入肺得人參益智為使入得黃檗茯苓為使入腎得赤白石脂為使入大小腸得訶子白蕪荑鱉甲良補骨脂即破故紙形圓實色黑者良此藥性本太燥每用酒浸一宿後漉出浮者去之却用東流水浸三日夜却蒸從巳至申出日乾用血忌鐵得胡桃胡麻良惡甘草忌諸藝薹蓬莪荗凡使於砂盆中用醋磨令盡然後於火畔吸令乾重篩過用一法火炮醋浸煨切得酒醋良白前用生甘草水浸一伏時後漉出去頭鬚了焙乾任入藥中用薺苨解百藥毒生搗汁服或末煮俱可白藥子末用香附細者佳去毛以水洗淨揀去砂石於石臼內搗去皮用童便浸透晒搗用或以酒醋酥鹽水薑汁浸俱瓦上焙乾便得芎藭蒼术醋童子小良忌鐵鱧腸即旱蓮草性太寒宜熬膏用須日色中忌鐵使君子慢煨香熱用或云七生七煨食亦良忌飲熱茶犯之即㵼翦草治肺熱吐血有神舊出婺州今産寧州附子底平有九角如鐵色一箇重一兩即是氣全堪用修事十兩於文武火中炮令皴折者去之用刀刮上孕子并去底尖微細劈破於屋下午地上掘一坑可深一尺安於中一宿至明取出焙乾用麩炒欲炮者灰火勿用雜木火只用柳木最多若隂制使即生去尖皮底薄切用東流水并黑豆浸五日夜然後漉出於日中曝今乾用凡使須隂制去皮尖了每十兩用生烏豆五兩東流水六升一云此物性太烈古方用火炮不若用童便煮透尤良蚣地膽為之使得蜀椒食鹽下達命門惡蜈豉汁緑畏防風甘草人參黃茋豆烏韭童溲犀角半夏陳久者良若修事四兩用搗了白芥子末二兩頭醋六兩二味攪令濁將半夏投中洗三遍用之半夏上有巢涎若洗不淨令人氣逆肝氣怒滿若入治痰飲藥用白礬湯入薑汁浸透洗淨用無白星為度造麴法用半夏不拘多少將滚湯泡過宿搗爛每一斗入生薑一斤同搗之作餅子用乾稻稈或粟麥稈􅝛之如􅝛麴法乾久用畏射干柴胡為之使惡皂莢海藻飴糖羊血生薑乾薑秦皮龜甲雄黃大黃細切內文如水旋斑緊重銼蒸從巳至未晒乾又用臘水蒸從未至亥如此蒸七度却酒薄蜜水再蒸一伏時其大黃譬如烏膏樣於日中晒乾用之為妙下藥酒浸一時煮二三沸即服黃芩為之使忌惡乾漆冷水桔梗味苦而有心者良凡使去頭上尖硬二三分已來并兩畔附枝子於槐砧上細銼用百合水浸一伏時漉出緩火熬令乾用每修事四兩用生百合五分搗作膏投於水中浸一法用米泔浸一宿微焙用膽節皮為之使肉畏白及龍龍眼忌猪伏砒草蒿即青蒿葉細而香自採佳隂乾凡使唯中為妙到膝即仰到腰即俯使子勿使葉使根勿使莖四件若同使翻然成痼疾採得葉不計多少用童溺浸七日七夜後漉出晒乾伏硫黃旋覆花去裹花蕊殼皮并蒂蒸巳至午晒乾用射干不辣者良米泔水浸一宿漉出然後用蓳竹葉煮從午至亥漉出日乾用之常山如雞骨者良春使莖葉夏秋冬使根酒浸一宿至明漉出日乾熬搗少用勿令老人久病者服之切忌菘畏玉札忌石葱菜伏砒甘遂用生甘草湯小薺苨自然汁二味攪浸三日其水如墨汁更漉出用東流水淘六七次令水清為度漉出於土器中熬令脆用之一法麵包煨熱去麵瓜蒂為之使惡逺志白斂生取根搗爛可傳癰腫代赭為之使白及水洗切惡理石紫石英為之使畏杏仁李核仁貫衆洗淨切片炒伏雚菌赤小豆為之使石鍾乳何首烏冬至後採者良入春則芽而中空矣北人以贋種欺人香氣不能混也臨用勿去皮以苦竹刀切米泔浸經宿同豆九蒸九晒木杵臼搗之勿犯鐵器茯苓為之使忌葱蒜蘿蔔諸血無鱗魚威靈仙去蘆酒洗忌茶麵湯牽牛子即草金零入水中淘浮者去之取沉者㬠乾拌酒蒸從巳至未㬠乾臨用舂去黑皮用之黑者力速磨取頭末入藥得乾薑青木香良萆麻子形似巴豆節節有黃黑斑㸃凡使先須和皮用鹽湯煮半日去皮取子研過用忌炒豆伏丹砂粉霜天南星陳久鬆白者良滚湯明礬或薑汁拌和泡用一用泡過者為末入臘月黑牛膽中隂乾用蜀漆為之使防得火牛膽良雌惡莾草熖畏附子乾薑風生薑伏黃丹砂硝稀蘞方赤莖者良採葉隂乾醇酒拌九蒸九晒忌鐵苧根此物大能補隂而行滯血方藥以其目前賤物多不用白頭翁花子莖葉同酒蠡實為之使得良蘆根逆水生并黃泡肥厚味甘者良露根勿用去鬚節并赤黃皮用其汁消痰開胃下氣除熱解一切食物魚蝦河魨魚馬兜鈴凡使採得後去葉并蔓了用生絹袋盛於東屋角畔懸令乾了劈作片取向裏子去革膜並令淨用子勿令去革膜不盡用並皮炒入藥仙茅刮上皮於槐砧上用銅刀切豆許大却用生稀布袋盛於烏豆水中浸一宿取出用酒濕拌了蒸從巳至亥取出曝乾勿犯鐵斑人鬚鬢禁食牛乳及黑牛肉劉寄奴凡使去梗以布拭上薄殼皮令淨拌酒蒸從巳至申出曝乾用之莖葉花子皆可用骨碎補生江南根著樹石上採得用銅刀刮去上黃赤毛盡便細切用蜜拌令潤架柳甑蒸一日後出曝乾用一法去毛細切後用生蜜拌蒸從巳至亥連翹黑而閉口者良去蒂根研續隨子凡用去殼取色白者以紙包壓去油取霜用山豆根或末或研或噙咽白附子竹節者良炮去皮得火良預知子去皮研服木賊草去節童便浸一宿焙乾蒲公草自採鮮者入湯藥煎入丸末𫝊瘡毒搗爛用榖精草土瓜為之使砂忌鐵伏汞夏枯草土瓜為之使砂忌鐵伏汞山慈菰根出浙江處州府遂昌縣洪山地方市中無真者形光無毛本草注中云有毛誤也燈心草蒸熟待乾折取中心白穰燃燈者是為熟草不蒸者生乾剝取為生草入藥用之最難研以粳米粉漿染過晒乾研末入水澄之浮者是燈心也晒乾用海金沙或丸或散沙及草俱可入藥萱草根晒乾為末或用水煎酒煎研汁皆可服藿香自種者良揉之如蘹香氣者真薄荷香者非也絡石凡採得後用粗布楷葉上莖蔓上毛了用熟甘草水浸一伏時出切日乾任用杜仲牡丹為之使惡鐵落殺畏貝母菖蒲孽毒木部桂凡使勿薄者要紫色厚者去上粗皮取心中味辛者使每斤大厚紫桂只取得五兩取有味厚處生用加末用即用重蜜熟絹并紙裹勿令犯風其州土只有桂草元無桂心用桂草煮丹陽木皮遂成桂心凡用即單搗用之胡得人參甘草麥門冬大黃黃芩調中益氣得柴紫石英乾地黃療吐逆葱忌生石脂桂枝即桂之枝條輕薄者槐實凡採得後去單子并五子者只取兩子三子者凡使用銅槌槌之令破用烏牛乳浸一宿蒸過用景天為之使槐花未開時收采陳久者良入藥揀淨酒浸微炒若止血炒黑枸杞根即地骨皮凡使根掘得後用東流水浸以物刷上土了待乾破去心用熱甘草湯浸一宿然後焙乾用其根若似物命形狀者上春食葉夏食子秋食根并子也制硫黃丹砂枸杞子去蒂及枯者酒潤一夜搗爛入藥柏實去油者酒拌蒸另搗如泥或蒸熟曝烈舂簸取仁砂研入藥瓜子牡蠣桂為之使畏菊花羊蹄諸石及麵麯伏砒硝柏葉向月令採之春東夏南秋西冬北使畏伏同實茯苓堅白者良去皮搗為末於水盆中攪三次將濁浮者去之是茯苓筋若誤服之令人眼中童子并黑精㸃小兼盲日切記如飛澄浮晒乾人乳拌蒸用赤茯苓則不必飛也使惡畏忌同茯神茯神去皮木用英馬問為之使白得甘草防風芍藥麥門冬紫石療五臟惡蘝畏地榆秦芁牡䝉龜甲雄黃物忌米醋及酸琥珀凡用紅松脂石珀水珀花珀物象珀㙠珀琥珀紅松脂如琥珀只是濁太脆文橫水珀多無紅色如淺黃多粗皮皺石珀如石重色黃不堪用花珀文似新馬尾松心文一路赤一路黃物象珀其內自有物命動此使有神妙㙠珀其珀是衆珀之長故號曰㙠珀琥珀如血色於布上拭吸得芥子者真也大率以輕而透明者為佳入藥中用水調側柏子末安於瓷鍋子中安琥珀於末中了下火煮從巳至申别有異光别搗如粉重篩用一法用細布包內豆腐鍋中煮之然後灰火略煨過入目製用安心神生用酸棗粒粒粗勿碎皮者良炒爆研細入藥如砂仁法勿隔宿惡防己黃檗木即黃檗也凡使用刀削上粗皮了用生蜜水浸半日漉出晒乾用蜜塗文武火炙令蜜盡為度凡修事五兩用蜜三兩一法用鹽酒拌炒褐色惡甘漆伏硫黃楮實凡使採得後用水浸三日將物攪旋投水浮者去之晒乾用酒浸一伏時了便蒸從巳至亥出焙令乾用之松脂凡用以胡葱同煮二十沸入冷水揉扯數十次晒乾用降真香以畨舶來者色較紅香氣甛而不辣用之入藥殊勝色深紫者不良茗苦􅟒入清頭目藥用苦􅟒消食下氣用佳茗南燭莖葉搗汁漬米炊飯子入澀精補益藥用乾漆火煆黑烟起盡存性研如飛塵蟹半夏為之使畏雞子紫蘇杉木漆姑草忌油脂五加皮五葉者是剝皮去骨隂乾皮逺志為之使畏𤣥參蛇蔓荆實凡使去蒂子下白膜一重用酒浸一伏時後蒸從巳至未出㬠用一法炒捶碎用惡烏頭石膏辛夷凡用去粗皮拭上白赤毛了去心即以芭蕉水浸一宿漉出用漿水煮過從巳至未出焙乾用若治眼目中患即一時去皮用向裏實者環芎藭為之使惡五石脂畏菖蒲黃石膏黃桑上寄生凡使在樹上自然生獨枝樹是也採得後用銅刀和根枝莖細銼隂乾了用忌火杜仲極厚者良削去粗皮每一斤用酥一兩蜜三兩和塗火炙以盡為度一法用酒炒斷絲以漸取屑方不焦蛻惡𤣥參蛇皮女貞實按本草女貞實與冬青似是而非也女貞葉長四五寸子黑冬青葉團子微紅俱霜後採隂乾去粗皮內更有細皮實白色酒拌黑豆同蒸九次楓香脂凡用以虀水煮二十沸入泠水中揉扯數十次晒乾用㽔核凡使湯浸去皮尖擘作兩片用芒硝木通草二味和㽔仁同水煮一伏時後漉出去諸般藥取㽔仁研成膏任加減入藥中使每修事四兩用芒硝一兩木通草七兩一法去衣綿紙包研去油用丁香凡使有雄雌雄顆小雌顆大似檈棗核方中多使雌力大膏煎中用雄若欲使雄須去下蓋乳子發人背癰也入煎藥為末調入或將好火投入一二沸即傾畏鬱金忌沉香凡使須要不枯色黑潤者良如觜角硬重沉於水下為上也半沉者次也入散中用須候衆藥出即入拌和用之入煎磨汁忌見火乳香圓小光明者良古方以燈心同研或以糯米數粒中同研或以人指甲二三片同研或以乳鉢坐熱水乳之云皆易細總不如研細和人乳略蒸再研勻晒乾研如飛塵為妙藥將沉下一二即起勿多煮沒藥透明者良製同乳香法金櫻子熬膏服或和藥霜降後採金櫻子不拘多少以粗氣微搗去毛刺淨復搗破去子約有一斗用水二斗煮之一飯時漉起清汁又入白水煮之又漉起又入白水煮三次之後其渣淡而無味去之止將淨汁復以細蜜絹濾過淨鍋熬之如飴乃止收貯磁􅀈中坐凉水內一宿用服之大能固精良方二仙丹即此膏加入芡實粉桑根白皮自採入土東行者或竹刀或銅刀刮去黃粗皮手析成絲拌蜜瓦上炙根浮土上者殺人子桂心續斷麻器為之使忌鐵桑葉煎湯研汁為末俱可經霜者另取洗眼用淡竹葉䈽竹葉别有用竹瀝用取新鮮金竹鋸尺許中留節兩頭去節劈兩開不拘多少用磚二塊架定竹兩頭出磚二寸許各以磁盤置於下候瀝滴其中用烈火薰逼則兩頭濈濈滴瀝於􅌉中竹將自燃瀝便盡矣就將滴過瀝竹為薪又架新竹於磚上如前燒逼任取多少淡竹䈽竹苦竹慈竹惟四種各有瀝堪用薑汁為之使竹皮茹取極鮮竹刮皮磋去外硬青勿用止淡竹筀竹苦竹堪用餘不入藥吳茱萸凡使先去葉核并雜物了用大盆一口使鹽水洗一百轉自然無涎日乾任入丸散中用修事十兩用鹽二兩研作末投東流水四斗中分作餘一百度洗别有大效若用醋煮即先沸醋三十沸後入茱萸待醋盡度蓼實為之使乾每用十兩使醋一鎰為丹參消石白堊畏紫石英檳榔凡使取外存坐穩心文如流水碎破內文如錦别紋者妙半白半黑并心虛者不入藥用凡使須檳與榔頭圓身形矮毗者是榔身形尖紫文粗者是檳檳力小榔力大欲使先以刀刮去底細切勿經火恐無力效若熟使不如不用梔子凡使勿用顆大者號曰伏尸梔子無力須要如雀腦并鬚長有九路赤色者上凡使先去皮鬚了取九稜者仁以甘草水浸一宿漉出焙乾搗晒如赤金末用大率治上焦中焦連殼用下焦去殼洗去黃漿炒用治血病炒黑用騏驎竭凡使勿用海母血真似騏驎竭只是味鹽并腥氣騏驎竭味微鹽甘似栀子氣是也欲使先研作粉重篩過丸散膏中任使用勿與衆藥同搗化作飛塵也得蜜陀僧良龍腦香即氷片也形似白松脂作杉木氣明淨者善久經風日或如雀屎者不佳今人多以樟腦身打亂之不可不辨也云合糯耳米炭相思子貯之則不耗膏主聾蕪荑妙去榖氣嗅如信者真枳殼凡使勿使枳實緣性效不同若使枳殼取辛苦腥并冇隟油能消一切㿏要陳久年深者為上用時先去瓤以麩炒過待麩黑燋遂出用布拭上燋黑然後單搗如粉用産江右者良枳實色黑陳久者良去穰麩炒黃色厚朴凡使要用紫色有油質厚者良去粗皮用酥炙過每修事一斤用酥四兩炙了細銼用若湯飲下使用自然薑汁八兩炙一升為度忌乾薑為之使惡澤㵼消石寒水石豆山茱萸凡使勿用雀兒酥真似山茱萸只是核八稜不入藥用圓而紅潤肉厚者佳酒拌砂鍋上蒸去核了一斤取肉皮用只稱成四兩已來凡蒸藥用柳木甑去水八九寸水不泛上餘悉准此蓼實為之使惡桔梗防風防己胡桐淚形似黃礬而堅實有夾爛木者木淚乃樹脂流出者其狀如膏油石淚乃脂入土石間者其狀成塊以其得鹵斥之氣故入藥為勝伏砒石猪苓用銅刀削去粗皮一重薄切下東流水浸一夜至明漉出細切蒸一日出㬠乾用一云猪苓取其行濕生用更佳烏藥連珠者良洗淨切龍眼生者沸湯瀹遇食不動脾安息香或燒薰或末服仙人杖此是笋欲成時立死者色黑如漆五六月收之海桐皮酒浸服亦可入煎五倍子或生或炒俱為末入藥大腹擘去垢黑用溫水洗淨再用黑豆汁洗方可用日乾此樹鴆鳥多棲之遺屎在皮上不淨恐有毒今人用之不製大誤天竺黃輕者真伏粉霜蜜蒙花凡使先揀令淨用酒浸一宿漉出候乾却拌蜜令潤蒸從卯至酉出日乾如此拌蒸三度又却日乾用每修事一兩用酒八兩浸待色變用蜜半兩蒸為度此元名水錦花巴豆凡使巴之與豆及剛子須在仔細認勿誤用殺人巴顆小緊實色黃豆顆有三稜黑色剛子顆小似棗核兩頭尖巴與豆即用剛子勿使凡修事巴豆敲碎去油淨用白絹袋包甘草水煮焙乾或研膏用每修事一兩以酒麻油各七合盡為度為瘡瘍傳藥須炒黑存性能去瘀肉生新肉有神芫花為之使蘆得火良笋惡蓑草牽牛水畏大黃藜黃連蘆醬豉豆汁冷蜀椒一名南椒凡使須去目及閉口者不用其椒子先須酒拌令濕蒸從巳至午放冷密蓋除下火四畔無氣後取出便入瓷器中盛勿令傷風用也雄杏仁為之使得鹽良畏欵冬花防風附子黃槖吾冷水麻仁漿皂莢凡使須要赤膩肥并不蛀者用新汲水浸一宿用銅刀削上粗皮用酥反覆炙酥盡為度取出槌之去子搗篩皂莢一兩酥二分子收得揀取圓滿堅硬不蛀者用瓶盛下水於火畔煮待炮熟剝去硬皮一重取向裏白嫩肉兩片去黃其黃消人腎氣將白兩片用銅刀細切於日中乾用一法麵裹煨去核參柏實為之使砂惡麥門冬硇畏空青人苦參伏丹粉霜硫黃砂訶子本名訶黎勒凡使勿用毗梨勒罨梨勒榔精勒雜路勒若訶梨勒文只有六路或多或少並是雜路勒毗路勒個個毗雜路勒皆圓露文或八路至十三路號曰榔精勒多澀不入用凡修事先於酒內浸然後蒸一伏時其訶梨勒以刀削路細銼焙乾用之赤柳柳治痧疹聖藥也得之毒自出可不死棟實凡採得後㬠乾酒拌浸令濕蒸待上皮軟剝去皮取肉去核勿單用其核槌碎用漿水煮一伏時了用如使肉即不使核使核即不使肉茴香為之使椿木椿木根凡使不近西頭者上及不用其葉只有根採出拌生葱蒸半日出生葱細銼用袋盛掛屋南畔隂乾用偏利溺澀也一法用根皮漂淨酒拌蒸無食子凡使勿令犯銅鐵并被火驚者顆小文細上無杴米者炒用漿水於砂盆中或硬石上研令盡却焙乾研了用勿搗能為黑犀色雷丸赤色者殺人取肉白者用甘草水浸一宿銅刀刮上黑皮破作四五片又用甘草湯浸一宿後蒸從巳至未出日乾却以酒拌如前從巳至未蒸日乾用一法用蒼术湯泡去皮切厚朴芫花蓄根荔實為之使惡葛根蘇方木紅潤者良凡使去粗皮并節了若有中心文橫如紫角者號曰木中尊色甚緻倍常百等須細銼了重搗拌細條梅枝蒸從巳至申出隂乾用楜椒凡使只用內無皺殼者用方大漢椒使殼胡椒使子每修煉了於石槽中碾碎成粉用益智子去殼炒臨用研樺木皮主諸黃疸濃煮汁飲之良棐實同鵝肉食生斷節風又上壅人皮反緑豆能殺人忌火氣木鱉子入藥去油者柞木子能開交骨所以催生有神棕櫚子入藥燒灰用不可絶過即是煅存性研如飛塵散瘀止血之神藥也木槿入藥炒用取汁度絲使得易落果部豆䓻俗名草果者是也去蒂并內裏子後取皮同茱萸於鍋中緩炒待茱萸微黃黑即去茱萸取草豆䓻皮及子杵用之蓮肉去心勿去皮分作兩片每片分作四小塊瓦上焙焦色一法每一斤用豶豬肚一個盛貯煮熟搗焙用之术得茯苓山藥白枸杞子良荷鼻採荷葉近蒂者是黃畏桐油伏白銀硫橘皮真廣陳皮猪鬃紋香氣異常去白時不可浸於水中止以滚湯手蘸三次輕輕刮去白要極淨橘核以新瓦焙香去殼取仁研碎入藥青皮以湯浸去瓤切片醋拌瓦炒過用大棗去核有齒病疳病蟲慝人及小兒不宜食腹忌與葱同食令人五臟不和與魚同食令人腰痛栗日中曝乾食下氣補益火煨去汗亦佳生食有木氣不補益人蒸炒熟食壅氣凡患風人及小兒不可食解羊肉羶覆盆子凡使用東流水淘去黃葉并皮蒂盡子用酒拌蒸一宿以東流水淘兩遍晒乾方用為妙也雞頭實凡用蒸熟烈日晒裂取仁亦可舂取粉用入澀精藥有連殼用者一云芡實一斗以防風四兩煎湯浸過用且經久不壞烏梅去核微炒用造法取青梅籃盛於􅊳上薰黑若以稻灰淋汁潤濕蒸過則肥澤不蠧忌猪肉木瓜産宣州者真即彼處多以小梨充之勿令犯鐵用銅刀削去硬皮并子薄切於日中晒却用黃牛乳汁拌蒸從巳至未其木瓜如膏煎却於日中攤晒乾用也今止去穰槌碎用柿不用火烘日晒採青者收置器中自然紅熟澀味解盡去而甘不可與蟹同食作㵼惟木香磨汁飲可柿霜用大柿去皮捻遍日晒夜露至乾內甕中待生白霜乃取出市者多僞不入藥烏芋即荸薺也能消瘴氣枇杷葉凡使採得後稱濕者一葉重一兩乾者三葉重一兩是氣足堪用以粗布拭上毛令盡用甘草湯洗一遍却用綿再拭極淨每一兩以酥一分炙之酥盡為度如治肺病以蜜塗炙治胃病以薑汁塗炙此物治咳嗽如去毛不盡反令人嗽也甘蔗榨漿飲消渴解酒痧疹最宜桃仁七月采之去皮尖及雙仁者麩炒研如泥或燒存性用此破血行瘀血之要藥也雷公法用白术烏豆一味和桃仁同於垍堝子中煮一伏時後漉出用手擘作兩片其心黃如金色任用之行血宜連皮尖生用使香附為之桃花三月三日采隂乾之勿使千葉者能使人鼻衄不止目黃凡用揀令淨以絹袋盛於簷下懸令乾去塵用桃梟是千葉桃花結子在樹上不落者於十一月內採得一云正月采之中實者良凡修事以酒拌蒸從巳至未焙乾以銅刀切焙取肉性用一法搗碎炒若止血炒黑存杏仁五月采之以湯浸去皮尖及雙仁者麩炒研用治風寒肺病藥中亦有連皮尖用者取其發散也梨子消熱痰加牛黃末療小兒風疾痰湧有神解熱毒久服不患癰疽橄欖中河豚毒煮汁服或生嚼山查水潤蒸去核淨肉用米榖部胡麻凡修事以水淘浮者去之沉者漉出令乾以酒拌蒸從巳至亥出攤晒乾於臼中舂令粗皮一重盡拌小豆相對同炒小豆熟即出去小豆用之蒸不熟令人髮落與茯苓相宜麻子極難去殼取帛包置沸湯中浸至冷出之垂井中一夜勿令著水次日日中曝乾就新瓦上挼去殼簸揚取仁粒粒皆完畏牡蠣白茯苓白微飴糖糯米作者入藥粟米者次之餘但可食耳生大豆或搗或煮汁或炒屑各有用龍得前胡烏喙杏仁牡蠣諸膽汁良惡五參膽豆黃屑忌猪肉小兒以炒豆豬肉同食必壅氣致死十有八九十嵗以上不畏也赤小豆法同大豆合魚酢食成消渴大豆黃卷或研爛絞汁或炒為末用黑大豆為蘗牙生華五寸長便乾之名為黃卷一法壬癸日以井水浸大豆候生芽取皮隂乾用惡得前胡杏子牡蠣鳥喙天雄鼠屎共蜜和良海藻龍膽酒人為火燎以陳酒浸之止痛拔出火毒令人不死粟米即小米陳者與杏仁同食令人吐㵼秫米小兒病人不宜多食粳米陳者下氣病人宜之糵米凡榖皆可生蘖有粟黍榖麥豆諸糵皆水浸脹候生芽曝乾去鬚取其中米炒研麵用其功皆主消導麥粟糵有稻糵穬蘖各用舂杵頭細糠凡榖皆有糠粳稻粟秫者勝北方多用杵南方多用碓入藥並用丹家云糠火煉物力倍於常小麥浮者止汗須揀淨焙用麥麩性凉用炒諸藥蕎麥壓丹石毒作麵和猪羊肉熱食不過八九頓即患熱風鬚眉脫落還生亦希涇汾以北多此疾又不可合黃魚食家常多犯故特拈著麯凡使須陳久者搗作末後掘地坑深二尺用物褁內坑中至一宿明出焙乾用神麯五月五日六月六日或三伏日為諸神集㑹之辰故名神麯如過此日造者非也法用白虎白麵一百斤勾陳蒼耳自然汁三升騰蛇青蓼自然汁四升青龍青蒿自然汁三廾𤣥武杏仁四升泡去皮尖搗爛入麵朱雀赤小豆三升煮熟去皮葉搗爛和麵一處勻一如造酒麵法以麻葉或楮包罯如造醬黃法待生黃衣晒收之凡用須火炒黃以助土氣陳久者良藊豆紫花者良炒去殼打碎及解酒河豚魚一切草木毒生嚼煮汁飲淡豆豉出江西者良黑豆性平作豉則溫既經蒸罯故能升能散得葱則發汗得鹽則能吐得酒則治風得薤則治痢得蒜則止血炒熟則又能止汗紅麯亦出江西陳久者良吹淨炒研用緑豆生研絞汁或煮食用之宜連皮去皮則令人缺壅氣當是皮寒肉平故也圓小緑者佳反棐子殼切忌鯉魚酢連解金石砒霜一草木諸毒皮生研水服醋米造陳者良醋酒為用無所不入故製藥多用之服茯苓丹參不可食醋醬豆作者良麥作者不用以久久為佳又有肉醬魚醬皆呼為醢不入藥用罌子粟用熱水泡軟擘去筋膜切成絲用蜜水或米醋拌微炒晒乾用忌蒜醋胡椒菜部瓜蒂凡使勿用白瓜蒂要採取青緑色瓜待瓜氣足其瓜蒂自然落在蔓莖上採得未用時使櫛櫛葉裹於東墻有風處挂令吹乾用白冬瓜此物經霜後皮上白如粉塗故云白冬瓜也被霜後取置經年破取核水洗燥去殼擂仁用一用皮肉搗絞汁服白芥子研用萊蔔生食熟食俱可治久脾泄百藥不效煮食經年無不效者但不可與地黃同食多食動氣惟生薑能制其毒伏硇砂萊蔔子炒研能消食性峻利傷人真氣勿久服黃蜀葵花瘡家要藥作末及浸油俱可葱頭取根白一二寸連鬚用洗淨忌蜜及常山韭絞生汁飲其子入藥揀淨蒸熟暴乾簸去黑皮炒黃研用忌蜜及牛肉伏石鍾乳乳香荆芥陳者良去梗取穗若用止血須炒黑蘇子自收方真市者俱僞略妙研極細煎成藥投入二三沸即傾紫蘇兩靣俱紫自種者真薄荷産蘇州龍腦者良苦匏即苦壺盧也凡用須細理瑩淨無黶翳者乃佳不爾有毒馬齒莧凡使勿用葉大者不是馬齒莧亦無水銀忌與鱉同食食之俱變成龞嚙人腹至不可治蕺菜治肺􅏴俗名魚腥草生隂處木耳桑槐樹生者良煮羮食有用罐藥盛大火內煆去烟存性為末入人部髮髲凡使是男子年可二十已來無疾患顔貌紅白於頂心剪下者髮是凡於丸散膏中先用苦參水浸一宿漉出入瓶子以火煅之令通赤放冷研用人乳汁白而不腥者良人牙齒入藥燒用人糞宜用絶乾者搗末沸湯沃服之一名金汁埋地中年久者良人溺肥白無病童子味不鹹雪白者良人中白溺器中者良火煆研褌襠取中裩近隱處男用女女用男或取汁或燒灰服天靈蓋凡使彌腐爛者佳冇一片如三指濶者取得用煻灰火罨一夜待腥穢氣盡却用童便於瓷鍋中煮一伏時漉出於屋下握得一坑深一尺置骨於中一伏時其藥魂歸神妙陽人使隂隂人使陽男骨色不赤女骨色赤以此别之一用法同檀香湯洗過酥炙用或燒存性紫河車置酒內覆者男胎也首胎重十五兩以上先將酒洗數次血水方盡用銀簮腳剔去筋膜封固銀鍋內加酒重湯煮一晝夜或文武火焙乾一法米泔浸淨入猪肚中蒸爛搗膏入藥忌犯鐵獸部龍骨骨細文廣者是雌骨粗文狹者是雄骨五色者上白色者中黑色者次黃色者稍得經絡不淨之處并婦人採得者不用洗淨摶研如粉極細方入藥其效始神但是丈夫服空心益腎藥中安置圖龍骨氣入腎臟中也雷公所云生用法也一法用酒浸一宿焙乾研粉水飛三度用如急用以酒煮焙乾或云凡入藥須水飛晒乾每斤用黑豆一斗蒸一伏時晒乾用否則著人腸胃晚年作熱也得人參牛黃黑豆良畏石膏鐵忌魚龍齒搗碎入丸煅研得畏忌同龍骨麝香其香有三等一者名遺香是麝子臍閉滿其麝自於石上用蹄尖揮臍落處一里草木不生並焦黃人若收得此香價與明珠同也二名膝香採得甚堪用三名心結香被犬獸驚心破了因兹狂走雜諸羣中遂亂投水被人收得擘破見心流在脾結作一箇乾血塊可隔山澗早聞之香是香中之次也凡使麝香並用子日開之方用細研篩用之也當門子良凡用另研忌大蒜牛黃凡使有四件第一件是生神黃賺得者次有角黃是取之者又有心黃是病死後識者剝之劈破取心其黃在心中如濃黃醬汁採得便投於水中黃霑水復便如碎蒺藜子許如豆者硬如帝珠子次有肝黃其牛身上光眼如血色多玩弄好照水搗自有夜光恐懼人或有人别採之凡用須先單細研如塵却絹褁又用黃嫩牛皮裹安於井靣上去水三四尺已來一宿至明方取用之人參為之使地得牡丹菖蒲利耳目膝惡龍骨龍膽黃常山蜚蠊畏牛乾漆象牙刮取屑細研用鹿角膠自煎者良酒化服為上或用麥門冬橘紅砂仁煎湯化服入丸用酒或水頓化和蜜或炒成珠亦得畏得火良大黃阿膠油緑色光明可鑑者真凡使先於豬脂內浸一宿至明出於柳木火上炙待炮了可研用只以蛤粉炒成珠用為便之使得火良薯蕷為畏大黃白馬莖凡收當取銀色無病白馬春月遊牝時力勢正强者生取隂乾百日用一法以銅刀破作七片將生羊血拌蒸半日晒乾以粗布去毛及乾血挫碎用鹿茸須茄茸如琥珀紅潤者良凡使先以天靈蓋作末然後鋸解鹿茸作片子以好羊脂拌天靈蓋末塗之於鹿茸上慢火炙之令內外黃脆了如褐色用鹿皮一片裹之安室上一宿其藥魂歸也至明則以慢火焙之令脆方搗作末用之每五兩鹿茸用羊脂三兩炙盡為度茸中有小白蟲視之不見入人鼻必為顙蠱藥不及也切不可以鼻嗅麻勃為之使牛膽臘月黃牛青牛者良牡狗隂莖六月上伏日取隂乾百日切片酥拌炒羚羊角帶黃色者角彎中深鋭緊小有掛痕者真耳邊聽之集集鳴者良凡修事勿令單用不復有驗須要不折原對以繩縳之將鐵錯子錯之旋旋取用勿令犯風錯末盡處須二重紙裹恐力散也錯得了即單搗搗盡背風頭重篩過然後入藥中用免刮人腸也一說密裹藏懷中取出搗易碎犀角凡使以黑如漆黃如栗上下相透雲頭雨腳分明者為上次用烏黑肌粗皺折裂光潤者良近人多巧僞藥染湯煮無所不至須辨之凡修治錯其屑入臼中搗令細再入鉢中研萬匝方入藥中用之一說入人懷內一宿易碎或磨汁入藥用忌松脂升麻為之使惡雷丸雚菌烏頭烏喙鹽妊婦勿服能消胎氣虎骨脛骨良頭頸骨俱可用色黃者佳雄虎者勝藥箭射殺者不可入藥其毒浸漬骨血間能傷人也製法並捶碎去髓塗酥或酒或醋各隨方法炭火炙黃入藥猪懸蹄古方有用左蹄甲者有後蹄甲者酒浸半日炙焦用猪四足母猪者良猪膽隂乾汁亦可和藥猪肚豬水畜而胃屬土故方藥用之補虛以胃治胃也糜角煎膠與鹿角膠同法取霜用角水浸七日刮去皮錯屑以銀瓶盛牛乳浸一日乳耗再加至不耗乃止用油紙密封瓶口别用大麥鋪鍋中三寸上安置再以麥四周填滿入水浸一伏時水耗旋加待屑軟如麵取出焙研成霜用狐隂莖炙為末酒服獺肝炙脆研十諸畜肝葉皆有定數惟獺肝一月一葉十二月二葉其間又有退葉用之須見形乃可驗不爾多僞也猯肉膏油入膏藥中拔濕如神趙府膏藥中用之腽肭臍此物多僞海中有獸號曰水烏龍海人採得殺之取腎藥中修合恐有誤其物自殊有一對其有兩重薄皮裹丸氣肉核皮上自有肉黃毛三莖其一穴年年隂濕常如新兼將於睡著犬躡足置於犬頭其驀驚如狂即是真也用酒浸一宿後以布裹微微火上炙令青細銼單搗用也以漢椒樟腦同收則不壞禽部雄雀屎凡使勿用雀兒糞其雀兒口黃未經淫者糞名雀蘇不入藥雄屎兩頭尖圓者是凡採得先去兩畔有附子生者勿用鉢中研如粉煎甘草湯浸一宿頭上清甘草水盡焙乾任用日華子云凡鳥左翼掩右者是雄其屎頭尖挺直伏翼凡使要重一斤者先拭去肉上毛及去爪腸留肉翅并嘴腳以好酒浸一宿取出以黃精自然汁五兩塗炙至盡炙乾用一法止煅存性近世用者多煅存性耳莧雲實為之使天鼠屎即伏翼糞方言名天鼠爾一名夜明砂凡採得以水淘去灰土惡氣取細砂晒乾焙用其砂乃蚊蚋眼也微惡白斂白蟲魚部石蜜凡煉蜜只得十二兩半是數若火少火過並用不得凡煉蜜每斤入水四兩銀石器內以桑柴火慢煉掠去浮沫至滴水成珠不散乃用謂之水火煉法又法以器盛置重湯中煮一日候滴水不散取用更不傷火蜜蠟蠟乃蜜脾底也取蜜後煉過濾入水中候凝取之色黃者名黃蠟煎煉極淨色白者名白蠟一說新則白久則黃非也與今時所用蟲造白蠟不同惡芫花齊蛤牡蠣左顧者良東流水入鹽一兩煮一伏時後入火中燒令通赤然後入鉢中研如粉用也一法火煆醋淬七次研極細如飛麵惡貝母為之使茱得甘草牛膝逺志蛇床子良麻黃辛夷吳萸伏硇砂真珠於臼中搗令細以絹羅重重篩過却便研二萬下了用不細則傷臟腑凡使要不傷破及鑽透者可用也一法入豆腐內蒸易碎入目生用不用蒸依上法為是玳瑁入藥生用以其性味全也既經陽火即不堪用與生熟犀角義同桑螵蛸凡使勿用諸雜樹上生者不入藥中用須桑樹畔枝上者採得去核了用沸漿水浸淘七遍令水遍沸於瓷鍋中熬令乾用勿亂别修事却無效也得龍骨止精畏旋覆花戴椹石决明即真珠母也七九孔者良先去上粗皮用鹽并東流水於大瓷器中煮一伏時了漉出拭乾搗為末研如粉更用東流水於瓷器中如此淘之三度待乾再研一萬匝方入藥中用凡修事五兩以鹽半分則取服之十兩目也永不得食山桃令人喪海蛤此即鮮蛤子雁食後糞中出有文彩者為文蛤無文彩者為海蛤鄉人多將海岸邊爛蛤殼被風濤打磨瑩滑者僞作之凡修事一兩於漿水中煮一伏時後却以地骨皮柏葉各二兩又煮一伏時後於東流水中淘三遍拭乾細搗研如粉花用蜀漆為之使畏狗膽甘遂芫文蛤修事法同海蛤蠡魚俗名烏魚亦名黑魚諸魚中惟此膽甘可食鯽魚子不宜與猪肉同食同沙糖食生疳蟲同芥菜食成腫疾同猪肝雞肉雉肉鹿肉猴肉食生癰疽同麥門冬食害人蝟皮作猪蹄者妙鼠腳者次炙脆研用露蜂房治臃腫醋水調塗治瘡煎洗入藥炙用惡乾薑丹參黃芩芍藥牡蠣蟬蛻用沸湯洗淨泥土去頭足翅用攻毒全用烏賊魚骨凡使要上文順渾用血鹵作水浸并煮一伏時了漉出於屋下掘一地坑可盛得前件烏賊魚骨多少先燒坑子去炭灰了盛藥一宿至明取出用之其效倍多惡白及白斂附子原蠶蛾炒去翅足用蠶退近世醫家多用蠶退紙而東方諸醫用蠶欲老眠起所蛻皮雖二者之用各殊然東人所用者為正用之當微炒白殭蠶凡使除絲綿并子盡以糯米泔浸一宿待蠶桑涎出如蝸牛涎浮於水靣上然後漉出微火焙乾以布淨拭蠶上黃肉毛并黑口甲了單搗篩如粉用也白而直折開如瀝青色者佳惡桔梗茯苓茯神草薢桑螵蛸蛞蝓即蜒蚰也畏鹽蝸牛此即負殼蜒蚰也生研服入藥炒用畏鹽䗪蟲即俗名地龞也生人家墻壁下土中濕處治傷寒損續絶及消瘧母為必須之藥也能行瘀血畏皂莢菖蒲屋遊青魚膽鮮者可煮服乾者用醋及水磨用鱉甲七九肋者良醋炙透焦研細再拌醋瓦上焙乾再研如飛麵惡礬石理石蠍形緊小者良酒洗淨炙乾研蟾酥端午日取蝦蟇眉脂其法取大蝦蟇用蛤蜊殼未離帶者合蝦蟇眉上用力一捻則蘇出於殼內收在油明紙上乾收貯用蝦蟇放去而蘇復生仍活鼠糞牡鼠者良其糞兩頭尖蚺蛇膽人多以猪膽虎膽僞為之試法剔取粟許著淨水中浮游水上回旋行走者為真僞者亦走但遲耳其徑沉者諸膽血也勿多著亦沉散也蛇蛻凡使勿用青黃蒼色者要用白如銀色者凡欲使先於屋下以地掘一坑可深一尺二寸安蛇皮於中一宿至卯時出用醋浸一時於火上炙乾用之得火良畏慈石及酒白頸蚯蚓凡使收得後用糯米水浸一宿至明漉出以無灰酒浸一日至夜漉出晒令乾後細切取蜀椒并糯米及切了蚯蚓三件同熬之待糯米熟去米椒了揀淨用之凡修事二兩糯米一分椒一分為凖鹽畏葱蜈蚣凡使勿用千足蟲真似只是頭上有白肉靣并嘴尖若誤用并聞著腥臭氣入頂致死凡治蜈蚣先以蜈蚣木末不然用柳蚛末於土器中炒令木末不焦黑後去木末了用竹刀刮去足甲了用蜈蚣木知是何木也今人惟以火炙去頭足用或去尾足以薄荷葉火煨用之畏蛞蝓蜘蛛白鹽雞屎桑白皮蛤蚧凡使須認雄雌若雄為蛤皮粗口大身小尾粗雌為蚧口尖身大尾粗男服雌女服雄凡修事服之其毒在眼須去眼及去甲上尾上腹上肉毛以酒浸方乾用紙兩重於火上緩隔紙焙炙待兩重紙乾焦透後去紙取蛤蚧於瓷器中盛於東合角畔懸一宿取用力可十倍勿傷尾效在尾也一云只含少許急奔百步不喘者真水蛭極難修制須細銼後用微火炒令色黃乃熟不爾入腹生子為害一法采得以䈽竹筒盛待乾用米泔浸一夜曝乾展其身看腹中有子皆去之以冬豬脂煎令焦黃然後用畏石灰食鹽斑蝥入藥除翼足以糯米拌炒米黃黑色去米取用生用吐㵼人一法用麩炒過醋煮用馬刀為之使芫畏巴豆丹參空青靛惡膚青甘草豆花皆斑猫青亭長地膽之毒汁黃連黑豆葱茶能解之白花蛇一云去頭尾各一尺有大毒不可用只用中假一云黔蛇長大故頭尾可去一尺蘄蛇止可頭尾各去三寸亦有單用頭尾者大蛇一條只得淨肉四兩而已久留易蛀惟以湯浸去皮骨取肉炙過密封藏之十年亦不壞也其骨刺須逺棄之傷人毒與生者同也凡酒浸春秋三宿夏一宿冬五宿取出炭火焙乾如此三次以砂瓶盛埋地中一宿出得酒良烏蛇製同上法蜣螂五月五日取蒸藏之臨用當炙勿置水中令人吐五靈脂此是寒號蟲糞也此物多夾砂石絶難修治凡用研為細末以酒淘飛澄去砂腳日乾醋拌炒人惡參穿山甲正名鯪鯉或炮或燒或蘇炙酥炙童便炙或油煎土炒蛤粉炒當各隨本方未有生用者仍以尾甲乃力勝豫見今之時師童而習之俱藥性櫽括駢語守為家珍而於神農本草及先賢炮炙法一切高文大牘竟未嘗夢見臨證用藥方産之真贋莫别修事之軌則全乖欲以攻病譬如克敵致勝責效於不練之卒至病者甘以七尺之軀往往聽其嘗試良可憫也先生曰子言誠然因檢目前嘗用諸藥品悉按雷公炮炙去其迂濶難遵者而裁以已法其無雷公者則自為闡發以益前人所未逮凡諸使制解伏并反忌惡畏等附系其下庶病家考用一覽瞭然兼可質醫師之誤其所禆益功豈鮮哉舊筆記所刻止九十餘種今廣至四百三十九種一一皆先生口授而豫手録之其間刪繁舉要補闕拾遺句字之出入必嚴㸃畫之幾微必審稿凡四易始付殺青豫竊有微勞焉用藥凡例藥劑丸散湯膏各有所宜不得違製藥有宜丸宜散者宜水煎者宜酒漬者宜煎膏者亦有一物兼宜者亦有不可入湯酒者並隨藥性不可過越湯者蕩也煎成膏汁是也去大病用之散者散也研成細末是也去急病用之膏者熬成稠膏也液者搗鮮藥而絞自然真汁是也丸者緩也作成圓粒也不能速去病舒緩而治之也漬酒者以酒浸藥也有宜酒浸以助其力如當歸地黃黃柏知母隂寒之氣味假酒力而行氣血也有用藥細銼如法煮酒密封早晚頻飲以行經絡或補或攻漸以取效是也凡諸湯用酒臨熟加之細末者不循經絡止去胃中及臟腑之積及治肺疾咳嗽為宜氣味厚者白湯調氣味薄者煎之和查服丸藥去下部之病者極大而光且圓治中焦者次之治上焦者極小麵糊丸取其遲化直至下焦或酒或醋取其收斂如半夏南星欲去濕者以生薑汁稀糊丸取其易化也湯泡蒸餅又易化滴水尤易化煉蜜丸者取其遲化而氣循經絡也蠟丸者取其難化而遲取效也凡修丸藥用蜜秪用蜜用餳秪用錫勿交雜用且如丸藥用蠟取其能固護藥之氣味勢力全備以過關膈而作效也今若投蜜相和雖易為丸然下咽亦易散化如何得到臟中若其更有毒藥則便與人作病豈徒無益而又害之全非用蠟之本意凡煉蜜皆先掠去末令熬色微黃試水不散再熬二三沸每用蜜一斤加清水一酒杯又熬一二沸作丸則收潮氣而不粘成塊也冬月煉蜜成時要加二杯水為妙衍義云每蜜一斤祗煉得十二兩是其度數也和藥末要乘極滚蜜和之臼內用搗千百杵自然軟熟容易作條好丸也凡丸散藥亦先細切暴燥乃搗之有各搗者有合搗者其潤濕之藥如天門冬地黃輩皆先切曝之獨搗或以新瓦慢火炕燥退冷搗之則為細末若入衆藥隨以和之少停回潤則和之不均也又濕藥燥皆大蝕耗當先增分兩待燥稱之乃准其湯酒中不須如此凡合丸藥用蜜絹令細若篩散藥尤宜精細若搗丸必于臼中搗數百過色理和同為佳凡藥浸酒皆須切細生絹袋盛乃入酒密封隨寒暑目數視其濃烈便可漉出不須待酒盡也查則暴燥微搗更漬飲之亦可散服之凡合膏或以醋或酒或水或油須令淹浸密覆至煮膏時當三上三下以泄其熱勢令藥味得出上之使匝匝沸下之要沸靜良久乃上之如有韭白在中者以兩段漸焦黃為度如有白芷附子者亦令小黃為度絞膏要以新布若是可服之膏滓亦可以酒煮飲之可磨之膏查亦宜以傳患處此蓋欲兼盡其藥力也凡湯酒膏中用諸石藥皆細搗之以新絹裹之內中衍義云石藥入散如鍾乳粉之屬用水研乳極細必要二三日乃已以水漂澄極細方可服耳豈但搗細以絹裹之為例耶凡煎膏中有脂先須揭去革膜子方可用之如猪脂勿令經水臘月者尤佳凡膏中有雄黃硃砂輩皆當令研如麵俟膏畢乃投入以物杖攪之不爾沉聚在下不勻也凡草藥燒灰為末如荷葉柏茅根薊根十灰散之類必燒焦枯用器蓋覆以存性若如燒燃柴薪煅成死灰性亦不存而罔效矣凡諸膏膩藥如桃仁麻仁輩皆另搗如膏乃以內成散中旋次下臼合研令消散煎藥則例凡煎湯劑必先以主治之為君藥先煮數沸然後下餘藥文火緩緩熬之得所勿揭蓋連罐取起坐凉水中候溫熱服之庶氣味不泄若據乘熱揭封傾出則氣出而性不全矣煎時不宜烈火其湯漛沸耗蝕而速涸藥性未盡出而氣味不純人家多有此病而反責藥不效咎將誰歸發汗藥先煎麻黃二三沸後入餘藥同煎止汗藥先煎桂枝二三沸後下衆藥同煎和解藥先煎柴胡後下衆藥至于溫藥先煎乾薑行血藥先煎桃仁利水藥先煎猪苓止㵼藥先煎白术茯苓止渴藥先煎天化粉乾葛去濕藥先煎蒼术防已去黃藥先煎茵陳嘔吐藥先煎半夏生薑風藥先煎防風羌活暑藥先煎香薷熱藥先煎黃連凡諸治劑必有主治為君之藥俱宜先煎則效自奏也凡湯中用麻黃先另煮二三沸掠去上沫更益水如本數乃內餘劑不爾令人煩凡用大黃不須細銼先以酒浸令淹浹密覆一宿明旦煮湯臨熟乃內湯中煮二三沸便起則勢力猛易得快利丸藥中微蒸之恐寒傷胃也凡湯中用阿膠飴糖芒硝皆須待湯熟起去渣只內淨汁中煮二三沸鎔化盡仍傾盞內服凡湯中用完物如乾棗蓮子烏梅仁决明子青葙蔓荆蘿蔔芥蘇韭等子皆劈破研碎入煎方得味出若不碎如米之在榖雖煮之終日米豈能出哉至若桃杏等仁皆用湯泡去皮尖及雙仁者或搗如泥或炒黃色用或生用俱可凡用砂仁豆䓻丁香之類皆須打碎遲後入藥煎數沸即起不爾久久煎之其香氣消散也是以效少凡湯中用犀角羚羊角一概末如粉臨服內湯中後入藥一法生磨汁入藥亦通凡用沉香木香乳沒一切香末藥味須研極細待湯熱先傾汁小盞調香末服訖然後盡飲湯藥凡煎湯藥初欲微火令小沸其水數依方多少大略藥二十兩用水一斗煮四升以此為准然利湯欲生少水而多取汁補湯欲熟多水而少取汁服湯宜小沸熱則易下冷則嘔涌凡湯液一切宜用山泉之甘冽者次則長流河水井水不用服藥序次病在胸膈已上者先食後服藥病在心腹已下者先服藥而後食病在四肢血脉及下部者宜空腹而在旦病在頭目骨髓者宜飽滿而在夜雖食前食後亦停少頃然後服藥食不宜與藥並行則藥力稍為混滯故也湯液云藥氣與食氣不欲相逢食氣稍消則服藥藥氣稍消則進食所謂食先食後蓋有義在其中也又有酒服者飲服者冷服者暖服者服湯有疏有數者煮湯有生有熟者各有次第並宜詳審而勿略焉清熟湯宜凉服如三黃湯之類消暑藥宜冷服如香薷飲之類散寒藥宜熱服如麻黃湯之類溫中藥宜熟而熱補中藥皆然利下藥宜生而溫如承氣湯之類病在上者不厭頻而少病在下者不厭頓而多少服則滋榮於上多服則峻補於下凡云分再服三服者要令勢力相及并視人之强弱羸瘦病之輕重為之進退增减不必局于方說則活潑潑地也又云晬時周時也從今旦至明旦亦有止一宿者服藥禁忌服柴胡忌牛肉服茯苓忌醋服黃連桔梗忌猪肉服乳石忌參术犯者死服丹石不食蛤蜊腹中結痛服大黃巴豆同劑反不㵼人服皂礬忌蕎麥麵服天門冬忌鯉魚服牡丹皮忌胡荽服常山忌葱服半夏菖蒲忌飴糖羊肉服白术蒼术忌雀蛤肉青魚鮓胡荽大蒜桃李服鱉甲忌莧萊馬齒莧尤甚服商陸忌犬肉服地黃忌蘿蔔服細辛忌生萊服甘草忌菘萊服粟殼忌醋服芫花甘遂忌鹽忌甘草服荆芥忌驢馬肉黃顙魚服柿蒂忌蟹犯者木香湯能解服巴豆忌蘆笋服牛膝忌牛肉牛乳服蜜及蜜煎果食忌魚鮓服藜蘆忌狐狸肉若瘡毒未愈不可食生薑雞子犯之則肉長突出作塊而白凡服藥不可雜食肥猪犬肉油膩羮膾腥臊陳臭諸物凡服藥不可多食生蒜胡荽生葱諸果諸滑滯之物凡服藥不可見死尸産婦淹穢等事妊娠服禁蜆班水蛭及虻蟲烏頭附子配天雄葛根水銀并巴豆牛膝薏苡與蜈蚣三稜代赭芫花射大㦸蛇蛻黃雌雄牙硝芒硝牡丹桂槐花牽牛皂角同半夏南星與通草瞿麥乾薑桃仁通碙砂乾漆蟹甲瓜地膽茅根都不中妊娠禁忌前歌所列藥品未盡特為拈附烏喙側子藜蘆薇蓹厚朴槐實檔根䕡茹茜根赤箭草鬼箭紅花蘇木麥孽葵子常山錫粉硇砂砒石硫黃石蠶芫青班蝥蜘蛛螻蛄衣魚蜥蜴飛生䗪蟲樗雞蚱蟬蠐螬蝟皮牛黃兔肉犬肉馬肉驢肉羊肝鯉魚蝦蟇羊躑躅葛上亭長鰍鱓龜鱉生薑小蒜雀肉馬刀六陳枳殼陳皮并半夏茱萸狼毒及麻黃六般之藥宜陳久入用方知功效良十八反本草明言十八反逐一從頭說與君人參芍藥與沙參細辛𤣥參與紫參苦參丹參并前藥一見藜蘆便殺人白芨白斂并半夏瓜蔞貝母五般真莫見烏頭與烏喙逢之一反疾如神大㦸芫花并海藻甘遂已上反甘草若還吐蠱用翻腸尋常犯之都不好蜜蠟莫與葱相覩石决明休見雲母藜蘆莫使酒來浸人若犯之都是苦當禁不禁犯禁必死張子和云病腫脹既平當節飲食忌鹽血房室犯禁者病再作乃死不救病癆嗽忌房室膏粱犯者死傷寒之後忌葷肉房事犯之者不救水腫之後忌油鹽病脾胃傷者節飲食滑㵼之後忌油膩此數者决不可輕犯也時病新差食蒜鱠者病發必致大困時病新愈食犬羊肉者必作骨蒸熱時病新愈食新棗及羊肉必作鬲上熱蒸時病新愈食生萊令人顔色終身不平復病人新愈飲酒食韭病必復作不必忌而忌之過張子和曰臟毒酒毒下血嘔血等症如婦人三十已下血閉及六七月間血痢婦初得孕擇食者已上皆不禁口凡久病之人胃氣虛弱者忽思葷茹亦當少少與之圖引漿水榖氣入胃此權變之道也若專以淡粥責之則病不悅而食減不進胃氣所以難復病所以難痊此忌之之過也智者通之先醒齊廣筆記卷四
