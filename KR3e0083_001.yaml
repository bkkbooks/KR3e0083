body:
  text: 先醒齋廣筆記卷一明繆希雍撰中風治法大略凡言中風有真假內外之别差之毫釐謬以千里何者西北土地高寒風氣剛猛真氣空虛之人猝為所中中臟者死中腑者成廢人中經絡者可調理而瘳治之之道先以解散風邪為急次則補養氣血此真中外來風邪之候也其藥以小續命湯桂枝麻黃生熟附子羌獨活防風白芷南星甘草之屬為本若大江已南之東西兩浙七閩百粵兩川滇南鬼方荆揚梁三州之域天地之風氣既殊人之所稟亦異其地絶無剛猛之風而多濕熱之氣質多柔脆往往多熱多痰真隂既虧內熱彌甚煎熬津液凝結為痰壅塞氣道不得通利熱極生風亦致猝然僵仆類中風證或不省人事或言語謇澀或口眼歪斜或半身不遂其將發也外必先顯內熱之候或口乾舌苦或大便閉澀小便短赤此其驗也劉河間所謂此證全是將息失宜水不制火丹溪所謂濕熱相火中痰中氣是也此即內虛暗風確係隂陽兩虛而隂虛者為多與外來風邪迥别法當清熱順氣開痰以救其標次當治本隂虛則益血陽虛則補氣氣血兩虛則氣血兼補久以持之設若誤用治真中風藥如前種種風燥之劑則輕變為重重則必死禍福反掌不可不察也初清熱則天門冬麥門冬甘菊花白芍藥白茯苓括婁根童便順氣則紫蘇子枇杷葉橘紅鬱金開痰則貝母白芥子竹瀝荆瀝括婁仁次治本益隂則天門冬甘菊花懷生地當歸身白芍藥枸杞子麥門冬五味子牛膝人乳白膠黃柏白蒺藜之屬補陽則人參黃蓍鹿茸大棗乙卯春正月三日豫忽患口角歪斜右目及右耳根俱痛右頰浮腫仲淳曰此內熱生風及痰也治痰先清火清火先養隂最忌燥劑真蘇子三錢廣橘紅三錢括婁根三錢貝母四錢天門冬三錢麥門冬五錢白芍藥四錢甘草七分鮮沙參三錢明天麻一錢甘菊花三錢連翹二錢河水二鍾半煎一鍾加竹瀝童便各一杯霞天膠四五錢飢時服日二劑初四至初九日加懷生地黃三錢初十加牛膝四錢黃柏二錢十三日去連翹加石斛三錢五分五味子七分白藊豆二錢乾葛八分十八日去連翹天麻乾葛白藊豆加蓮肉四十粒正月草二日定方初日進二劑後每日一劑天門冬三錢麥門冬五錢生地黃五錢白芍藥四錢牛膝酒蒸五錢炙甘草一錢貝母二錢括婁根二錢蓮肉四十粒酸棗仁六錢真蘇子二錢黃柏一錢五分甘菊花二錢五分鮮沙參三錢廣橘紅二錢五味子八分河水三鍾煎一鍾飢時服二月十二日定方天門冬三錢麥門冬五錢真蘇子二錢五分廣橘紅二錢五分白茯苓三錢貝母三錢黃柏一錢五分括婁根二錢五味子七分鮮沙參三錢玄參二錢甘菊花二錢五分甘草一錢五分酸棗仁五錢生地黃四錢白芍藥四錢牛膝五錢蓮肉六十粒十日後去括婁根三月草八日去玄參加石斛三錢至五月盡病始全愈前方中曽加參二錢服二劑反覺浮火上升即去之丸方胡麻仁三斤即黑芝麻桑葉酒拌蒸晒三斤何首烏三斤九蒸九晒人乳拌至一倍兩倍蒼术二斤米泔浸洗淨刮去皮拌黑豆蒸又拌蜜酒蒸又拌人乳蒸凡三次蒸時須烘晒極乾氣方透牛膝如法二斤甘菊花二斤懷生地三斤天門冬去心酒蒸二斤柏子仁二斤黃檗一斤枸杞子二斤又丸方先時合成病中仲淳以為可服日進兩許百日後方易前丸人參去蘆人乳浸飯上蒸切片烘乾十兩五味子去枯者打碎蜜蒸烘乾十兩山茱萸肉八兩沙苑蒺藜一半炒為末一半打糊和藥十二兩川巴戟天如法去骨以甘菊花枸杞子同酒浸蒸晒乾八兩蓮鬚金黃色者良六兩枸杞子去枯者及蒂人乳潤過烘乾十二兩川牛膝去蘆酒蒸十兩天門冬六兩蓮肉去心每粒分作五六塊瓦器內炒焦黃忌鐵十二兩白茯苓如法人乳拌晒八兩黃柏蜜炙四兩砂仁炒二兩懷生地十二兩鹿角霜酥拌炒研如飛麵十二兩鹿茸六兩火燎去毛切片酥炙菟絲子末八兩加甘菊花六兩煉蜜同蒺藜糊和丸如梧子大每六錢空心飢時各一服淡鹽湯吞治右半身不遂右屬氣虛白蒺藜炒去刺甘菊花何首烏如法黃蓍蜜炙天門冬去心麥門冬去心人參去蘆漆葉酒拌九蒸九晒各一斤白茯苓水澄白芍藥酒炒牛膝去蘆酒蒸各十二兩川續斷十兩橘紅八兩煉蜜丸梧子大空心白湯下忌食白萊蔔牛肉牛乳若在左者屬血虛宜加當歸身熟地黃鹿角膠柏子仁各斤許杜仲八兩酥炙如火盛多痰肺經有熱者去人參加青蒿子鱉甲各十二兩如左右臂俱轉掉不便者亦用此方王宇泰治臧位宇氣虛痰多脾胃有濕晚年半身不遂神效人參一斤半夏麯二斤薑汁竹瀝製白术半斤牛膝一斤天門冬一斤懷生地一斤用長流水煎成膏再入鹿角膠一斤虎骨膠一斤霞天膠一斤河間府梨膏一斤煉蜜二斤各製膏和勻重湯煮一日夜出火氣每空心臨卧取半酒杯以竹瀝梨汁各二杯人乳桑瀝各一杯和勻重湯頓熱調服寒傷寒時地議并六經治法夫傷寒者大病也時者聖人所不能違者也以關乎死生之大病而藥不從時顧不殆哉仲景醫門之聖也其立法造論後之明師如華他孫思邈輩莫不宗之漢末去古未遠風氣猶厚形多壯偉氣尚敦厖其藥大都為感邪即病而設况南北地殊厚薄不侔故其意可師也其法不可改也循至今時千有餘年風氣澆矣人物脆矣况在荆揚交廣梁益之地與北土全别故其藥則有時而可改非違仲景也實師其意變而通之以從時也如是則法不終窮矣故作斯議備列其方稍為損益以從時地俾後之醫師知所適從庶幾患斯疾者可免於夭枉爾辨驗外感真偽法凡外感必頭疼其疼也不間晝夜探其舌本必從喉嚨內乾出於外多兼煩躁不煩躁者即輕證也不頭疼而發熱不發熱而頭疼頭雖疼而有時暫止口雖乾而舌本不燥骨雖疼而頭不疼雖渴而不欲引飲至夜或偶得寐遇食不好亦不惡居處雖若尫怯而神氣安靜凡若此者皆非傷寒也三陽治法總要太陽病其證發熱惡寒惡風頭痛項強腰脊強遍身骨痛脈雖浮洪而不數多不傳經煩躁脈數急者是欲傳經宜先發汗以解表邪其藥以羌活湯為主羌活三錢前胡二錢甘草八分葛根二錢生薑三片棗二枚杏仁九粒去皮尖研爛水煎服秋深冬月應用此方亦可量加紫蘇蔥白如冬月天氣嚴寒感邪即病服此藥不得汗本方加麻黃一錢生薑四片共前七片得汗勿再服如病人自覺煩躁喜就清涼不喜就熱兼口渴是即欲傳入陽明也若外證頭疼遍身骨疼不解或帶口渴鼻乾目疼不得卧即係太陽陽明證羌活湯中加石膏知母麥冬大劑與之得汗即解如自汗煩躁頭疼遍身骨疼不解者羌活一錢桂枝七分石膏一兩二錢麥冬六錢知母三錢竹葉一百二十片白芍藥二錢甘草八分如冬月即病太陽證惡寒畏風頭疼遍身骨疼自汗不渴宜用桂枝八分芍藥二錢甘草一錢大棗二枚生薑一片太陽病不解熱結膀胱其人如狂血自下者愈其外證不解者不可下當先解表表證罷少腹急結者乃可下之桃仁承氣湯無蓄血證大承氣湯正陽陽明病正陽陽明者胃家實是也其證不大便自汗潮熱口渴咽乾鼻乾嘔或乾嘔目眴眴不得眠畏人聲畏木聲畏火不惡寒反惡熱或先惡寒不久旋發熱甚則譫語狂亂循衣摸床脈洪大而長宜急解其表用竹葉石膏湯大劑與之不嘔無汗與葛根湯亦須大劑若表證已罷脈緩小便利是病解矣若表證罷後邪結於裏大便閉小便短赤宜用調胃承氣湯或小承氣湯下之下後按其腹中不作痛而和病即已解如作痛是燥糞未盡也再用前藥下之以腹中和二便通利為度陽明病不能食若其人本虛勿輕議下陽明病頭眩咳而咽痛者用葛根甘草桔梗麥冬四味濃煎數數與之陽明病無汗小便不利心中懊憹者當發黃急用梔子麥冬淡豆豉大劑濃煎與之如已見身黃急加茵陳為君主之陽明病衄血此緣失於發汗宜用荆芥二錢葛根三錢麥冬五錢牡丹皮一錢五分蒲黃二錢茅根二兩側柏葉二錢生地黃三錢濃煎與之兼飲童便陽明病心下硬滿者此邪未入於腹中慎勿下之用竹葉石膏湯加括婁一個搗碎桔梗二錢黃連一錢陽明病邪結於裏汗出身重短氣腹滿而喘潮熱手足濈然汗出者此大便已鞕也六七日已來宜下之用小承氣湯不行換大承氣湯勿大其劑若大便不鞕者慎勿輕下陽明病發汗不解腹滿急者亟下之傷寒六七日目中不了了睛不和無表證大便難宜承氣湯下之陽明病下之早外有熱手足溫不結胸心中懊憹不能食但頭汗出梔子豉湯主之陽明病發潮熱大便溏胸滿不去者與小柴胡湯去人參加括婁黃連陽明病自汗出或發汗後小便利津液內竭大便雖硬不可攻之須俟其自大便用蜜導或膽導法通之大下後六七日不大便煩不解腹滿痛本有宿食宜再用承氣湯下之食榖欲嘔屬陽明非少陽也胸中煩熱者竹茹湯主之竹茹三錢麥冬五錢枇杷葉三大片蘆根三兩內無熱證者小便利口不渴此為陽明虛也吳茱萸湯主之吳茱萸二錢人參三錢生薑一錢五分大棗三枚水煎日三服凡陽明病多汗津液外出胃中燥大便必鞕鞕則譫語以小承氣湯下之若一服譫語止者勿再服陽明譫語發潮熱脈滑而數者小承氣湯主之服藥後腹中轉氣者更與一服若不轉氣者勿更與之若服藥後次日不大便脈反微澀者裏虛也為難治勿復議下陽明病下血譫語者此為熱入血室汗止在頭用荆芥三錢葛根三錢黃芩一錢五分麥冬五錢牡丹一錢五分生蒲黃二錢濃煎以童便對飲之陽明病脈浮緊咽燥口苦腹滿而喘發熱汗出惡熱身重若下之則胃中空虛客氣動膈心中懊憹舌上有胎者梔子豉湯主之若渴欲飲水舌燥者白虎湯加人參主之若脈浮發熱口渴小便不利者豬苓湯主之陽明病協熱下利者宜六一散心下痞者以黃連括婁湯調服之脈浮遲表熱裏寒下利清榖者四逆湯主之附子乾薑甘草趺陽脈浮而澀小便數大便鞭其脾為約麻子仁丸主之麻仁十二兩芍藥四兩枳實四兩大黃八兩厚朴三兩杏仁六兩蜜丸如梧子大每用十丸日三服陽明實則讝語虛則鄭聲鄭聲者重語也直視讝語喘滿者死下利者亦死發汗多若重發其汗讝語脈短者死脈和者不死若吐若下後不解不大便五六日或至十餘日日晡時發潮熱不惡寒獨語如見鬼狀若劇者發則不識人循衣妄撮惕而不安微喘直視脈弦者生澀者死澀者陽證見隂脈也微者但發熱讝語者大承氣湯下之利勿再服陽明病發狂棄衣而走登高而歌此陽明實也以承氣湯亟下之如便不結者大劑白虎湯灌之石膏四兩麥冬二兩知母一兩五錢加大青一兩甘草七錢太陽陽明病協熱下利者宜六一散以黃連煎湯調服之太陽陽明并病六七日表證仍在其人發狂者以熱在下焦少腹當硬滿小便自利下其血乃愈當用桃仁承氣湯又二陽并病太陽證罷潮熱汗出大便難讝語者宜大承氣湯少陽病其證口苦咽乾眩往來寒熱脅滿痛胸滿或痛耳聾脈法弦細頭痛發熱者屬少陽少陽不可發汗發汗則讝語胃和者當自愈不和者則煩而悸傷寒三日少陽脈小者欲已也凡太陽病不解傳入少陽者脅下鞭滿乾嘔不能食往來寒熱未經吐下脈沉緊者與小柴胡湯柴胡二錢四分人參九分黃芩九分甘草九分半夏一錢五分生薑九分大棗二枚水煎溫服日三加減法若胸中煩而不嘔去半夏人參加括婁實一枚若脅下痞鞭去大棗加牡蠣二錢半若渴者去半夏加人參括婁根若腹中痛者去黃芩加芍藥三錢若心下悸小便不利者去黃芩加茯苓二錢若不渴外有微熱者去人參加桂一錢夏勿用溫覆取微汗愈若咳者去人參大棗加五味子一錢少佐以乾薑陽明少陽并病必下利脈滑而數有宿食也當承氣湯下之若已吐下發汗溫針讝語柴胡湯證罷此為壞病知犯何逆以法治之三陽合病脈浮大見關上但欲睡眠目合則汗藥用百合一兩麥門冬五錢炙甘草一錢知母二錢竹葉五十片括婁根二錢鱉甲如法三錢白芍藥二錢三陽合病腹滿身重讝語遺尿白虎湯加百合主之傷寒六七日無大熱其人煩躁者此為陽去入隂故也傷寒三日三陽為盡三隂當受邪其人反能食而不嘔此為三隂不受邪也三隂治法總要三隂病其證有二一者病發於三陽不時解表以致邪熱傳入於裏雖云隂分病屬於熱糞結宜下腹滿不可按宜下有燥糞協熱下利宜下腹痛下利宜芍藥黃芩炙甘草以和之如便膿血即加滑石黃連佐以升麻乾葛如邪雖入裏糞猶未結宜清其熱渴者用白虎湯竹葉石膏湯不渴或心下痞者宜黃連黃芩芍藥枳殼麥冬括婁輩以清之或邪未結於下焦少腹不堅痛而誤用芒硝以伐真隂洞泄不已元氣將脫宜用人參白术炙甘草大棗乾薑芍藥大劑與之不止佐以升提升麻葛根柴胡之類若從無陽邪表證從不頭疼發熱寒邪直中隂經此必元氣素虛之人或在極北高寒之地始有是證法宜溫補以接其陽附子人參乾薑官桂大劑與之陽回寒退即以平補之劑調之勿過用桂附以防其毒三隂各經見證悉從仲景傷寒論法治之如少隂咽痛咽中生瘡聲不出用苦酒湯到咽即效故知古人立法非今人可及也春溫夏熱病大法冬傷於寒至春變為溫病大都頭疼發熱或渴或不渴三陽證俱然亦間有先微寒後即發熱者大抵發熱其常也藥用辛溫佐以辛寒以解表邪太陽宜羌活湯陽明宜白虎湯無汗不嘔者間用葛根湯少陽往來寒熱等證不可汗吐下宜和解小柴胡湯渴者去半夏加括婁根耳聾熱盛去人參加麥冬知母括婁根渴亦加之至夏變為熱病其表證大約與春溫同但熱比於溫則邪氣更烈耳解表用白虎湯竹葉石膏湯有太陽證則加羌活有少陽證則加柴胡黃芩如發斑白虎湯竹葉石膏湯加玄參梔子桔梗鼠粘連翹大青小青青黛大劑與之二證若大便祕宜按之其邪已結於內便鞕宜察邪結中焦小承氣湯調胃承氣下之邪結下焦少腹堅痛始用大承氣湯下之傷寒溫疫其不可治及難治者皆屬下元虛傷寒溫疫三陽證中往往多帶陽明者以手陽明經屬大腸與肺為表裏同開竅於鼻足陽明經屬胃與脾為表裏同開竅於口凡邪氣之入必從口鼻故兼陽明證者獨多邪在三陽法宜速逐遲則胃爛發斑或傳入於裏則屬三隂邪熱熾者令隂水枯竭於法不治矣此治之後時之過也近代醫師鹵莽既不明傷寒治法又不識雜證類傷寒往往妄投汗下之藥以致虛人元氣變證叢生元氣本虛之人未有不因之而斃者矣戒之哉汗下之藥焉可嘗試也時氣傷寒除隂症不可服苦參一兩水酒各一碗煎八分重者水醋各半服之一汗而愈不論傷寒久近立效本草云天行尤良史鶴亭太史丁亥春患瘟疫頭痛身熱口渴吐白沫晝夜不休醫師誤謂太史初罷官歸妄投解鬱行氣藥不效又投以四物湯益甚諸醫謝去謂公必死遣使迎仲淳至病二十餘日矣家人具以前方告仲淳曰誤也瘟疫者非時不正傷寒之謂發于春故謂瘟疫不解表又不下使熱邪彌留腸胃間幸元氣未盡故不死亟索淡豆豉約二合許炒香麥門冬兩許知母數錢石膏兩許一劑大汗而解時大便尚未通太史問故仲淳曰昨汗如雨邪盡矣第久病津液未回故大便不通此腸胃燥非有邪也令日食甘蔗二三株兼多飲麥門冬湯不三日去燥糞六十餘塊而愈章衡陽銓部患熱病病在陽明頭痛壯熱渴甚且嘔鼻乾燥不得眠診其脈洪大而實仲淳故問醫師醫師曰陽明證也曰然問所投藥曰葛根湯仲淳曰非也曰葛根湯非陽明經藥乎曰陽明之藥表劑有二一為葛根湯一為白虎湯不嘔吐而解表用葛根湯今吐甚是陽明之氣逆升也葛根升散故用之不宜白虎湯硬石膏知母甘草加麥門冬竹葉名竹葉石膏湯石膏辛能解肌鎮墜能下胃家痰熱肌解熱散則不嘔而煩躁壯熱皆解矣遂用大劑竹葉石膏湯疏方與之且戒其仲君曰王翦取荆非六十萬人不可李信二十萬足矣臨别去囑曰斯時投藥五鼓瘥天明投藥朝餐瘥已而果然或謂嘔甚不用半夏何也仲淳曰半夏有三禁渴家汗家血家是也病人渴甚而嘔是陽明熱邪熾盛劫其津液故渴邪火上升故嘔半夏辛苦溫而燥有毒定非所宜又疑其不用甘草何也曰嘔家忌甘仲景法也高存之鄰人賣腐者傷寒發噦兩日夜不省人事其子乞方仲淳問曰汝父當時曾頭疼身熱乎曰然曰曾服汗藥乎曰未也曾吐下乎曰未也仲淳因索傷寒書檢之其方類用乾薑柿蒂丁香及附子等溫熱之藥末條僅載白虎湯一方仲淳思之曰傷寒頭痛身熱口渴本屬陽明熱邪傳裏故身涼發噦未經汗吐下邪何從而出第其人年老多作勞故于白虎湯加人參三錢二劑立起于潤父夫人娠九月患傷寒陽明證頭疼壯熱渴甚舌上黑胎有刺勢甚危仲淳投竹葉石膏湯索白藥子醫馬病者不得即以井底泥塗臍上乾則易之一日夜盡石膏十五兩五錢病瘳越六日産一女母子並無恙存之一家人婦傷寒來乞方仲淳已疏方與之矣見其人少年問曰若曾病此乎曰然曰愈幾日而妻病曰八九日曰曾有房欲否曰無之仲淳故曰若有房欲此方能殺人也其人即置方不取遂以褌襠雄鼠糞麥冬韭白柴胡二劑勢定更用竹皮湯二三劑全愈姚平子傷寒頭疼身熱舌上胎胸膈飽悶三四日熱不解奄奄氣似不屬者一醫以其體素弱病久虛甚意欲投參少許仲淳叱曰參一片入口死矣亟以大黃一兩瓜蔞二枚連子切片黃連枳實下之主人驚疑不得已減大黃之半二劑便通熱立解遂愈張太學璇浦內人患熱入血室發狂欲殺人白下醫以傷寒治之煎藥未服陳錫玄邀仲淳往診仲淳云不可服其藥投一劑而安先與童便繼與涼血行血安心神藥遂定翁文學具茨感冒壯熱舌生黑胎煩渴勢甚劇時稽勳諸昆仲環視揮涕羣醫束手仲淳以大劑白虎湯一劑立蘇或問仲淳治傷寒有祕法乎仲淳云熟讀仲景書即祕法也白虎湯中曾加人參三錢四明虞吉卿因三十外出疹不忌豬肉兼之好飲作泄八載矣忽患傷寒頭痛如裂滿面發赤舌生黑胎煩躁口渴時發譫語兩眼不合者七日洞泄如注較前益無度其尊人虞仰韶年八十二矣客寓莊斂之處方得長郎凶問懷抱甚惡膝下止此一子坐待其斃腸為寸裂斂之向余曰此兄不祿仰韶必繼之即不死八十二老人挾重資而聽其扶櫬東歸余心安乎萬一有此惟有親送至鄞耳余聞其語為之惻然急往診其脈洪大而數為疏竹葉石膏湯方因其有腹瀉之病石膏止用一兩病初不減此兄素不謹良一友疑其虛也云宜用肉桂附子斂之以其言來告余曰誠有是理但余前者按脈似非此證豈不數日脈頓變耶復往視其脈仍洪大而數余曰此時一投桂附即發狂登屋必不救矣一照前方但加石膏至二兩斂之曰得毋與泄瀉有妨乎余曰熱邪作祟此客病也不治立殆渠泄瀉已八年非暴病也治病須先太甚急治其邪徐并其夙恙除之急進一劑夜卧遂安即省人事再劑而前惡證頓去不數劑霍然但瀉未止耳余為疏脾腎雙補丸方更加黃連乾葛升麻以痧痢法治之不一月瀉竟止八載沉疴霍然闕失仰韶耄矣别余歸老拜謝垂涕謂父子得以闕皆余賜也莊斂之一莊僕因受寒發熱頭痛如裂兩目俱痛渾身骨內疼痛下元尤甚狀如刀割不可堪忍口渴甚大便日解一次胸膈飽脹不得眠已待斃矣斂之以其證來告為疏一方乾葛三錢石膏一兩半麥門冬八錢知母三錢半羌活二錢半大括婁半個連子打碎枳殼一錢桔梗一錢竹葉一百片河水煎服四劑而平此太陽陽明病也貧人素多作勞故下體疼痛尤甚以羌活去太陽之邪石膏竹葉乾葛知母麥門冬解陽明之熱括婁枳殼桔梗疏利胸膈之留邪故遂愈一奴傷寒熱解後復下血不止主人以痢藥投之更甚仲淳云此傷寒失汗之餘症也用地榆麥門冬知母竹葉以代仲景諸血證藥遂愈常熟吳見吳在京邸時有小青衣患傷寒愈而復復而愈愈而再復不知其幾趙文肅公謂仲淳曰此非兄不能救他人亦不肯往仲淳亟馳診之病人面色黃白六脈微弱大便不通胸中不快亦不思食曰此為傷寒百合壞證之餘邪且退矣胸中不快虛而氣壅非實邪也不大便者久病津液枯氣弱不能送也投以人參五錢麥門冬兩許枳殼炒八錢盡劑立解而瘥莊斂之一僕因傷寒後勞復發熱頭痛腹內作瀉勢甚危急余為疏方山梔仁四錢枳實二錢豆䜴一兩川黃連二錢乾葛三錢調六一散五錢服二劑熱退瀉止頭痛亦愈但不思飲食為去山梔枳實黃連加鱉甲四錢炙甘草二錢半麥門冬五錢不數劑而愈梁溪一男子素虛春中感冒頭痛肌痛發熱羌活二錢麥門冬三錢炙甘草一錢紫蘇一錢五分北細辛七分前胡一錢五分次日頭痛止熱未退口渴仲淳用芍藥五味子人曰風邪未退遽用酸斂何也曰因人而施爾一杯即愈麥門冬三錢甘草一錢括婁根二錢五分乾葛一錢五分桑白皮三錢桔梗一錢白芍藥一錢五味子五分從祖近湖公少年因房勞食犬肉傷寒諸醫以其虛也攻補兼施至發狂登屋奔走呼號日夜令壯夫看守者幾月餘急走使延朱遠齋遠齋先命煎人參膏二斤以待用潤字號丸藥數錢下之去黑糞無算勢遂定奄奄一息鄰於死矣徐以參膏灌之至百二十日全瘳治傷風後耳聾仲淳定甘菊花二錢石菖蒲忌鐵一錢柴胡六分括婁根二錢貝母去心二錢前胡一錢甘草六分北細辛四分蘇梗一錢桑白皮忌鐵二錢加竹瀝一杯不拘時服趙和齋年六十患外感豫以他事請見延至中堂云偶因勞倦體疲正欲求教豫為之診視細按其六部并察其形神謂云翁病屬外邪非勞發也須著意珍重時葛存誠在坐豫私謂云此病是極重外感邪氣有內陷之兆恐難挽回别去三日大雨中復來邀看則神氣已脫脈無倫次問其所服何藥云石膏湯豫云病證固重服藥又差無汗發熱非陽明症何得用石膏此太陽症未經發汗邪氣傳裏裏虛水涸不勝邪熱真氣已脫必不可救時猶以豫言為妄不兩日而斃矣魏季嘗室産後飲食不節復感風寒遂致發熱譫語喘咳氣逆惡露絶不至勢甚急迫豫謂此症俱係外來客邪尚屬可救設正氣虛脫現諸症者必無幸矣何以見之以脈氣浮大有力故也用大劑疏風消食之藥二劑便霍然先是有用白术歸芎等補藥幾為所誤二條附暑治傷暑高存之次郎童時夏月身熱十晝夜止飲白湯諸醫汗之不解以麻仁丸下之熱如故惶急中仲淳忽至診曰此傷暑也白虎湯是其本方因誤汗下虛甚加人參三錢一劑微汗瞑眩少頃熱解又疏一方防其瘧痢仍用人參二錢兼健脾清暑導滯之劑未幾瘧作如方飲之瘧止痢又作存之不得已于生脈散中加益元散飲之兒尫羸甚諸醫曰數日後死矣舉家惶急禳禱紛紜仲淳復自松陵來存之語之故仲淳曰生脈益元散得之矣不診而諦視兒問糜甘否曰甘大呼曰病去矣存之且喜且訝兒旦夕虞不保兄言何易也仲淳曰視兒目光炯炯且飲食味甘是精神已王胃氣轉矣尋果脫然起臧玉涵子歲半盛夏咳嗽七日因浴受驚又傷食大熱倦頓三日不敢與藥目翳脣繭舌乾謀之仲淳曰此暑病也當與白虎湯玉涵曰腹瀉石膏無害乎曰先以天水散探之服二錢少頃藥夾痰而吐微汗身涼黃昏復熱又以天水散二錢不效仲淳曰其為暑症無疑當以白虎湯加人參因兒患肺熱且止仲淳再診之曰暑邪客於皮膚分肉有熱無寒是為疸瘧斷當用白虎湯連服二劑不效鼻露眼開口不納氣勢甚危叩仲淳曰此正氣不足勝邪也偶思刺瘧論有云凡瘧先時一食頃乃可治過時則失之也又云無刺熇熇之熱無刺渾渾之脈無刺漉漉之汗意者服藥不得時耶將前藥并劑煎露一宿雞鳴溫服之病頓失更不須調理精神漸復經年無病以此知仲淳察病望氣靈心慧眼又知服藥貴及時當早服晚投當晚服早投當熱而溫當溫而熱均失之也此玉涵自定案任邱裴在澗棄家逃禪持戒茹素遍逰五嶽足迹幾滿天下偶客金壇寓西禪寺僧舍酷暑中坐卧小樓日持凖提咒三千念佛號三萬忽患頭痛如斧劈身熱發躁口乾日飲冷水斗餘渴猶未解自分必死莊斂之憐其旅病時過視疾一日急走倉頭召斂之永訣以所攜書畫玩器盡授斂之泣而言曰兄其為我收藏吾死後切勿用世俗禮葬我惟以兩缸盛吾尸其中以三尺地埋之耳斂之涕泗填胸束手無䇿余時將遊梁溪陽羡間斂之命余僕克勤相追歸視其脈知係受暑為疏竹葉石膏湯方斂之如方製藥躬為煎服不二劑發熱口渴俱止幾十劑病始退旋加健脾藥十餘帖而安傷暑霍亂神方包瑞溪學憲傳仲淳纍驗絲瓜葉一片白霜梅肉一枚并核中仁同研極爛新汲水調服入口立瘥又方馬銘鞠傳用粟米連殼搗碎煎湯溫服下口立愈屢試神效又方梁溪顧聖符傳取藊豆葉搗汁一碗飲之立愈又方高存之家僕婦患此仲淳以砂仁一兩炒研鹽一撮沸湯調冷定服一劑愈傷冷物者加吳茱萸四錢又方用青蒿嫩葉手揉如豆大井水吞下數枚立愈治中暑昏眩煩悶欲死扢地深尺餘取黃土以新汲水調化飲一二甌立愈又方取田中泥漿塗臍上令壯者溺其上并溺口中得咽立起治中暑大小便不通用田螺三枚搗爛入青鹽三分攤成膏貼在臍下一寸即愈瘧如發熱口渴先服此方一二劑麥門冬五錢知母蜜炙二錢五分硬石膏研細五錢竹葉三十片粳米一撮煎八分不拘時服治熱多作吐頭痛口渴無汗或汗少白茯苓三錢橘紅二錢山查肉二錢竹茹二錢知母蜜炙二錢麥門冬四錢硬石膏研細五錢治寒多熱少無汗乾薑一錢生用柴胡一錢五分當歸廣皮吳茱萸白术土炒各三錢如吐嘔而寒甚者此方去柴胡當歸加人參二錢半夏薑汁炒一錢如瀉去當歸加茯苓二錢如有食脾胃不健第二方去當歸加白豆蔲末七分如寒熱相半及先寒後熱者第二方加黃芩一錢如汗多加白芍藥酒炒三錢黃耆蜜炙三錢去柴胡如傷食必惡食第二方加山查五錢白豆蔲末七分神麯炒二錢厚朴薑汁炒一錢如渴甚者不可用半夏當用第一方加天花粉二錢倍用麥門冬知母須三四劑方可換健脾胃藥或兼用健脾胃藥如白茯苓白术廣陳皮白芍藥人參白豆蔲山查等劑是也如寒甚只用第二方加人參五錢生薑五片如寒熱俱甚久不止者前方中去白术乾薑加鱉甲醋炙研極細二錢地骨皮二錢麥門冬五錢牛膝五錢太陽經瘧頭痛遍身骨痛項脊覺強主方如渴則兼陽明矣羌活二錢此係太陽主藥前胡一錢五分豬苓一錢澤瀉炒一錢陳皮二錢惡寒加薑皮甚則加桂枝渴則加乾葛渴甚汗多加麥門冬知母竹葉白术久病用黃耆虛甚加人參治秋深寒熱甚而汗多者人參白虎湯中加桂枝素有血證及咳嗽者勿用參桂陽明經瘧熱甚渴甚煩躁惡人聲惡心不眠主方硬石膏研細麥門冬各五錢加至一兩五錢知母去皮蜜炙三錢加至一兩竹葉四十片加至一百片粳米一撮水三大碗煎一碗不拘時服如瘧初發汗未大透本方加乾葛三錢痰多本方加括婁根三錢橘紅三錢竹瀝一杯如嘔本方去竹葉換竹茹三錢橘紅三錢汗多本方去乾葛加人參三錢元氣虛倍之白术三錢如兼惡寒甚指爪色黯本方加桂枝一錢五分頭痛骨痛又兼前症此太陽陽明也本方加羌活二錢如在秋末冬初又兼惡寒加桂枝一錢每日下午别服開胃健脾消食消痰兼除寒熱瘧邪藥一劑方具於後麥門冬五錢鱉甲三錢加至一兩廣橘紅人參各三錢加至五錢素有肺火者勿用白豆蔲仁四分加至七分白茯苓三錢烏梅肉一枚白术二錢加至四錢胃熱及肺火咳嗽勿用牛膝酒洗二錢加至八錢水三鍾煎一鍾研入白豆䓻末乘熱服如熱甚而嘔加木瓜三錢枇杷葉三大片竹茹二錢如虛寒胃弱有痰有濕因而嘔者加半夏礬湯泡一錢加至三錢薑汁十匙加至半杯渴而便燥者勿用少陽經瘧往來寒熱相等口苦而嘔或兼耳聾胸脅痛主方小柴胡湯柴胡黃芩半夏甘草人參鱉甲三錢至七錢牛膝橘紅各三錢至五錢如惡食本方加枳實炒一錢白豆䓻五分如有肺火本方去人參半夏加麥門冬五錢牛膝鱉甲橘紅如故如爪黯便燥及痰盛方中去半夏加當歸三錢竹瀝一大杯惡寒甚本方加桂枝一錢至二錢生薑皮一錢至三錢如兼陽明渴欲引飲此少陽陽明也本方去半夏加石膏八錢麥門冬五錢竹葉三十片每日下午别服開胃健脾消食消痰兼除寒熱瘧邪等藥如前方太隂脾瘧寒從中起寒甚而後熱嘔甚嘔已乃衰主方桂枝二錢人參三錢白芍藥酒炒三錢薑皮三錢水二鍾煎一鍾空心飢時各一服再煎五六分下午别服開胃健脾消食消痰兼除寒熱瘧邪藥如前方少隂經瘧惡寒心煩而渴小便艱澀無汗躁欲去衣或手足冷或欲飲水或咽痛主方鱉甲牛膝各三錢至七錢知母二錢至五錢桂枝一錢至二錢細辛五分橘紅三錢白茯苓三錢豬苓一錢澤瀉一錢人參三錢有肺火勿用薑皮一錢至三錢水二鍾煎八分空腹飢時各一服如寒甚倍人參薑皮如熱甚倍鱉甲牛膝加烏梅肉有痰加竹瀝下午别服開胃健脾消食消痰除寒熱藥大略如前方厥隂經瘧色蒼蒼然善太息不樂主方桂枝一錢至三錢柴胡一錢至三錢鱉甲二錢至四錢當歸三錢至五錢橘紅二錢至三錢牛膝二錢至五錢何首烏五錢水三碗煎一碗空心飢時服便燥及昏暈欲死本方加麥門冬竹瀝下午别服開胃健脾消食消痰除熱藥如前方如有肺火及內熱去桂枝加知母三錢治陽分間日瘧寒熱俱甚煩躁舌胎硬石膏三錢知母五錢麥門冬一兩五錢竹葉一百片括婁根六錢貝母五錢廣陳皮三錢發日加人參五錢有肺熱者勿用薑皮一錢隔夜煎成露一宿五更服治隔一日一發先熱後寒熱少寒多午時發頭疼筋骨痛脣燥口乾惡心無汗後半夜涼天明頭痛止羌活二錢頭不痛即去之乾葛二錢五分陳皮三錢麥門冬五錢知母二錢生薑皮二錢炙甘草五分何首烏五錢水二鍾煎八分露一宿天明溫服治胎前瘧熱多口渴方黃芩酒炒二錢柴胡一錢硬石膏五錢至二兩麥門冬去心五錢至一兩知母去皮蜜炙忌鐵二錢至四五錢廣橘紅二錢至三錢白茯苓三錢竹葉五十片至一百片胃虛加人參二錢至三五錢河水二碗煎八分飢時服發日五更溫服滓再煎六分并進如熱甚寒亦甚本方加生薑皮二錢至四錢白术三錢治胎前瘧寒甚不渴少汗方人參生薑皮各五錢至一兩廣橘紅去白二錢至四錢河水二碗煎八分五更溫服再煎五六分并進寒甚者陽氣虛而下陷也益陽氣則寒自止邪自散矣故應多服人參如汗多并加黃耆五六錢治産後瘧主方當歸三錢至五錢柴胡一錢鱉甲四錢至七錢牛膝一兩白茯苓三錢廣橘紅三錢生薑皮一錢至二錢乾薑炒黑四分至六七分水二鍾煎八分露一宿五更溫服如渴加麥門冬六錢竹葉五十片青蒿三五錢去生薑皮乾薑如渴甚更加知母三錢括婁根三錢痰多并加貝母四錢如脾胃弱加人參三錢至一兩元氣虛亦如之有肺熱者去人參加白芍藥四錢如汗多加黃耆二錢至五錢寒甚加桂枝七分至一錢二分乾薑炒黑七分如惡露未盡亦如之并加益母草五錢黑豆炒一兩蘇木五錢打碎别以綿裹入藥煎熱多加青蒿三四錢治三日瘧寒多當歸酒洗二錢五分桂枝一錢五分乾薑二錢廣陳皮五錢何首烏洗淨切片五錢人參三錢至一兩治三日瘧寒熱俱甚或早晏不齊作止不一鱉甲牛膝何首烏廣橘紅麥門冬各五錢知母三錢桂枝一錢五分薑皮三錢無汗倍之烏梅一枚乾葛三錢汗多或嘔去之無汗倍之水三鍾煎一鍾露一宿發日五更溫服查再煎七分餘日空心飢時服如渴加石膏一兩竹葉五十片渴止去之氣虛加人參五錢如汗多加黃耆三錢兼便燥加歸身五錢不思食及食難化加人參五錢白豆蔲仁七分厚朴一錢五分如泄去石膏知母竹葉倍白术加茯苓三錢車前子二錢肉豆蔲一錢澤瀉一錢痰多加竹瀝一大杯治三日瘧熱多渴甚鱉甲牛膝何首烏麥門冬各五錢加至兩二錢知母四錢加至七錢橘紅五錢石膏八錢加至三兩竹葉三十片至百片水三大碗煎一碗露一宿發日五更溫服如惡食加青皮醋炒一錢五分白豆蔲仁七分無汗或有汗而少加乾葛四錢汗多本方加人參白术氣虛倍加人參如嘔本方加竹茹烏梅便燥加當歸得汗渴止去石膏乾葛下午别服開胃健脾消食消痰藥如前法治三日瘧寒多熱少汗少或無汗人參白术各五錢至一兩橘紅四錢至六錢桂枝二錢至三錢薑皮五錢至一兩白豆蔲仁七分水三碗煎一碗露一宿發日五更溫服渣再煎七分連進不拘時空心飢時服治三日瘧隂分黃氏姑服之立起何首烏一兩牛膝一兩當歸五錢便燥用胃弱勿用鱉甲醋炙一兩廣橘紅三錢水三鍾煎一鍾空心服立愈虛極者加人參一兩治三日瘧人參一兩生薑皮五錢水二鍾煎八分空心服于中父病瘧初服此不效仲淳堅持此方加參至三兩生薑皮至一兩五錢二服即起治瘧邪未盡而痢作者先服此方二三劑鱉甲三錢廣陳皮去白三錢白茯苓三錢柴胡一錢白芍藥三錢乾葛一錢如惡寒寒熱交作加柴胡二錢生薑皮一錢如渴去薑皮加寒水石七錢滑石四錢如無汗加乾葛二錢至三四錢可服參者加參三錢次服方服之滯下必止乾葛二錢五分升麻醋炒七分蓮肉去心四十粒炒灸甘草一錢烏梅肉二枚廣橘紅三錢白藊豆炒二錢鱉甲二錢白茯苓二錢白芍藥酒炒三錢黃芩闕炒一錢五分川黃連土炒二錢加至三錢河水二鍾半煎八分調水飛過滑石末四錢兼吞滯下丸二三服送以葛根湯或蓮子湯亦佳如腹痛以炒砂仁三四錢濃湯吞滯下丸治久瘧不已似勞證當歸酒洗五錢便燥者用牛膝酒浸五錢鱉甲三錢何首烏白採鮮者五錢廣橘紅三錢生薑皮二錢五分柴胡一錢五分已上二味熱多無汗者用有汗則去之貝母三錢水三鍾煎一鍾加竹瀝一大杯發日五更時服隔夜先煎露一宿臨服時再重湯頓溫蓋瘧者暑氣為病也暑得露即解世鮮知者防瘧方夏秋不輟必無瘧矣何首烏十二兩真茅山蒼术十兩半夏六兩橘紅八兩人參四兩白茯苓八兩藿香葉三兩白豆蔲仁一兩五錢為細末米粉糊加薑汁丸如菉豆大每五錢下午及臨卧白湯吞仲淳年十七時為瘧所苦凡湯液丸飲巫祝靡不備嘗終無救於病遍檢方書乃知瘧之為病暑邪所致也經曰夏傷於暑秋必痎瘧遂從暑治不旬日瘳後數以意消息散邪之外專養胃氣痰多者消痰氣虛者補氣血虛者益血又分臟腑經絡各從其類以施向導即經年不愈者竟霍然起矣沈少卿中丞請告時苦瘧仲淳往診之憊甚曰再一發死矣先生何方立止之仲淳曰何言之易也疏三方作五劑一日夜飲盡次早瘧止先二劑清暑用大劑竹葉石膏湯加桂枝以其渴而多汗也次二劑健脾去積滯用橘紅白豆蔲白术茯苓穀蘖烏梅白藊豆山查麥芽最後一劑人參一兩生薑皮一兩水煎露一宿五更溫服盡劑而效顧伯欽患瘧仲淳之門人疏方以白虎湯加人參一兩一庸工云豈有用參至兩數者乎改用清脾飲二十餘劑而瘧不止體尫弱仲淳至笑曰此虛甚非參不可吾徒不謬也投以大劑參茋一劑而瘥人參一兩黃茋蜜炙一兩知母蜜炙五錢陳皮二錢乾葛二錢甘草八分石膏五錢莊斂之妾患瘧寒少熱甚汗少頭痛不嗜飲食余為診脈洪數而實用麥門冬五錢知母三錢五分石膏一兩五錢竹葉六十片粳米一撮橘紅二錢牛膝一兩乾葛三錢白茯苓三錢白藊豆三錢三劑不應忽一日凡寒熱者再昏迷沉困不省人事勢甚危急斂之過余云恐是虛弱前方石膏知母竹葉似近寒涼非其治也余亦心疑為去石膏等而加人參二錢已别矣余追想前脈的非屬虛急令人往視令其將參煎好勿輕與服待按脈加斟酌焉次早往視其脈洪數如初急止人參勿服惟仍用前方而加石膏至二兩何首烏五錢令其日進二劑瘧遂止莊斂之前患瘧妾越一載忽頭痛如裂心內雜亂不清喉作痛失音舌破咳嗽有痰胸膈飽脹惡心不思飲食如此者四日矣日漸增劇陡發寒熱如瘧狀寒少熱多熱後頻出汗方解平時有心口痛證并作下元無力如腳氣狀斂之疑為傷寒余曰此受暑之證即前年所患瘧而勢加劇耳法當先去其標令以石膏二兩麥門冬五錢知母三錢橘紅二錢半牛膝五錢鱉甲四錢竹葉一百五十片貝母三錢括婁根三錢河水煎服三四劑心內清頭疼喉痛失音舌破飽脹寒熱俱愈但惡心不思食如故而心口痛下元無力不減余為去石膏知母竹葉鱉甲貝母括婁根而加延胡索二錢五靈脂七分生蒲黃一錢五分薏苡仁八錢木瓜二錢石斛三錢白藊豆三錢白芍藥三錢竹茹二錢枇杷葉三大片炙甘草四分幾十劑而愈高存之甥女嫁後患胎瘧久不止仲淳云病在隂分以人參五錢牛膝一兩兼健脾清暑一劑而止章衡陽子室患瘧後失音寒熱愈甚告急仲淳仲淳云此必瘧時不遇明眼人妄投半夏故也投以大劑麥門冬白茯苓炙甘草鱉甲知母貝母數劑瘳治停食發瘧梁溪王興甫偶食牛肉覺不快後遂發瘧飲食漸減至食不下咽已而水飲亦不下白湯過喉間嘔出作碧色藥不受小便一滴如赤茶大便閉諸醫束手仲淳忽至視之令仰卧以指按至心口下偏右大叫因詢得其由用丸藥一服至喉輒不嘔水道漸通次日下黑物數塊如鐵丸藥用礬紅和平胃散作末棗肉和丸白湯下三錢其病如失再以人參五錢麥門冬五錢橘紅三錢白芍藥三錢水煎服四日起闕丸方闕蟲煆存性研極細一兩半廣橘紅十兩五錢射干晒乾一兩闕人參八錢肉桂去皮六錢乾漆煅煙起存性研如飛塵五錢為極細末醋煮稀糯糊和丸如梧子大每四錢空心淡鹽湯下痢滯下如金丸滯下俗呼痢疾真川黃連真薑汁浸隔土如法炒九次不拘斤兩細末薑汁和水跌丸如梧子大貯磁器中封固如胃弱以蓮子四十粒橘紅二錢人參二錢升麻醋炒七分煎湯吞四錢腹痛以白芍藥三錢炙甘草一錢黃檗一錢升麻醋炒七分煎湯吞四錢已後各條加減皆以丸藥四錢為率裏急甚以白芍藥三錢炙甘草一錢當歸二錢升麻醋炒七分煎湯吞四錢後重甚加檳榔一錢五分枳殼一錢木香汁七匙調入口渴及發熱調滑石末三錢去木香小便赤澀短少或不利加滑石末三錢調入各症湯中吞藥赤多加烏梅肉二錢山查肉三錢紅麯二錢兼裏急用當歸等加入如前方白多加吳茱萸湯泡一次七分黃芩酒炒一錢五分惡心欲吐即噤口痢多加人參石蓮肉緑色升麻醋炒可用至八分或一錢白藊豆炒三錢白芍藥酒炒三錢久痢不止加肉豆蔲一錢蓮肉去心炒黃三錢砂仁炒一錢五分人參三錢白藊豆炒去殼二錢炙甘草一錢橘紅二錢白芍藥酒炒三錢白茯苓二錢細末煉蜜丸如梧子大每服三錢米湯下若積滯未盡加滑石末三錢每服四錢白湯吞水瀉無積滯者用人參橘紅炒砂仁湯吞三錢凡治滯下非元氣壯實多噉能食之人慎勿輕用大黃巴豆牽牛甘遂大戟等下藥凡産後滯下積滯雖多腹痛雖極不可用大黃等藥行之致傷胃氣遂不可救但用人參白芍藥當歸紅麯升麻醋炒益母草加炙甘草一倍滑石末四五錢足矣若惡露未盡兼用乳香沒藥各七分五釐炒砂仁末一錢久之自愈血虛可加阿膠二錢蛤粉炒凡胎前滯下宜用黃芩黃連白芍藥炙甘草橘紅赤麯枳殼蓮肉炒略用升麻未滿七月勿用滑石證急者必須用之不拘此例護心奪命丹治虛弱人患痢及痢久脾胃虛者肉豆蔲一兩五錢白芍藥酒炒六兩炙甘草一兩廣橘紅三兩白藊豆炒三兩滑石六兩赤麯炒研四兩蓮肉去心炒焦黃五兩緑色升麻醋炒二兩五錢川黃連切片拌好酒同吳茱萸浸二宿瓦上炒乾分開連萸各貯淨黃連三兩白痢加茱萸一兩細末煉蜜丸如菉豆大每服三錢白湯吞如噤口痢并虛弱人即以前方中去豆蔲另用人參三錢煎濃湯吞加味滯下丸川黃連白痢如前法赤痢用濕槐花炒去槐花八兩白芍藥酒浸切片炒五兩烏梅肉二兩滑石水飛如法六兩炙甘草二兩升麻緑色者醋炒三兩蓮肉去心炒如法六兩白藊豆炒去殼三兩紅麴簸淨炒五兩乾葛二兩為細末蜜丸每五錢白湯吞飢時服證重者日三服又滯下丸川黃連如法製一斤滑石末八兩檳榔四兩炙甘草三兩木香為末和水隔湯燖二兩五錢枳殼炒五兩白芍藥酒炒五兩細末荷葉湯稍加薑汁糊成丸如菉豆大每服三四錢烏梅湯吞若加吳茱萸白藊豆陳皮各三兩治白痢作四樣一無木香一無檳榔枳殼一加當歸一加吳茱萸白藊豆橘紅去檳榔枳殼燥熱煩渴惡心者勿用木香元氣虛弱者勿用檳榔枳殼積滯多而後重者用檳榔枳殼裏急色赤者用當歸惟惡心嘔吐及不思食者勿用久痢加肉豆蔲治血痢痛甚湯液仲淳傳自包瑞溪學憲試之神效白芍藥酒炒五錢此一味仲淳加入者枳殼槐花同炒去槐花五錢升麻醋炒七分真川黃連薑汁炒五錢滑石末三錢乳香沒藥各七分五釐山查肉三錢甘草五分治噤痢神效緑色升麻醋炒一錢人參三錢蓮肉去心炒焦黃三十枚水一鍾煎半鍾飲之蜜和為丸更妙每四錢一服白湯吞治久痢紅中兼有青色白痰間發熱真川黃連槐花炒一錢五分白芍藥酒炒二錢廣陳皮三錢人參一錢蓮肉炒十二枚肉豆蔲八分炙甘草五分山查肉二錢緑升麻醋炒五分砂仁炒一錢滑石末二錢五分調服治噤口痢吐不納藥者人參一兩川黃連薑汁製五錢石蓮子炒去心五錢水二鍾煎八分小杯緩服之吐止痢亦止大黃丸痢初起壯實者可用胃弱者禁施川大黃切片蜜蒸一斤白芍藥酒浸切片炒六兩甘草炙三兩檳榔四兩木香切片不見火為末一兩枳殼炒四兩細末煉蜜同水煎木香和搗為丸如菉豆大白萊蔔湯吞三錢重者五錢以行兩三次腹中爽快為度胃氣虛極之人勿輕用之積滯重而元氣虛者以人參湯吞孕婦以人參縮砂湯吞行後另用人參丸補之豫家夏秋患此甚衆輒依前方療之歲為常并以應里中之索方者一一神驗黃聚川年兄太夫人年八十餘偶患痢胸膈脹絶粒數日豫以升麻人參黃連蓮肉方授之參至一兩諸子駭甚再問豫豫曰遲則不救矣一劑啜粥再劑腹中響一泄痢即止今年九十餘尚健也陳赤石督學因校士過勞感暑遂滯下純血醫皆難之陳刺史曰此非繆仲淳莫能療也使者旁午得之吳門一日夜馳至武林仲淳診得其所由遂用人參五錢升麻七分炙甘草一錢五分烏梅二枚紅麯一錢五分川黃連三錢白芍藥二錢蓮肉四十粒煎調滑石末五錢二劑而愈督學曰痢止矣心搖搖不能閲卷奈何仲淳曰此勞心太過暑因客之故爾加竹葉乾葛酸棗仁一劑遂平姚公遠幼子病痢一醫誤下之遂下純血氣喘身熱不思食仲淳偶至亟以人參四五錢石蓮子白芍藥升麻橘紅草石蠶白藊豆滑石末炙甘草投以一劑喘平血止又數劑痢止仲淳臨别囑公遠曰兒百日內不出痘則生以下多元氣未復故也未幾即痘果殤家弟稚端幼病痢甚日夜數十次服數劑即愈人參三錢吳茱萸滚湯泡七次一錢川黃連薑汁炒一錢後二味飯鍋上蒸水煎至八分溫服如不受以藥一匙間米湯一匙漸漸飲之胃氣漸復如頭痛發熱前方中加寒水石六錢即硬石膏乾葛一錢别調六一散四錢冷水服庚子秋華氏妹歸寧忽痢日夜幾百行身熱發嘔一嘔數十聲不絶吳醫爭欲下之且曰補即死矣時仲淳以先王母病留湖濵憐其促治後事甚亟曰既已知危何不以藥試之服如金丸因思飲豫固守仲淳前方以人參五錢炒黃連白藊豆升麻滑石炙甘草橘紅再進如金丸二劑勢稍定更數服愈華水部至今感服友人虞元靜房中人方孕五月患滯下腹痛日不下數次為定此方甫服一鍾覺藥行至腹即解一次痛亦隨已滯下全愈川黃連四錢白芍藥三錢黃芩三錢白藊豆二錢蓮肉四十粒橘紅一錢半枳殼三錢紅麯二錢乾葛一錢半升麻五分炙甘草一錢烏梅肉一枚治毒痢及發疹時疹毒下利方鮮金銀藤即忍冬藤數兩煎濃汁三大碗入地榆五錢川黃連槐花濕拌炒四錢黃檗二錢黃芩二錢白芍藥酒炒三錢炙甘草二錢升麻緑色者醋炒六分同煎至一碗調水飛過滑石末五錢不拘時服治濕熱腹痛一少年貴介暑月出外飲食失宜兼以暑熱遂患滯下途次無藥病偶自止歸家腹痛不己遍嘗諸醫之藥藥入口痛愈甚亦不思食仲淳視之曰此濕熱爾其父曰醫亦以濕熱治之而轉劇仲淳曰投何藥曰蒼术黃連厚朴枳殼陳皮等仲淳曰誤也术性溫而燥善閉氣故滯下家忌之郎君隂虛人也尤非所宜更以滑石一兩為細末以牡丹皮汁煮之别以白芍藥酒炒五錢炙甘草二錢炒黑乾薑五分水煎調滑石末服之須臾小便如注痛立止秦公蕃病痢醫誤投澀劑一服痢止濕熱無自而出遍攻肢體骨節間以致項強目赤肩臂腕膝足脛俱發腫痛甚不能轉側仲淳疏方寄之用白芍藥石斛牛膝木瓜黃檗薏苡仁炙甘草車前子茯苓痛雖止尚不能轉側更用蒺藜菊花何首烏胡麻黃檗炙甘草復逾年愈其始病時一醫稍投參术痛極欲死此係本證隂虛有火又加濕熱暑濕交攻故現此證名痢風隂虛火多故不受補又不宜燥惟微寒清平之劑調之久之自愈凡治滯下與大腸滑泄自利不止不同滑泄自利不止有可澀之道故古人有間用罌粟殼及訶利勒以止其滑泄若夫滯下本屬濕熱澀滯不行法宜疏利藥忌兜澀大腸者肺之腑也大腸既有濕熱留滯則肺家亦必有熱肺乃華蓋之藏經曰脾氣散精上歸於肺通調水道下於膀胱是肺氣喜通利惡閉澀故古人藥性中每云通肺氣其意槩可見已倘誤用罌粟殼訶利勒使濕熱無所宣泄肺氣不得下行非惟滯下增劇濕熱熏蒸上干乎肺則脹悶氣逆不得眠不思食諸證至矣又有久嗽不愈緣於肺虛有火法當清肺潤肺忌用澀慘閉氣之藥設若誤用粟殼訶子俾火壅於肺不得下降若兼參术半夏即死不旋踵矣世醫往往蹈此覆轍相尋卒無悟者聊為論著敢告方來已上瘧痢二門諸方皆仲淳斟酌所定因證加減與時消息可謂詳且盡矣然不盡用方書所載投之輒效百不爽一蓋獨開門户者也外有時行疫痢一證三十年前間或有之今則往往夏末秋初沿門闔境患此其證大都發熱頭疼口渴煩躁下痢溺澀甚者一日夜行百次或兼發斑疹勢甚危迫世醫妄指為漏底殊不知此是時氣使然因世人稟賦漸薄積感濕蒸厲氣所致治法當清熱解毒表散為急如升麻葛根柴胡黃連黃芩之類或熱甚渴甚前藥中可加寒水石更有别證以意加減切忌下行破氣收澀如大黃芒硝檳榔枳實烏梅粟殼等犯此者多致不救上一條附先醒齋廣筆記卷一
